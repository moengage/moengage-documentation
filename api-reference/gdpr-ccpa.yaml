openapi: 3.0.3
info:
  title: MoEngage GDPR / CCPA API
  description: |
    API to create or update user rights for **GDPR** (General Data Protection Regulation) or **CCPA** (California Consumer Privacy Act) compliance, including the right to erase personal data.
  version: '1.0'
servers:
  # Updated server configuration based on best practice for API playground enablement.
  - url: 'https://api-0{X}.moengage.com/v1'
    description: MoEngage API Server
    variables:
      X:
        default: '1'
        description: 'Your MoEngage Data Center (DC) number. Refer to MoEngage docs for your correct DC.'
tags:
  - name: GDPR
    description: Manage user data requests for GDPR and CCPA compliance.
security:
  - basicAuth: []
paths:
  /opengdpr_requests/{Workspace_ID}:
    post:
      tags:
        - GDPR
      summary: Submit a GDPR/CCPA Data Request
      description: |
        GDPR / CCPA API ensures all the rights of users are created or updated for GDPR / CCPA compliance. You can erase the personal data of specific users as defined under GDPR using the Erase API.
        
        For more details on GDPR Compliance with MoEngage, refer to [GDPR-Implementation](https://help.moengage.com/hc/en-us/articles/360000878126-GDPR).
        
        For more details on CCPA Compliance with MoEngage, refer to [CCPA-Implementation](https://help.moengage.com/hc/en-us/articles/360052917232-CCPA).

        <Note>
          The Workspace_ID for your MoEngage account is available on the MoEngage Dashboard in **Settings** > **Account** > **APIs** > **Workspace ID** (earlier app id).
          </Note>

      operationId: submitGdprRequest
      x-mint:
        # Injecting supplementary content from the documentation (Rate Limits, Callouts, Notes).
        content: |
          ### Request Limitations
          
          <Note>
          The maximum limit per request is **100 KB**. The maximum payload size is **128 KB**.
          </Note>
          
          <Warning>
          **Important Note on Deletion:** Multiple users **cannot** be deleted using this API in a single payload. If an email ID associated with multiple users is passed for an erasure request, **all** associated users will be deleted.
          </Warning>
      parameters:
        - name: Workspace_ID
          in: path
          required: true
          schema:
            type: string
          description: |
            The Workspace ID for your MoEngage account. This is required for routing the request.
          example: 'YOUR_WORKSPACE_ID_XXXX'
        - name: MOE-APPKEY
          in: header
          required: true
          schema:
            type: string
          description: |
            The **Content-Type** header is mandatory and is set to **`application/json`** as follows:

            ```json
            {"Content-Type": "application/json"}
            ```
            
            Get the **Workspace ID** from the MoEngage dashboard as explained in the 
            [Authentication](https://help.moengage.com/hc/en-us/articles/4405026835220#01GKF4WPVPZCWQJPY43PEDK9NB)
            section and send in the header as follows:

            ```json
            {"MOE-APPKEY" :"<Workspace ID>"}
            ```
          example: 'YOUR_WORKSPACE_ID_XXXX'
      requestBody:
        description: |
          The GDPR/CCPA request payload, containing the type of request and the user identities. The maximum payload size is **100kb**.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GdprRequest'
            example:
              request_type: erasure
              submitted_time: '2018-10-05T15:00:00Z'
              identities:
                - identity_type: email
                  identity_value: johndoe@example.com
              api_version: '1.0'
      responses:
        '200':
          description: Successful request. Your request has been accepted and will be processed soon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GdprSuccessResponse'
              example:
                status: success
                message: Your request has been accepted and will be processed soon.
                request_id: 'a7551968-d5d6-44b2-9831-815ac9017798'
        '400':
          description: Bad Request. The request was malformed (e.g., malformed JSON, missing required fields).
        '401':
          description: Authentication Failure. Check your Basic Auth credentials (Workspace ID and Data API Key).
        '413':
          description: Payload Too Large. The request payload exceeds the 100kb limit.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Erase API uses basic authentication to control access to your data.

        The API request will be authenticated through Basic Authentication. Basic Authentication sends a Base64-encoded string containing your username and password with every API request. It encodes a 'username:password' string in Base64 and appends the encoded string with 'Basic '. This string is included in the authorization header as shown below:

        `{"Authorization: Basic Base64_ENCODED_WORKSPACEID_APIKEY=="}`

        The username and password details can be obtained from the MoEngage Dashboard. If you're using the API for the first time, follow these steps:

        1. Navigate to **Settings** -> **Account** -> **APIs**.
        2. Copy the following details:
           * **Username**: Under **Workspace ID** (earlier app id), click the copy icon to copy the username.
           * **Password**: In the **API keys** section, click the copy icon in the **Data** tile to copy the API key.
        3. Use these details to authenticate the API requests.
  schemas:
    GdprRequest:
      type: object
      required:
        - request_type
        - submitted_time
        - identities
        - api_version
      description: The main object representing a GDPR or CCPA compliance request.
      properties:
        request_type:
          type: string
          description: This field specifies the type of request, typically for data access or data erasure.
          example: erasure
        submitted_time:
          type: string
          format: date-time
          description: The time when the request was sent, formatted in **ISO 8601** format.
          example: '2018-10-05T15:00:00Z'
        identities:
          type: array
          description: An array providing the details of the user(s) for the request (e.g., email address, phone number).
          items:
            $ref: '#/components/schemas/UserIdentity'
        api_version:
          type: string
          description: The version of the GDPR API used to send this request.
          example: '1.0'
    UserIdentity:
      type: object
      description: An object representing a user's identity detail.
      properties:
        identity_type:
          type: string
          description: The type of user identifier being provided.
          enum:
            - id
            - user_secondary_id
            - email
            - mobile
            - google_advertising_id
            - advertising_identifier
          example: email
        identity_value:
          type: string
          description: The actual value for the specified user identifier.
          example: johndoe@example.com
    GdprSuccessResponse:
      type: object
      description: Standard successful response object for a submitted GDPR request.
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: A human-readable message confirming the request was accepted.
          example: Your request has been accepted and will be processed soon.
        request_id:
          type: string
          format: uuid
          description: A unique ID generated for the submitted request.
          example: 'a7551968-d5d6-44b2-9831-815ac9017798'