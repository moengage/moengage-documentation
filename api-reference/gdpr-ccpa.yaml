openapi: 3.0.3
info:
  title: MoEngage GDPR / CCPA API
  description: |
    API to create or update user rights for **GDPR** (General Data Protection Regulation) or **CCPA** (California Consumer Privacy Act) compliance, including the right to erase personal data.
  version: '1.0'
servers:
  # Updated server configuration based on best practice for API playground enablement.
  - url: 'https://api-0{X}.moengage.com/v1'
    description: MoEngage API Server
    variables:
      X:
        default: '1'
        description: 'Your MoEngage Data Center (DC) number. Refer to MoEngage docs for your correct DC.'
tags:
  - name: GDPR
    description: Manage user data requests for GDPR and CCPA compliance.
security:
  - basicAuth: []
paths:
  /opengdpr_requests/{Workspace_ID}:
    post:
      tags:
        - GDPR
      summary: Submit a GDPR/CCPA Data Request
      description: |
        This endpoint is used to submit a GDPR or CCPA request, such as a request for data erasure or data access.
        
        The API ensures that all the specified rights of users are created or updated for GDPR/CCPA compliance. The primary use case is to erase the personal data of specific users.
      operationId: submitGdprRequest
      x-mint:
        # Injecting supplementary content from the documentation (Rate Limits, Callouts, Notes).
        content: |
          ### Request Limitations
          
          <Note>
          The maximum payload size is **100kb** (as per the requestBody description) or **128 KB** (as per the FAQ). To ensure robustness, we enforce the **100kb** limit.
          </Note>
          
          <Warning>
          **Important Note on Deletion:** Multiple users **cannot** be deleted using this API in a single payload. If an email ID associated with multiple users is passed for an erasure request, **all** associated users will be deleted.
          </Warning>
      parameters:
        - name: Workspace_ID
          in: path
          required: true
          schema:
            type: string
          description: |
            The Workspace ID for your MoEngage account. This is required for routing the request.
          example: 'YOUR_WORKSPACE_ID_XXXX'
        - name: MOE-APPKEY
          in: header
          required: true
          schema:
            type: string
          description: |
            This is the MoEngage Workspace ID (formerly known as APP ID) sent in the header for authentication.
          example: 'YOUR_WORKSPACE_ID_XXXX'
      requestBody:
        description: |
          The GDPR/CCPA request payload, containing the type of request and the user identities. The maximum payload size is **100kb**.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GdprRequest'
            example:
              request_type: erasure
              submitted_time: '2018-10-05T15:00:00Z'
              identities:
                - identity_type: email
                  identity_value: johndoe@example.com
              api_version: '1.0'
      responses:
        '200':
          description: Successful request. Your request has been accepted and will be processed soon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GdprSuccessResponse'
              example:
                status: success
                message: Your request has been accepted and will be processed soon.
                request_id: 'a7551968-d5d6-44b2-9831-815ac9017798'
        '400':
          description: Bad Request. The request was malformed (e.g., malformed JSON, missing required fields).
        '401':
          description: Authentication Failure. Check your Basic Auth credentials (Workspace ID and Data API Key).
        '413':
          description: Payload Too Large. The request payload exceeds the 100kb limit.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic Authentication using your **Workspace ID** (as the username) and a **Data API Key** (as the password).
        Credentials can be found on the MoEngage Dashboard in the **Settings > Account > APIs** section.
  schemas:
    GdprRequest:
      type: object
      required:
        - request_type
        - submitted_time
        - identities
        - api_version
      description: The main object representing a GDPR or CCPA compliance request.
      properties:
        request_type:
          type: string
          description: This field specifies the type of request, typically for data access or data erasure.
          example: erasure
        submitted_time:
          type: string
          format: date-time
          description: The time when the request was sent, formatted in **ISO 8601** format.
          example: '2018-10-05T15:00:00Z'
        identities:
          type: array
          description: An array providing the details of the user(s) for the request (e.g., email address, phone number).
          items:
            $ref: '#/components/schemas/UserIdentity'
        api_version:
          type: string
          description: The version of the GDPR API used to send this request.
          example: '1.0'
    UserIdentity:
      type: object
      description: An object representing a user's identity detail.
      properties:
        identity_type:
          type: string
          description: The type of user identifier being provided.
          enum:
            - id
            - user_secondary_id
            - email
            - mobile
            - google_advertising_id
            - advertising_identifier
          example: email
        identity_value:
          type: string
          description: The actual value for the specified user identifier.
          example: johndoe@example.com
    GdprSuccessResponse:
      type: object
      description: Standard successful response object for a submitted GDPR request.
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: A human-readable message confirming the request was accepted.
          example: Your request has been accepted and will be processed soon.
        request_id:
          type: string
          format: uuid
          description: A unique ID generated for the submitted request.
          example: 'a7551968-d5d6-44b2-9831-815ac9017798'