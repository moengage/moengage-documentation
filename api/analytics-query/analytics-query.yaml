openapi: 3.0.3
info:
  title: MoEngage Analytics Query API
  version: '5.0'
  description: |
    Asynchronous REST APIs to run MoEngage Analytics queries — Behavior, Funnels, Retention,
    Session/Source (BFRS) and User Property Analysis (UPA) — and retrieve their results.

    These queries are asynchronous. A `POST` registers the query and immediately returns a
    `request_id`; a worker executes the query; you then poll the status and fetch the results:

    1. **Submit** — `POST` one of the analysis endpoints. The response echoes the analysis `type` and returns a `request_id`.
    2. **Poll** — `GET /v5/analytics/query/{request_id}/status` until `status` is `SUCCESSFUL` (or `FAILED`).
    3. **Fetch** — `GET /v5/analytics/query/{request_id}/results` to retrieve the resolved series.
servers:
  - url: 'https://api-{dc}.moengage.com'
    description: MoEngage API Server
    variables:
      dc:
        default: '01'
        description: 'The ''dc'' in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ''dc'' in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101.'
tags:
  - name: Analytics Queries
    description: Register asynchronous BFRS and UPA analytics queries, then poll status and fetch results.
security:
  - basicAuth: []
paths:
  /v5/analytics/behavior:
    post:
      tags: [Analytics Queries]
      summary: Register a Behavior Query
      operationId: submitBehaviorQuery
      description: |
        Registers an asynchronous Behavior analysis query and returns a `request_id`. Behavior analysis measures how many users perform one or more events over a time range, broken down by the dimensions you choose.

        Use the `request_id` with [Get Query Status](/api/analytics-queries/get-query-status) to poll for completion, then [Get Query Results](/api/analytics-queries/get-query-results) to fetch the resolved series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BehaviorQueryRequest" }
            example: {
                "version": "2.0",
                "type": "behavior",
                "analysis_type": "events",
                "events": [
                  {
                    "id": "A",
                    "actions": [
                      {
                        "c_at_trigger_seg_v2": {
                          "included_filters": {
                            "filter_operator": "and",
                            "filters": [
                              {
                                "filter_type": "actions",
                                "action_name": "MOE_APP_OPENED",
                                "execution": { "type": "atleast", "count": 1 },
                                "executed": true,
                                "attributes": { "filter_operator": "and", "filters": [] }
                              }
                            ]
                          }
                        },
                        "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } }
                      }
                    ],
                    "split_by": [],
                    "aggregation": {}
                  }
                ],
                "segmentation": [
                  { "filters": { "included_filters": { "filter_operator": "and", "filters": [ { "id": "moe_all_users", "name": "All Users", "filter_type": "custom_segments" } ] } } }
                ],
                "user_attr_grouped_by": [],
                "distribution": {},
                "timerange": { "start": "2026-06-09 00:00:00", "end": "2026-06-16 23:59:59", "label": "Last 7 Days", "dt_label": "last", "value": 7 },
                "granularity": "d",
                "chart_type": "line",
                "count_type": "number",
                "chart_plot_type": "linear",
                "rolling_value": -1,
                "user_aggregation_type": "",
                "user_aggregation_percentile": -1,
                "comparison_timerange": {},
                "chart_sort_type": "descending"
              }
      responses:
        "200":
          description: Query registered. Poll status and fetch results with `data.request_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRegistration" }
              example:
                response_id: "fc803857-632e-4bf0-8df1-fbc2bdeedb66"
                type: "behavior"
                data: { request_id: "REQUEST_ID" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/QuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v5/analytics/funnels:
    post:
      tags: [Analytics Queries]
      summary: Register a Funnels Query
      operationId: submitFunnelsQuery
      description: |
        Registers an asynchronous Funnels analysis query and returns a `request_id`. Funnels analysis measures step-by-step conversion and drop-off across an ordered sequence of events.

        Use the `request_id` with [Get Query Status](/api/analytics-queries/get-query-status) to poll for completion, then [Get Query Results](/api/analytics-queries/get-query-results) to fetch the resolved series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunnelsQueryRequest" }
            example: {
                "events": [
                  {
                    "from_step": null, "to_step": null, "step_type": "include", "step_number": 1,
                    "c_at_trigger_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [ { "filter_type": "actions", "action_name": "MOE_APP_OPENED", "execution": { "type": "atleast", "count": 1 }, "executed": true, "attributes": { "filter_operator": "and", "filters": [] } } ] } },
                    "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } }
                  },
                  {
                    "from_step": null, "to_step": null, "step_type": "include", "step_number": 2,
                    "c_at_trigger_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [ { "filter_type": "actions", "action_name": "UPDATE", "execution": { "type": "atleast", "count": 1 }, "executed": true, "attributes": { "filter_operator": "and", "filters": [] } } ] } },
                    "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } }
                  }
                ],
                "segmentation": [
                  { "filters": { "included_filters": { "filter_operator": "and", "filters": [ { "id": "moe_all_users", "name": "All Users", "filter_type": "custom_segments" } ] } } }
                ],
                "funnel_type": "user_funnel",
                "timerange": { "start": "2026-07-07 00:00:00", "end": "2026-07-14 23:59:59", "label": "Last 7 Days", "dt_label": "last", "value": 7 },
                "grouped_by_meta": {},
                "grouped_by": [],
                "holding_attributes_meta": {},
                "holding_attributes": [],
                "funnel_window": 86400,
                "funnel_window_multiplier": 86400,
                "strict_order": false,
                "distribution": {},
                "countType": "number",
                "showConversionEventOnly": false,
                "chart_type": "column",
                "comparison_timerange": {},
                "version": "2.0",
                "type": "funnel",
                "granularity": "e",
                "chart_plot_type": "linear"
              }
      responses:
        "200":
          description: Query registered. Poll status and fetch results with `data.request_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRegistration" }
              example:
                response_id: "498b1a8f-027b-4aba-b71e-2f6fac76deba"
                type: "funnel"
                data: { request_id: "REQUEST_ID" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/QuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v5/analytics/retention:
    post:
      tags: [Analytics Queries]
      summary: Register a Retention Query
      operationId: submitRetentionQuery
      description: |
        Registers an asynchronous Retention analysis query and returns a `request_id`. Retention analysis groups users who performed a first event into cohorts, then measures how many return to perform a second event in each later period.

        Use the `request_id` with [Get Query Status](/api/analytics-queries/get-query-status) to poll for completion, then [Get Query Results](/api/analytics-queries/get-query-results) to fetch the resolved series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionQueryRequest" }
            examples:
              basic:
                summary: Daily retention for all users
                value: {
                    "version": "2.0",
                    "type": "retention",
                    "events": [
                      { "id": "first", "actions": [ { "c_at_trigger_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [ { "filter_type": "actions", "action_name": "MOE_APP_OPENED", "execution": { "type": "atleast", "count": 1 }, "executed": true, "attributes": { "filter_operator": "and", "filters": [] } } ] } }, "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } } } ] },
                      { "id": "return", "actions": [ { "c_at_trigger_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [ { "filter_type": "actions", "action_name": "UPDATE", "execution": { "type": "atleast", "count": 1 }, "executed": true, "attributes": { "filter_operator": "and", "filters": [] } } ] } }, "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } } } ] }
                    ],
                    "segmentation": [
                      { "filters": { "included_filters": { "filter_operator": "and", "filters": [ { "id": "moe_all_users", "name": "All Users", "filter_type": "custom_segments" } ] } } }
                    ],
                    "timerange": { "start": "2026-07-07 00:00:00", "end": "2026-07-14 23:59:59", "label": "Last 7 Days", "dt_label": "last", "value": 7 },
                    "granularity": "d",
                    "chart_type": "line",
                    "retention_type": "every",
                    "split_by": [],
                    "comparison_timerange": {}
                  }
              withSplitAndComparison:
                summary: Split by platform, compared against the previous period
                value: {
                    "version": "2.0",
                    "type": "retention",
                    "events": [
                      { "id": "first", "actions": [ { "c_at_trigger_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [ { "filter_type": "actions", "action_name": "MOE_APP_OPENED", "execution": { "type": "atleast", "count": 1 }, "executed": true, "attributes": { "filter_operator": "and", "filters": [] } } ] } }, "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } } } ] },
                      { "id": "return", "actions": [ { "c_at_trigger_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [ { "filter_type": "actions", "action_name": "UPDATE", "execution": { "type": "atleast", "count": 1 }, "executed": true, "attributes": { "filter_operator": "and", "filters": [] } } ] } }, "c_at_act_seg_v2": { "included_filters": { "filter_operator": "and", "filters": [] } } } ] }
                    ],
                    "segmentation": [],
                    "timerange": { "start": "2026-07-07 00:00:00", "end": "2026-07-14 23:59:59", "label": "Last 7 Days", "dt_label": "last", "value": 7 },
                    "granularity": "d",
                    "chart_type": "line",
                    "retention_type": "every",
                    "split_by": [ { "filter_type": "user_attributes", "action_name": "moe_platform" } ],
                    "comparison_timerange": { "start": "2026-06-30 00:00:00", "end": "2026-07-06 23:59:59", "label": "Previous Period", "dt_label": "previous", "value": 7 }
                  }
      responses:
        "200":
          description: Query registered. Poll status and fetch results with `data.request_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRegistration" }
              example:
                response_id: "79b86153-abfc-4499-9d24-c955636d74a2"
                type: "retention"
                data: { request_id: "REQUEST_ID" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/QuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v5/analytics/session-source:
    post:
      tags: [Analytics Queries]
      summary: Register a Session-Source Query
      operationId: submitSessionSourceQuery
      description: |
        Registers an asynchronous Session/Source analysis query and returns a `request_id`. Session/Source analysis reports session count or average session duration, broken down by acquisition attributes such as source, medium, and campaign.

        Use the `request_id` with [Get Query Status](/api/analytics-queries/get-query-status) to poll for completion, then [Get Query Results](/api/analytics-queries/get-query-results) to fetch the resolved series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionSourceQueryRequest" }
            example: {
                "version": "2.0",
                "type": "session-source",
                "report_type": "session_count",
                "filters": [],
                "grouped_by": [],
                "segmentation": [
                  { "filters": { "included_filters": { "filter_operator": "and", "filters": [ { "id": "moe_all_users", "name": "All Users", "filter_type": "custom_segments" } ] } } }
                ],
                "granularity": "d",
                "chart_type": "line",
                "count_type": "number",
                "timerange": { "start": "2026-07-07 00:00:00", "end": "2026-07-14 23:59:59", "label": "Last 7 Days", "dt_label": "last", "value": 7 },
                "comparison_timerange": {},
                "chart_sort_type": "descending"
              }
      responses:
        "200":
          description: Query registered. Poll status and fetch results with `data.request_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRegistration" }
              example:
                response_id: "513bdf7c-951b-4e35-979d-5956488975e3"
                type: "session-source"
                data: { request_id: "REQUEST_ID" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/QuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v5/analytics/user-analysis:
    post:
      tags: [Analytics Queries]
      summary: Register a User Analysis Query
      operationId: submitUserAnalysisQuery
      description: |
        Registers an asynchronous User Property Analysis (UPA) query and returns a `request_id`. User Property Analysis computes counts, distinct-value counts, distributions, and aggregations over user attributes for a cohort of users.

        Use the `request_id` with [Get Query Status](/api/analytics-queries/get-query-status) to poll for completion, then [Get Query Results](/api/analytics-queries/get-query-results) to fetch the resolved series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAnalysisQueryRequest" }
            example: {
                "version": "2.0",
                "type": "user_analysis",
                "analysis_type": "distribution",
                "user_properties": [
                  {
                    "id": "A",
                    "property": { "action_name": "u_l_a", "executed": true, "filter_type": "user_attributes", "execution": { "count": 1, "type": "atleast" }, "attributes": { "filter_operator": "and", "filters": [] }, "pii": false, "encrypted": false },
                    "projection": { "data_type": "datetime", "extract_type": "date" },
                    "object_projection": {},
                    "aggregation": {}
                  }
                ],
                "segmentation": [
                  { "filters": { "included_filters": { "filter_operator": "and", "filters": [ { "id": "moe_all_users", "name": "All Users", "filter_type": "custom_segments" } ] } } }
                ],
                "distribution": { "type": "auto", "from": -1, "to": -1, "interval": -1 },
                "timerange": {},
                "granularity": "e",
                "chart_type": "column",
                "count_type": "number",
                "split_by": [],
                "chart_sort_type": "descending"
              }
      responses:
        "200":
          description: Query registered. Poll status and fetch results with `data.request_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRegistration" }
              example:
                response_id: "98fa8c1b-cb3f-4d29-b30e-d9e74dfb4adc"
                type: "user_analysis"
                data: { request_id: "REQUEST_ID" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/QuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v5/analytics/query/{request_id}/status:
    get:
      tags: [Analytics Queries]
      summary: Get Query Status
      operationId: getQueryStatus
      description: |
        Returns the execution status of a registered query. Poll this endpoint until the query reaches a terminal status, then fetch the results.
      parameters:
        - name: request_id
          in: path
          required: true
          description: The `request_id` returned when the query was registered.
          schema: { type: string, example: "REQUEST_ID" }
      responses:
        "200":
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_id: { $ref: "#/components/schemas/ResponseId" }
                  type:
                    type: string
                    description: The type of resource returned in the `data` field.
                    example: query_status
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        description: |
                          Execution status of the query.

                          - `PENDING`: The query is registered and still running. Keep polling.
                          - `SUCCESSFUL`: The query finished. Fetch the results with [Get Query Results](/api/analytics-queries/get-query-results).
                          - `FAILED`: The query could not be completed. Register the query again to retry. A `request_id` cannot be re-run.
                        enum: [PENDING, SUCCESSFUL, FAILED]
              example:
                response_id: "199fb3c9-373f-4fe6-a40f-76185ef02b88"
                type: "query_status"
                data: { status: "SUCCESSFUL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v5/analytics/query/{request_id}/results:
    get:
      tags: [Analytics Queries]
      summary: Get Query Results
      operationId: getQueryResults
      description: |
        Returns the resolved results of a completed query, as an array of metric rows.

        Every row carries the common fields (`metric`, `granularity`, `splitby`, `tseq`, `cseq`). The remaining fields depend on the analysis type the query was registered for, so handle each row as a flexible set of keys. Select an example below to see the shape returned for each analysis type.
      parameters:
        - name: request_id
          in: path
          required: true
          description: The `request_id` returned when the query was registered.
          schema: { type: string, example: "REQUEST_ID" }
      responses:
        "200":
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_id: { $ref: "#/components/schemas/ResponseId" }
                  type:
                    type: string
                    description: The type of resource returned in the `data` field.
                    example: query_result
                  data:
                    type: array
                    description: The resolved query results, as an array of metric rows.
                    items:
                      $ref: "#/components/schemas/QueryResultRow"
              examples:
                behavior:
                  summary: Behavior analysis
                  value:
                    response_id: "b3f1c0d2-2a4e-4f9b-9c1a-6d2e8f0a1b23"
                    type: "query_result"
                    data:
                      - metric: 1.0
                        granularity: "2026/06/29"
                        splitby: []
                        grouped_by: []
                        step: "A"
                        tseq: 0
                        cseq: 0
                funnels:
                  summary: Funnels analysis
                  value:
                    response_id: "b3f1c0d2-2a4e-4f9b-9c1a-6d2e8f0a1b23"
                    type: "query_result"
                    data:
                      - step: 1
                        metric: 4
                        splitby: []
                        granularity: "entire"
                        split_by_weight: 4
                        tseq: 0
                        cseq: 0
                      - step: 2
                        metric: 0
                        splitby: []
                        granularity: "entire"
                        split_by_weight: 4
                        tseq: 0
                        cseq: 0
                retention:
                  summary: Retention analysis
                  value:
                    response_id: "b3f1c0d2-2a4e-4f9b-9c1a-6d2e8f0a1b23"
                    type: "query_result"
                    data:
                      - metric: 0.0
                        granularity: "2026/06/29"
                        splitby: []
                        total_users: 1
                        retained_user: 0
                        retention_comparison_index: 0
                        retention_compared_by: "2026/06/29"
                        tseq: 0
                        cseq: 0
                sessionSource:
                  summary: Session/Source analysis
                  value:
                    response_id: "92aace7b-404a-4e61-9035-2f88dec6ec73"
                    type: "query_result"
                    data:
                      - analysis_type: "session_count"
                        splitby: []
                        granularity: "2026/07/14"
                        metric: 15.0
                        fseq: 0
                        event_name: "MOE_SESSION"
                        tseq: 0
                        cseq: 0
                userAnalysis:
                  summary: User Analysis (UPA)
                  value:
                    response_id: "b3f1c0d2-2a4e-4f9b-9c1a-6d2e8f0a1b23"
                    type: "query_result"
                    data:
                      - metric: 14
                        granularity: "entire"
                        splitby: []
                        step: "A"
                        bucket: "1.0"
                        tseq: 0
                        cseq: 0
                      - metric: 8559
                        granularity: "entire"
                        splitby: []
                        step: "A"
                        bucket: "0.0"
                        tseq: 0
                        cseq: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format `username:password`.

        - **Username**: Use your MoEngage Workspace ID (earlier called the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: Use your Data API Key, which you can find in the MoEngage dashboard at **Settings** > **Account** > **APIs**.

        For more information, see [Authentication](/api/introduction#authentication).
  schemas:
    ResponseId:
      type: string
      description: A unique identifier for the response, useful for correlating logs and support requests.
      example: fc803857-632e-4bf0-8df1-fbc2bdeedb66
    QueryRegistration:
      type: object
      description: Acknowledgement that a query was registered. Use `data.request_id` to poll status and fetch results.
      properties:
        response_id: { $ref: "#/components/schemas/ResponseId" }
        type:
          type: string
          description: The analysis type echoed back for the registered query.
        data:
          type: object
          properties:
            request_id:
              type: string
              description: Identifier of the registered query. Use it with the status and results endpoints.
              example: "REQUEST_ID"

    QueryResultRow:
      type: object
      description: >
        A single row of query results. The common fields are present for every analysis type;
        the remaining fields depend on the analysis the query was registered for.
      properties:
        metric:
          type: number
          description: The computed value for this row — a count, rate, or aggregation result.
          example: 15.0
        granularity:
          type: string
          description: >
            The time bucket this row belongs to, or `entire` when the result is not
            time-bucketed.
          example: "2026/07/14"
        splitby:
          type: array
          description: >
            The key/value breakdown pairs for this row. Empty when the query requested no
            split.
          items:
            type: object
        tseq:
          type: integer
          description: Time-comparison sequence index. `0` for the primary time range.
          example: 0
        cseq:
          type: integer
          description: Segment-comparison sequence index. `0` for the first segment.
          example: 0
        step:
          type: string
          description: >
            Behavior and User Analysis: the `id` of the event or user property this row
            belongs to. Funnels: the funnel step number.
          example: "A"
        grouped_by:
          type: array
          description: Behavior only. The grouping values applied to this row.
          items:
            type: object
        split_by_weight:
          type: integer
          description: >
            Funnels only. The base denominator used to calculate the conversion rate for
            this step.
          example: 4
        total_users:
          type: integer
          description: Retention only. The size of the cohort for this period.
          example: 1
        retained_user:
          type: integer
          description: Retention only. The number of users from the cohort who returned.
          example: 0
        retention_comparison_index:
          type: integer
          description: Retention only. The offset, in periods, from the cohort period.
          example: 0
        retention_compared_by:
          type: string
          description: Retention only. The label of the period being compared against.
          example: "2026/06/29"
        analysis_type:
          type: string
          description: Session/Source only. Echoes the `report_type` the query requested.
          example: "session_count"
        event_name:
          type: string
          description: Session/Source only. The underlying system event the metric is derived from.
          example: "MOE_SESSION"
        fseq:
          type: integer
          description: Session/Source only. Filter sequence index.
          example: 0
        bucket:
          type: string
          description: >
            User Analysis only. The property value or distribution bucket this row
            represents, formatted according to the property's requested projection.
          example: "1.0"

    # ---- Shared request building blocks (reused across analyses) ----
    FilterGroup:
      type: object
      description: >
        A group of filter criteria combined by a logical operator. Used to define
        segmentation and event-level conditions.
      properties:
        included_filters:
          type: object
          description: >
            Criteria a user must match. For the supported filter payload and fields,
            see [Create Filter Segment](/api/filter-segments/create-filter-segment).
          properties:
            filter_operator:
              type: string
              description: The logical operator used to combine the filters in this group.
              enum: [and, or]
            filters:
              type: array
              description: >
                The individual filter criteria. Each item is a filter object whose
                structure varies by `filter_type` (common values: `actions`,
                `user_attributes`, `custom_segments`).
              items:
                type: object
    Segmentation:
      type: array
      description: >
        Segments used to scope the analysis to a subset of users. Include up to 5 segments.
        To analyze all users, pass a single segment with the `All Users` custom segment.
      maxItems: 5
      items:
        type: object
        properties:
          filters:
            $ref: "#/components/schemas/FilterGroup"
    Timerange:
      type: object
      description: The time window the analysis runs over.
      properties:
        start:
          type: string
          description: Start of the window, in `YYYY-MM-DD HH:MM:SS` (workspace time zone).
          example: "2026-06-09 00:00:00"
        end:
          type: string
          description: End of the window, in `YYYY-MM-DD HH:MM:SS` (workspace time zone).
          example: "2026-06-16 23:59:59"
        label:
          type: string
          description: Human-readable label for the window, as shown in the dashboard.
          example: "Last 7 Days"
        dt_label:
          type: string
          description: Relative-range keyword the label maps to.
          example: "last"
        value:
          type: integer
          description: Numeric component of a relative range (for example, 7 for the last 7 days).
          example: 7

    # ---- Behavior ----
    BehaviorQueryRequest:
      type: object
      description: Request body for registering a Behavior analysis query.
      required: [type, analysis_type, events, segmentation, timerange, granularity]
      properties:
        version:
          type: string
          description: Payload schema version.
          example: "2.0"
        type:
          type: string
          description: The analysis type. Must be `behavior` for this endpoint.
          enum: [behavior]
        analysis_type:
          type: string
          description: >
            The behavior metric to compute — for example, `events` (event counts),
            `users` (users who performed the event), or a per-user aggregation.
          enum: [events, users, session, aggregation, aggregation_distribution, total_events_per_user, attribute_aggregation_per_user]
        events:
          type: array
          description: >
            The events to analyze. Include 1 to 10 events. Each event has an `id`, one or
            more `actions` (event + attribute filters), an optional `split_by`, and an
            optional `aggregation`.
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              id:
                type: string
                description: Identifier for the event within this query (for example, `A`).
                example: "A"
              actions:
                type: array
                description: The event and attribute conditions that define this event.
                items:
                  type: object
                  properties:
                    c_at_trigger_seg_v2:
                      $ref: "#/components/schemas/FilterGroup"
                    c_at_act_seg_v2:
                      $ref: "#/components/schemas/FilterGroup"
              split_by:
                type: array
                description: >
                  Attributes to break this event down by. The combined total of all
                  `split_by` entries and `user_attr_grouped_by` must not exceed 10.
                items:
                  type: object
              aggregation:
                type: object
                description: Optional aggregation configuration for this event.
        segmentation:
          $ref: "#/components/schemas/Segmentation"
        user_attr_grouped_by:
          type: array
          description: >
            User attributes to group the results by. Include up to 10; the combined total
            with all `split_by` entries must not exceed 10.
          maxItems: 10
          items:
            type: object
        distribution:
          type: object
          description: >
            Custom distribution configuration. When using custom buckets, include at most
            10 buckets. Pass an empty object for no custom distribution.
        timerange:
          $ref: "#/components/schemas/Timerange"
        granularity:
          type: string
          description: >
            Time bucket for the series — for example, `d` (day), `w` (week), `m` (month),
            `h` (hour), or `e` (entire range). When hourly, the time range must not exceed 31 days.
          example: "d"
        chart_type:
          type: string
          description: Visual representation of the result, such as `line`, `column`, or `bar`.
          example: "line"
        count_type:
          type: string
          description: Whether metrics are returned as absolute counts or percentages, such as `number`.
          example: "number"
        chart_plot_type:
          type: string
          description: Plot scale for the chart, such as `linear`.
          example: "linear"
        rolling_value:
          type: integer
          description: Rolling-window size for the metric, or -1 when not used.
          example: -1
        user_aggregation_type:
          type: string
          description: The per-user aggregation to apply. Empty when not using an aggregation.
          example: ""
        user_aggregation_percentile:
          type: integer
          description: >
            Percentile to compute when `user_aggregation_type` is a percentile aggregation.
            A value from 1 to 100, or -1 when not used.
          example: -1
        comparison_timerange:
          type: object
          description: >
            A second time range to compare against. Time comparison is supported only on
            line, bar, and column charts, and cannot be combined with custom-segment
            comparison (2 or more segments). Pass an empty object for no comparison.
        chart_sort_type:
          type: string
          description: Sort order applied to the result series.
          enum: [ascending, descending]

    # ---- Funnels ----
    FunnelsQueryRequest:
      type: object
      description: Request body for registering a Funnels analysis query.
      required: [type, events, funnel_type, timerange]
      properties:
        version:
          type: string
          description: Payload schema version.
          example: "2.0"
        type:
          type: string
          description: The analysis type. Must be `funnel` for this endpoint.
          enum: [funnel]
        events:
          type: array
          description: >
            The ordered steps of the funnel. Include 2 to 10 steps. Each step defines the
            event and attribute conditions a user must satisfy to be counted at that step.
          minItems: 2
          maxItems: 10
          items:
            type: object
            properties:
              step_number:
                type: integer
                description: The 1-based position of this step in the funnel.
                example: 1
              step_type:
                type: string
                description: Whether users who match this step are included in or excluded from the funnel.
                enum: [include, exclude]
              from_step:
                type: integer
                nullable: true
                description: For a distribution funnel, the step the window is measured from. Null otherwise.
              to_step:
                type: integer
                nullable: true
                description: For a distribution funnel, the step the window is measured to. Null otherwise.
              c_at_trigger_seg_v2:
                $ref: "#/components/schemas/FilterGroup"
              c_at_act_seg_v2:
                $ref: "#/components/schemas/FilterGroup"
        segmentation:
          $ref: "#/components/schemas/Segmentation"
        funnel_type:
          type: string
          description: >
            The kind of funnel to compute — `user_funnel` (standard conversion),
            `event_time_to_convert` (time-to-convert distribution between two steps), or
            `user_frequency` (frequency distribution of repeated actions between two steps).
          enum: [user_funnel, event_time_to_convert, user_frequency]
        grouped_by:
          type: array
          description: >
            Event attributes to split the funnel by. Include up to 3. Each item names the
            attribute to split on.
          maxItems: 3
          items:
            type: object
        grouped_by_meta:
          type: object
          description: >
            Describes how each `grouped_by` attribute is applied across the funnel — for
            example, to all steps, to the first N steps, or to a specific step. Keys
            correspond to the attributes in `grouped_by`. Pass an empty object when
            `grouped_by` is empty.
        holding_attributes:
          type: array
          description: >
            Event attributes that must hold the same value across funnel steps, so only
            users who kept that value are counted as converted. Include up to 3.
          maxItems: 3
          items:
            type: object
        holding_attributes_meta:
          type: object
          description: >
            Describes how each holding attribute is applied across the funnel steps. Keys
            correspond to the attributes in `holding_attributes`. Pass an empty object when
            `holding_attributes` is empty.
        funnel_window:
          type: integer
          description: The conversion window in seconds within which users must complete the funnel.
          example: 86400
        funnel_window_multiplier:
          type: integer
          description: Multiplier applied to the funnel window.
          example: 86400
        strict_order:
          type: boolean
          description: Whether steps must be performed in the exact order defined.
          example: false
        distribution:
          type: object
          description: >
            Distribution configuration for `event_time_to_convert` and `user_frequency`
            funnels. When using custom buckets, include at most 25 buckets. Pass an empty
            object for a standard funnel.
        countType:
          type: string
          description: Whether metrics are returned as absolute counts or percentages, such as `number`.
          example: "number"
        showConversionEventOnly:
          type: boolean
          description: Whether to return only the conversion event's metrics.
          example: false
        chart_type:
          type: string
          description: Visual representation of the result, such as `line`, `bar`, or `column`.
          example: "column"
        comparison_timerange:
          type: object
          description: >
            A second time range to compare against. Time comparison is supported only on
            line, bar, and column charts, and cannot be combined with custom-segment
            comparison (2 or more segments). Pass an empty object for no comparison.
        timerange:
          $ref: "#/components/schemas/Timerange"
        granularity:
          type: string
          description: >
            Time bucket for the series — `h` (hour), `d` (day), `w` (week), `m` (month),
            or `e` (entire range). When hourly, the time range must not exceed 31 days.
          enum: [h, d, w, m, e]
          example: "e"
        chart_plot_type:
          type: string
          description: Plot scale for the chart, such as `linear`.
          example: "linear"

    # ---- Retention ----
    RetentionQueryRequest:
      type: object
      description: Request body for registering a Retention analysis query.
      required: [type, events, timerange, retention_type]
      properties:
        version:
          type: string
          description: Payload schema version.
          example: "2.0"
        type:
          type: string
          description: The analysis type. Must be `retention` for this endpoint.
          enum: [retention]
        events:
          type: array
          description: >
            Exactly two events: the `first` event that places a user into a cohort, and the
            `return` event measured in later periods.
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              id:
                type: string
                description: The event's role in the analysis.
                enum: [first, return]
              actions:
                type: array
                description: The event and attribute conditions that define this event.
                items:
                  type: object
                  properties:
                    c_at_trigger_seg_v2:
                      $ref: "#/components/schemas/FilterGroup"
                    c_at_act_seg_v2:
                      $ref: "#/components/schemas/FilterGroup"
        segmentation:
          allOf:
            - $ref: "#/components/schemas/Segmentation"
          description: >
            Segments to scope the analysis (up to 5). Segmentation and `comparison_timerange`
            are mutually exclusive — do not send 2 or more segments together with a time comparison.
        timerange:
          $ref: "#/components/schemas/Timerange"
        granularity:
          type: string
          description: >
            Cohort period — `h` (hourly, window up to 24 hours), `d` (daily, up to 90 days),
            or `w` (weekly, up to 180 days).
          enum: [h, d, w]
          example: "d"
        chart_type:
          type: string
          description: Visual representation of the result, such as `line`.
          example: "line"
        retention_type:
          type: string
          description: >
            How return events are counted — `every` (return in every period),
            `first` (first return only), or `last` (last return only).
          enum: [every, first, last]
        split_by:
          type: array
          description: Attributes to break the cohorts down by. Include up to 10.
          maxItems: 10
          items:
            type: object
        comparison_timerange:
          type: object
          description: >
            A second time range to compare against. Mutually exclusive with sending 2 or more
            segments. Pass an empty object for no comparison.

    # ---- Session/Source ----
    SessionSourceQueryRequest:
      type: object
      description: Request body for registering a Session/Source analysis query.
      required: [type, report_type, timerange]
      properties:
        version:
          type: string
          description: Payload schema version.
          example: "2.0"
        type:
          type: string
          description: The analysis type. Must be `session-source` for this endpoint.
          enum: [session-source]
        report_type:
          type: string
          description: The session metric to compute.
          enum: [session_count, average_session_duration]
        filters:
          type: array
          description: >
            Conditions that restrict the report to specific acquisition values. Combined
            with `grouped_by`, at most 2 source properties may be used. Each item names the
            source property to filter on, the operator to apply, and the values to match.
            A filter value must match the attribute's declared data type.
          items:
            type: object
            properties:
              attribute:
                type: string
                description: The acquisition property to filter on, such as source, medium, or campaign.
                example: "source"
              operator:
                type: string
                description: The comparison applied between the attribute and `value`.
                example: "is"
              value:
                type: array
                description: The values to match.
                items:
                  type: string
                example: ["google"]
        grouped_by:
          type: array
          description: >
            Acquisition properties to break the report down by (for example, source and
            medium). Include up to 2.
          maxItems: 2
          items:
            type: object
        segmentation:
          $ref: "#/components/schemas/Segmentation"
        granularity:
          type: string
          description: >
            Time bucket for the series — `h` (hour), `d` (day), `w` (week), or `m` (month).
            When hourly, the time range must not exceed 31 days.
          enum: [h, d, w, m]
          example: "d"
        chart_type:
          type: string
          description: Visual representation of the result, such as `line`.
          example: "line"
        count_type:
          type: string
          description: Whether metrics are returned as absolute counts or percentages, such as `number`.
          example: "number"
        timerange:
          $ref: "#/components/schemas/Timerange"
        comparison_timerange:
          type: object
          description: >
            A second time range to compare against. Time comparison is supported only on
            line, bar, and column charts, and cannot be combined with custom-segment
            comparison (2 or more segments). Pass an empty object for no comparison.
        chart_sort_type:
          type: string
          description: Sort order applied to the result series.
          enum: [ascending, descending]

    # ---- User Property Analysis (UPA) ----
    UserAnalysisQueryRequest:
      type: object
      description: Request body for registering a User Property Analysis (UPA) query.
      required: [type, analysis_type, user_properties, segmentation]
      properties:
        version:
          type: string
          description: Payload schema version.
          example: "2.0"
        type:
          type: string
          description: The analysis type. Must be `user_analysis` for this endpoint.
          enum: [user_analysis]
        analysis_type:
          type: string
          description: >
            The user-property computation to run — `total_count` (all users in scope),
            `unique_count` (distinct values of the attribute), `distribution` (how users are
            spread across the attribute's values), `aggregation` (sum, min, max, average,
            median, percentile, or distinct count), or `email_domain_analysis`.
          enum: [total_count, unique_count, distribution, aggregation, email_domain_analysis]
          example: "distribution"
        user_properties:
          type: array
          description: >
            The user attributes to analyze. Include 1 to 5 properties. When more than one is
            provided, results are cross-tabulated across them.
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              id:
                type: string
                description: Identifier for this property within the query (for example, `A`).
                example: "A"
              property:
                type: object
                description: The attribute definition and any attribute-level filters.
                properties:
                  action_name:
                    type: string
                    description: The user attribute to analyze.
                    example: "u_l_a"
                  filter_type:
                    type: string
                    description: The kind of attribute being analyzed.
                    example: "user_attributes"
                  executed:
                    type: boolean
                    description: Whether the attribute condition must be satisfied.
                  execution:
                    type: object
                    description: Execution criteria for the attribute condition.
                  attributes:
                    $ref: "#/components/schemas/FilterGroup"
                  pii:
                    type: boolean
                    description: Whether the attribute is marked as personally identifiable information.
                  encrypted:
                    type: boolean
                    description: Whether the attribute is stored encrypted.
              projection:
                type: object
                description: >
                  How the attribute's value is formatted before results are grouped. For
                  example, a datetime attribute projected as a date returns buckets like
                  `19 May 2023`, and a boolean attribute returns the strings `true` and
                  `false`. Pass an empty object to use the attribute's raw value.
                properties:
                  data_type:
                    type: string
                    description: The attribute's underlying data type.
                    example: "datetime"
                  extract_type:
                    type: string
                    description: >
                      The part of the value to project — for example, `date` to bucket a
                      datetime attribute by calendar date.
                    example: "date"
              object_projection:
                type: object
                description: >
                  Projection configuration for object-type attributes, naming the nested
                  key within the object to analyze. Pass an empty object for non-object
                  attributes.
              aggregation:
                type: object
                description: >
                  The aggregation to compute when `analysis_type` is `aggregation` — for
                  example sum, minimum, maximum, average, median, distinct count, or a
                  percentile from 1 to 100. Pass an empty object for other analysis types.
        segmentation:
          $ref: "#/components/schemas/Segmentation"
        distribution:
          type: object
          description: >
            Distribution configuration. Custom distributions apply to numerical attributes
            only. Use `type: auto` for automatic bucketing.
        timerange:
          $ref: "#/components/schemas/Timerange"
        granularity:
          type: string
          description: >
            Time bucket for the series — `h` (hour), `d` (day), `w` (week), `m` (month),
            or `e` (entire range).
          enum: [h, d, w, m, e]
          example: "e"
        chart_type:
          type: string
          description: Visual representation of the result, such as `column`.
          example: "column"
        count_type:
          type: string
          description: Whether metrics are returned as absolute counts or percentages, such as `number`.
          example: "number"
        split_by:
          type: array
          description: Attributes to break the result down by. Include up to 10.
          maxItems: 10
          items:
            type: object
        chart_sort_type:
          type: string
          description: Sort order applied to the result series.
          enum: [ascending, descending]
    ErrorResponse:
      type: object
      required: [error, response_id]
      description: >
        Standard MoEngage error envelope, returned by the service. Authentication and
        authorization failures (401 and 403) are returned by the API gateway in a different
        format — see those responses for details.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A machine-readable error code.
              enum: [VALIDATION_FAILED, BAD_REQUEST, NOT_FOUND, QUOTA_EXCEEDED, INTERNAL_ERROR]
            message: { type: string, description: A human-readable description of the error. }
            doc_url: { type: string, description: "A link to documentation about this error, when available." }
        response_id: { $ref: "#/components/schemas/ResponseId" }
  responses:
    ValidationFailed:
      description: Validation failed — a required field is missing, a value is invalid, or a documented limit is exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: "VALIDATION_FAILED"
              message: "analysis_type - Enum doesnt allow value: eventsdfg, allowed values: [events, users, session, aggregation, aggregation_distribution, total_events_per_user, attribute_aggregation_per_user] : 'eventsdfg'"
              doc_url: "/api/analytics-query/analytics-query-overview"
            response_id: "01306019-419a-4728-ad82-9d522464f33a"
    Unauthorized:
      description: |
        This response is returned when the credentials are missing or invalid.

        This response is generated by the API gateway before the request reaches the service, so it does not use the standard error envelope. The body is JSON-formatted but is sent with `Content-Type: text/plain`. The `code` field identifies the specific authentication failure, such as `ER001`.
      content:
        text/plain:
          schema:
            type: string
            description: Gateway authentication failure. The body is JSON-formatted but sent as `text/plain`.
            example: '{"code":"ER001","target":"Authentication Invalid","message":"Auth validation failed."}'
    Forbidden:
      description: |
        This response is returned when the credentials are valid but do not have access to this route or workspace.

        This response is generated by the API gateway before the request reaches the service, so it does not use the standard error envelope. The body is JSON-formatted but is sent with `Content-Type: text/plain`. The `code` field identifies the specific authorization failure, such as `ER007`.
      content:
        text/plain:
          schema:
            type: string
            description: Gateway authorization failure. The body is JSON-formatted but sent as `text/plain`.
            example: '{"code":"ER007","target":"Authentication Invalid","message":"Auth validation failed."}'
    NotFound:
      description: The query `request_id` does not exist, or is not in this workspace.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: "NOT_FOUND", message: "The query request you are looking for does not exist.", doc_url: "/api/analytics-query/analytics-query-overview" }
            response_id: "0998efae-b324-4559-afb0-756961d2e11a"
    QuotaExceeded:
      description: This response is returned when the workspace has reached its monthly Fair Usage Policy (FUP) limit for analytics usage.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: "QUOTA_EXCEEDED", message: "Your workspace has reached its monthly Fair Usage Policy limit for analytics usage. Please contact your Customer Success Manager to expand your quota.", doc_url: "/api/analytics-query/analytics-query-overview" }
            response_id: "714b4690eba1deb53b065d92277e2910"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: "INTERNAL_ERROR", message: "An unexpected error occurred while processing the request.", doc_url: "/api/analytics-query/analytics-query-overview" }
            response_id: "dcc4fd00-2980-41a5-94b3-ad4844ae3d72"
