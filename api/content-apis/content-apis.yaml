openapi: 3.0.3
info:
  title: MoEngage Content APIs
  version: '5.0'
  description: >
    A content API is an external endpoint that MoEngage calls to pull dynamic data into a campaign at send time — for example, the current weather in a user's city or the live price of an item in their cart.


    Use these endpoints to list the content APIs configured in your workspace and to test a saved configuration against its upstream endpoint. To create or edit a content API, use the MoEngage dashboard. For more information, see [Add a Content API](/user-guide/settings/advanced-settings/add-a-content-api).
tags:
  - name: Content APIs
    description: List, look up, and test workspace Content API configurations.
servers:
  - url: 'https://api-{dc}.moengage.com'
    description: MoEngage Content APIs Server
    variables:
      dc:
        default: '01'
        description: 'The ''dc'' in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ''dc'' in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101.'
security:
  - basicAuth: []

paths:
  /v5/content-apis:
    get:
      tags:
        - Content APIs
      summary: List Content APIs
      description: |
        Returns all content APIs in the workspace, or a single one when you supply `name` or `id`. Use either `name` or `id`, not both. Omit both parameters to list every content API in the workspace (paginated).
      operationId: listContentApis
      security:
        - basicAuth: []
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Exact content API name. Use either `name` or `id`, not both.
          example: WeatherAPI
        - name: id
          in: query
          schema:
            type: string
          description: Content API ID. Use either `name` or `id`, not both.
          example: <mongo-object-id>
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Content API list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentApiListResponse'
              example:
                response_id: resp_<trace-id>
                type: content-apis
                data:
                  - id: <mongo-object-id>
                    name: WeatherAPI
                    url: https://api.example.com/v1/weather
                    method: GET
                    params:
                      q: Delhi
                      appid: <your-api-key>
                    headers: {}
                    request_body_type: JSON
                    request_body: {}
                    oauth_enabled: false
                    oauth_prefix_for_header: Bearer
                    caching_enabled: true
                    caching_ttl_in_minutes: 15
                    pii_fields_in_response:
                      - email
                      - phone
                    verified: true
                    last_tested_at: '2026-07-10T11:45:30Z'
                    updated_at: '2026-07-10T11:45:30Z'
                pagination:
                  has_more: true
                  next_cursor: <opaque-cursor>
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v5/content-apis/{id}/test:
    post:
      tags:
        - Content APIs
      summary: Test Content API
      description: |
        Loads the saved content API identified by `id` and executes it against the upstream endpoint, returning the response. The full definition — URL, method, parameters, headers, body, and authentication — comes from the saved configuration.

        The optional request body supplies sample values for the personalization tokens (`{{UserAttribute['city']}}`) in that configuration, which are resolved before the call. Omit the body if the configuration has no tokens.

        The URL is validated against server-side request forgery (SSRF): internal and private ranges are rejected with `400`.
      operationId: testContentApi
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Content API ID of the saved config to test.
          example: <mongo-object-id>
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentApiTestRequest'
            example:
              request_id: <client-request-id>
              dynamic_values:
                UserAttribute:
                  city: Delhi
                  units: metric
                EventAttribute:
                  name: added_to_cart
                  id: id-123
      responses:
        '200':
          description: Test execution result (returned for both passing and failing upstream calls)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentApiTestResponse'
              example:
                response_id: resp_<trace-id>
                type: content-apis
                data:
                  api_response_code: 200
                  api_response_body:
                    weather:
                      - main: Clouds
                        description: overcast clouds
                    main:
                      temp: 307.22
                      humidity: 50
                    name: Delhi
                    cod: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.

        - **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: On your MoEngage workspace, navigate to **Settings** > **Account** > **API keys** and click **Create new key**.

        For more information on authentication and getting your credentials, refer to [Getting your credentials](/api/introduction#getting-your-credentials).

        Send the value in the `Authorization` header as `Basic` followed by Base64-encoding of `appkey:apisecret` (workspace ID and API key).

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 20
      description: Page size. Max 20 per page.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.

  schemas:
    ContentApi:
      type: object
      description: A content API configured in the workspace.
      required:
        - id
        - name
        - url
        - method
      properties:
        id:
          type: string
          description: Content API ID.
          example: <mongo-object-id>
        name:
          type: string
          description: Content API name (unique per workspace).
          example: WeatherAPI
        url:
          type: string
          description: Endpoint URL invoked at send time. May contain Jinja tokens.
          example: https://api.example.com/v1/weather
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
          description: HTTP method used when invoking the API.
          example: GET
        params:
          type: object
          additionalProperties: true
          description: Query parameters sent with the request.
          example:
            q: Delhi
            appid: <your-api-key>
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers sent with the request.
          example: {}
        request_body_type:
          type: string
          enum:
            - JSON
            - FORM
            - RAW
          description: Encoding of the request body for POST/PUT APIs.
          example: JSON
        request_body:
          type: object
          additionalProperties: true
          description: Body sent with POST/PUT requests. May contain Jinja tokens.
          example: {}
        oauth_enabled:
          type: boolean
          description: Whether an OAuth token is attached as the Authorization header at send time. For more information, see [Authorization Configuration with OAuth 2.0](/user-guide/settings/advanced-settings/authorization-configuration-with-oauth-20).
          example: false
        oauth_prefix_for_header:
          type: string
          description: Token prefix used on the Authorization header when `oauth_enabled`.
          example: Bearer
        caching_enabled:
          type: boolean
          description: Whether responses are cached at send time.
          example: true
        caching_ttl_in_minutes:
          type: integer
          description: Cache TTL in minutes (5–60) when caching is enabled.
          example: 15
        pii_fields_in_response:
          type: array
          items:
            type: string
          description: Response fields marked as PII.
          example:
            - email
            - phone
        verified:
          type: boolean
          description: True once the API has returned a successful test response.
          example: true
        last_tested_at:
          type: string
          format: date-time
          example: '2026-07-10T11:45:30Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-10T11:45:30Z'

    ContentApiTestRequest:
      type: object
      description: >
        Sample values for the personalization tokens in the saved Content API. Omit the
        body entirely if the config has no tokens.
      properties:
        request_id:
          type: string
          description: Client-generated ID for tracing.
        dynamic_values:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: >
            Sample values for the personalization tokens in the saved config, grouped by
            token namespace (for example, `UserAttribute` or `EventAttribute`). A token like
            `{{UserAttribute['city']}}` resolves from `dynamic_values.UserAttribute.city`.
            Tokens may appear in the saved url, params, headers, or body; each is resolved
            before the upstream call.
          example:
            UserAttribute:
              city: Delhi
              units: metric
            EventAttribute:
              name: added_to_cart
              id: id-123

    ContentApiTestResponse:
      type: object
      required:
        - response_id
        - type
        - data
      properties:
        response_id:
          type: string
          example: resp_<trace-id>
        type:
          type: string
          enum:
            - content-apis
        data:
          type: object
          required:
            - api_response_code
            - api_response_body
          properties:
            api_response_code:
              type: integer
              description: HTTP status code returned by the upstream Content API.
              example: 200
            api_response_body:
              description: Response body returned by the upstream Content API (arbitrary JSON or string).
              example:
                weather:
                  - main: Clouds
                    description: overcast clouds
                main:
                  temp: 307.22
                  humidity: 50
                name: Delhi
                cod: 200

    ContentApiListResponse:
      type: object
      required:
        - response_id
        - type
        - data
        - pagination
      properties:
        response_id:
          type: string
          example: resp_<trace-id>
        type:
          type: string
          enum:
            - content-apis
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContentApi'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required:
        - has_more
      properties:
        has_more:
          type: boolean
          example: true
        next_cursor:
          type: string
          description: Present only when `has_more` is `true`.
          example: <opaque-cursor>

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable UPPER_SNAKE_CASE code.
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  target:
                    type: string
                  message:
                    type: string
        response_id:
          type: string

  responses:
    BadRequest:
      description: Bad request / validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: resp_<trace-id>
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: resp_<trace-id>
    Forbidden:
      description: Missing required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: resp_<trace-id>
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: resp_<trace-id>
