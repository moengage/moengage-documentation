openapi: 3.0.3
info:
  title: MoEngage Content APIs
  version: '5.0'
  description: >
    A content API is an external endpoint that MoEngage calls to pull dynamic data into a campaign at send time — for example, the current weather in a user's city or the live price of an item in their cart.


    Use these endpoints to list the content APIs configured in your workspace and to test a saved configuration against its upstream endpoint. To create or edit a content API, use the MoEngage dashboard. For more information, see [Add a Content API](/user-guide/settings/advanced-settings/add-a-content-api).
tags:
  - name: Content APIs
    description: Use these operations to list the content APIs in your workspace and test a saved configuration.
servers:
  - url: 'https://api-{dc}.moengage.com'
    description: MoEngage Content APIs Server
    variables:
      dc:
        default: '01'
        description: 'The ''dc'' in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ''dc'' in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101.'
security:
  - basicAuth: []

paths:
  /v5/content-apis:
    get:
      tags:
        - Content APIs
      summary: List Content APIs
      description: |
        Returns all content APIs in the workspace, or a single one when you supply `name` or `id`. Use either `name` or `id`, not both. Omit both parameters to list every content API in the workspace (paginated).
      operationId: listContentApis
      security:
        - basicAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Exact content API name. Use either `name` or `id`, not both.
          example: WeatherAPI
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Content API ID. Use either `name` or `id`, not both.
          example: <mongo-object-id>
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 20
          description: Page size. Max 20 per page.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor from a previous response.
      responses:
        '200':
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - response_id
                  - type
                  - data
                  - pagination
                properties:
                  response_id:
                    type: string
                    description: Unique identifier for this response.
                  type:
                    type: string
                    enum:
                      - content-apis
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentApi'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                response_id: resp_<trace-id>
                type: content-apis
                data:
                  - id: <mongo-object-id>
                    name: WeatherAPI
                    url: https://api.example.com/v1/weather
                    method: GET
                    params:
                      q: Delhi
                      appid: <your-api-key>
                    headers: {}
                    request_body_type: JSON
                    request_body: {}
                    oauth_enabled: false
                    oauth_prefix_for_header: Bearer
                    caching_enabled: true
                    caching_ttl_in_minutes: 15
                    pii_fields_in_response:
                      - email
                      - phone
                    verified: true
                    last_tested_at: '2026-07-10T11:45:30Z'
                    updated_at: '2026-07-10T11:45:30Z'
                pagination:
                  has_more: true
                  next_cursor: <opaque-cursor>
        '400':
          description: Bad request. Returned when both `name` and `id` are supplied, or when a parameter fails validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST
                  message: Use either name or id, not both.
                  target: name
                  details:
                    - code: INVALID_VALUE
                      target: name
                      message: Only one of name or id may be supplied.
                response_id: resp_<trace-id>
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required.
                  target: Authorization
                  details:
                    - code: MISSING_VALUE
                      target: Authorization
                      message: APP_ID and APP_SECRET_KEY is missing in Authorization Header.
                response_id: resp_<trace-id>
        '403':
          description: Missing required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have the required permission for this operation.
                  target: permission
                  details:
                    - code: FORBIDDEN
                      target: permission
                      message: 'Required permission: content_apis:view'
                response_id: resp_<trace-id>
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded for this workspace.
                  details: []
                response_id: resp_<trace-id>

  /v5/content-apis/{id}/test:
    post:
      tags:
        - Content APIs
      summary: Test Content API
      description: |
        Loads the saved content API identified by `id`, calls its upstream endpoint, and returns the response. The full definition — URL, method, parameters, headers, body, and authentication — comes from the saved configuration.

        Use the optional request body to supply sample values for the Jinja tokens (`{{UserAttribute['city']}}`) in that configuration. MoEngage resolves these before making the call. Omit the body if the configuration has no tokens.

        The URL is validated against server-side request forgery (SSRF): requests to internal or private IP ranges are rejected with `400`.
      operationId: testContentApi
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Content API ID of the saved configuration to test.
          example: <mongo-object-id>
      requestBody:
        description: Sample values for the personalization tokens in the saved Content API. Omit the body entirely if the config has no tokens.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentApiTestRequest'
            example:
              request_id: <client-request-id>
              dynamic_values:
                UserAttribute:
                  city: Delhi
                  units: metric
                EventAttribute:
                  name: added_to_cart
                  id: id-123
      responses:
        '200':
          description: This response is returned when MoEngage successfully calls the upstream endpoint. The upstream endpoint's own status code is returned in `data.api_response_code`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - response_id
                  - type
                  - data
                properties:
                  response_id:
                    type: string
                    description: Unique identifier for this response.
                  type:
                    type: string
                    enum:
                      - content-apis
                  data:
                    $ref: '#/components/schemas/ContentApiTestResult'
              example:
                response_id: resp_<trace-id>
                type: content-apis
                data:
                  api_response_code: 200
                  api_response_body:
                    weather:
                      - main: Clouds
                        description: overcast clouds
                    main:
                      temp: 307.22
                      humidity: 50
                    name: Delhi
                    cod: 200
        '400':
          description: Bad request. Returned when the request body fails validation, or when the saved configuration's URL resolves to an internal or private IP range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST
                  message: The content API URL resolves to a private or internal address.
                  target: url
                  details:
                    - code: INVALID_VALUE
                      target: url
                      message: Requests to internal or private IP ranges are not allowed.
                response_id: resp_<trace-id>
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required.
                  target: Authorization
                  details:
                    - code: MISSING_VALUE
                      target: Authorization
                      message: APP_ID and APP_SECRET_KEY is missing in Authorization Header.
                response_id: resp_<trace-id>
        '403':
          description: Missing required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have the required permission for this operation.
                  target: permission
                  details:
                    - code: FORBIDDEN
                      target: permission
                      message: 'Required permission: content_apis:test'
                response_id: resp_<trace-id>
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded for this workspace.
                  details: []
                response_id: resp_<trace-id>

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.

        - **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: On your MoEngage workspace, navigate to **Settings** > **Account** > **API keys** and click **Create new key**.

        For more information on authentication and getting your credentials, refer to [Getting your credentials](/api/introduction#getting-your-credentials).

        Send the value in the `Authorization` header as `Basic` followed by Base64-encoding of `appkey:apisecret` (workspace ID and API key).

  schemas:
    ContentApi:
      type: object
      description: A content API configured in the workspace.
      required:
        - id
        - name
        - url
        - method
      properties:
        id:
          type: string
          description: Content API ID.
          example: <mongo-object-id>
        name:
          type: string
          description: Content API name (unique per workspace).
          example: WeatherAPI
        url:
          type: string
          description: Endpoint URL invoked at send time. May contain Jinja tokens.
          example: https://api.example.com/v1/weather
        method:
          type: string
          description: HTTP method used when invoking the API.
          enum:
            - GET
            - POST
            - PUT
          example: GET
        params:
          type: object
          description: Query parameters sent with the request.
          additionalProperties: true
          example:
            q: Delhi
            appid: <your-api-key>
        headers:
          type: object
          description: Request headers sent with the request.
          additionalProperties:
            type: string
          example: {}
        request_body_type:
          type: string
          description: Encoding of the request body for POST/PUT APIs.
          enum:
            - JSON
            - FORM
            - RAW
          example: JSON
        request_body:
          type: object
          description: Body sent with POST/PUT requests. May contain Jinja tokens.
          additionalProperties: true
          example: {}
        oauth_enabled:
          type: boolean
          description: Whether an OAuth token is attached as the Authorization header at send time. For more information, see [Authorization Configuration with OAuth 2.0](/user-guide/settings/advanced-settings/authorization-configuration-with-oauth-20).
          example: false
        oauth_prefix_for_header:
          type: string
          description: Token prefix used on the Authorization header when `oauth_enabled`.
          example: Bearer
        caching_enabled:
          type: boolean
          description: Whether responses are cached at send time.
          example: true
        caching_ttl_in_minutes:
          type: integer
          minimum: 5
          maximum: 60
          description: Cache TTL in minutes (5–60) when caching is enabled.
          example: 15
        pii_fields_in_response:
          type: array
          description: Response fields marked as PII.
          items:
            type: string
          example:
            - email
            - phone
        verified:
          type: boolean
          description: True once the API has returned a successful test response.
          example: true
        last_tested_at:
          type: string
          format: date-time
          description: Time this API was last tested.
          example: '2026-07-10T11:45:30Z'
        updated_at:
          type: string
          format: date-time
          description: Time this API was last updated.
          example: '2026-07-10T11:45:30Z'

    ContentApiTestRequest:
      type: object
      description: Sample values for the personalization tokens in the saved Content API. Omit the body entirely if the config has no tokens.
      properties:
        request_id:
          type: string
          description: Client-generated ID for tracing.
        dynamic_values:
          type: object
          description: |
            Sample values for the personalization tokens in the saved config, grouped by token namespace (for example, `UserAttribute` or `EventAttribute`). A token like `{{UserAttribute['city']}}` resolves from `dynamic_values.UserAttribute.city`. Tokens may appear in the saved `url`, `params`, `headers`, or `request_body`; each is resolved before the upstream call.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          example:
            UserAttribute:
              city: Delhi
              units: metric
            EventAttribute:
              name: added_to_cart
              id: id-123

    ContentApiTestResult:
      type: object
      description: The result of calling the saved content API's upstream endpoint.
      properties:
        api_response_code:
          type: integer
          description: HTTP status code returned by the upstream endpoint.
          example: 200
        api_response_body:
          type: object
          description: Response body returned by the upstream endpoint, passed through unchanged.
          additionalProperties: true

    Pagination:
      type: object
      description: Pagination metadata for list responses.
      properties:
        has_more:
          type: boolean
          description: Whether additional pages of results exist.
          example: true
        next_cursor:
          type: string
          nullable: true
          description: Opaque pagination cursor. Pass this back as `cursor` to fetch the next page. `null` when there are no more pages.
          example: <opaque-cursor>

    ErrorResponse:
      type: object
      required:
        - response_id
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable error message.
            target:
              type: string
              description: The field or resource that caused the error.
            details:
              type: array
              description: Per-field error entries.
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: Machine-readable, field-level error code.
                  target:
                    type: string
                    description: The field that caused the error.
                  message:
                    type: string
                    description: Human-readable description of the field-level error.
        response_id:
          type: string
          description: Unique identifier for this response.
