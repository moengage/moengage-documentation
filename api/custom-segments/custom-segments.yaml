openapi: 3.0.3
info:
  title: MoEngage Segments API
  description: |
    Use the MoEngage Segments API to create, update, and manage your file and filter segments.
    
    - **v2 API:** Manage File Segments and segment lifecycle (Archive/Unarchive).
    - **v3 API:** Create, read, update, and list filter-based Segments.
  version: '3.0'
servers:
  - url: https://api-{dc}.moengage.com
    description: MoEngage API Endpoint
    variables:
      dc:
        description: "The ‘dc’ in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ‘dc’ in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101."
        default: '01'
tags:
  - name: File Segments
    description: |
      If you need to create segments by importing a large number of users, we recommend utilising the File segment API. This API allows you to easily generate a file segment by initiating a call to the file segment API endpoint. To proceed, you will need to compile a CSV file containing the relevant users (ensuring that the users are already present in MoEngage). It is essential to provide the public path of the file, which allows for downloading and identification of users in order to successfully create the file segment.
      
      Use the File Segment API to:
      * Create a new file segment
      * Add users to an existing segment
      * Remove users from an existing segment
      * Replace users from an existing segment
   
  - name: Manage Segments
    description: |
      Archiving and unarchiving through APIs makes it easy to retrieve and reuse segments whenever required for purposes such as A/B testing, maintaining regulatory compliance, and improving system performance.

      You can unarchive an archived segment to reuse it in campaigns and analysis without recreating it from scratch.
    x-mint:
      content: |
        
        <Warning>
          Archived segments will not be shown beyond 180 days.
        </Warning>
  - name: Filter Segments
    description: |
      If you need to create a segment based on the events or actions performed by your users on your application or website, the recommended approach is to use the filter segment API. With this API, you can create a segment by specifying the desired filter conditions.
      
      The filter segment API supports various operations, including create, update, get, and list, allowing you to effectively manage your segments based on specific criteria.
    x-mint:
      content: |
        ## Authentication
        Authentication is performed using Basic Auth. You must also provide the `MOE-APPKEY` header.
        
        ## Request Headers
        
        | Key | Required | Description |
        | :--- | :--- | :--- |
        | `Content-Type` | Yes | Set to `application/json`. |
        | `Authorization` | Yes | Basic Auth. `{"Authorization": "Basic Base64_ENCODED_WORKSPACEID_APIKEY="}` |
        | `MOE-APPKEY` | Yes | Your MoEngage App ID. Found in Settings -> Account -> APIs -> App ID. |

security:
  - basicAuth: []
paths:
  /v2/custom-segments/file-segment:
    post:
      tags:
        - File Segments
      summary: Create File Segment
      description: This API creates a new file segment from a CSV file URL.
      operationId: createFileSegment
      parameters:
        - name: MOE-DBNAME
          in: header
          description: The MoEngage database name (`db_name`) from which the data is available.
          required: true
          schema:
            type: string
      x-mint:
        content: |
         <Note>
         - If your file is private, you should whitelist [these IPs](/user-guide/settings/account/security/ip-whitelisting-in-moengage) to provide access only to MoEngage for the file.
         - This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
         </Note>
         
         
         #### Rate Limits
         
         | Rate Limit Name | Rate Limit |
         | :--- | :--- |
         | total active segment | The limit of the total number of active segments at a time for a client is 1000. |
         | file_segment ops per hour | The total number of file segment operations (create/add/remove) per hour per client allowed is 10. |
         | file_segment ops per day | The total number of file segment operations (create/add/remove) per day per client allowed is 100. |
         | file_segment users per day | The total number of users uploaded via the File segment is limited to 2 million per day. (This limit is customizable, contact the MoEngage Support team). |
         | file_size_limit | The size of the file from which the segment is created/updated. For each request, the file size limit is 150 MB. |
         
          <Note>
           **Notes**
           * Breaching the limits will reject the request.
           * Per hour and per day limits will consider the calculation based on the last hour and last 24 hrs respectively.
           * The limit of 1000 active segments is calculated across all types of 'active segments'. Most of our customers utilise only 30-40% of this limit at any given point.
           </Note>
          
           #### CSV File Requirements
            * The attribute names should be separated by new lines.
            * CSV should be a single column and less than 150MB.
            * Values should not end with a comma (e.g., `abcd` not `abcd,`).
            * Values should not have duplicates or special characters (e.g., `abcd` not `"abcd"` or `a#bc`).
            * File should not have empty rows or columns.
            * A user attribute value must uniquely identify a single user.
            * [Sample File Link](https://app-cdn.moengage.com/assets/Sample_GAIDs.csv)
         
           #### Segment Processing and Availability
          
            As soon as the request is received at the MoEngage system, MoEngage creates a segment with zero users. After this, the file is processed and users are added to the segment. If the created segment is queried in between the file processing, it will show zero or partial user count.

      requestBody:
        description: Configuration for the new file segment.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentRequestV2'
            example:
              name: "custom_segment_unique_name"
              attribute_name: "unique_identifier"
              attribute_type: "string"
              file_url: "https://s3.amazonaws.com/Sample_GAIDs.csv"
              callback_url: "http://example.com/moengage-callback"
              emails: ["user1@example.com", "user2@example.com"]
              expiry_time: 30
      responses:
        '202':
          description: Request accepted for processing.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FileSegmentAcceptedResponseV2'
                  - $ref: '#/components/schemas/CallbackV2'
              examples:
                api_response:
                  summary: API Response - Success
                  description: Immediate response from the API when the request is accepted.
                  value:
                    message: "File-segment creation request accepted"
                    success: true
                    cs_name: "custom_segment_unique_name"
                    cs_id: "<unique cs id>"
                callback_success:
                  summary: Callback - Success
                  description: Callback sent to your callback_url when segment processing completes successfully.
                  value:
                    db_name: "test_db"
                    segment_name: "test_segment_name"
                    request_id: "d5a263c4ef1198ae3d8496c0460f570f"
                    values_found: 80
                    values_processed: 70
                    user_count: 60
                    status: 201
        '400':
          description: Bad Request. Request not accepted due to missing a required parameter. The reason is passed in the description field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Invalid Request"
                description: "<message>"
        '401':
          $ref: '#/components/responses/401_FileSegmentError'
        '409':
          $ref: '#/components/responses/409_FileSegmentConflict'
        '429':
          $ref: '#/components/responses/429_FileSegmentRateLimit'
        '500':
          description: Server Errors. Something went wrong on MoEngage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Internal Server Error"
      callbacks:
        segmentCreationCallback:
          $ref: '#/components/callbacks/segmentProcessingCallback'
  /v2/custom-segments/file-segment/add-users:
    put:
      tags:
        - File Segments
      summary: Add Users to File Segment
      description: This API adds a list of users from a CSV file to an existing file segment.
      operationId: addUsersToFileSegment
      parameters:
        - name: MOE-DBNAME
          in: header
          description: The MoEngage database name (`db_name`) from which the data is available.
          required: true
          schema:
            type: string
      x-mint:
        content: |
         <Note>
         This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
         </Note>
      requestBody:
        description: Details of the segment to update and the file URL of users to add.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSegmentRequestV2'
            example:
              name: "custom_segment_unique_name"
              "cs_id": "<unique cs id>"
              attribute_name: "unique_identifier"
              attribute_type: "string"
              file_url: "https://s3.amazonaws.com/Sample_GAIDs_add.csv"
              callback_url: "http://example.com/moengage-callback"
              emails: ["user1@example.com"]
      responses:
        '202':
          description: Request accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSegmentAcceptedResponseV2'
              example:
                message: "File-segment user-add request accepted"
                success: true
                cs_name: "custom_segment_unique_name"
                "cs_id": "<unique cs id>"
        '400':
          description: Bad Request. Invalid payload format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Invalid Request"
                description: "<message>"
        '401':
          $ref: '#/components/responses/401_FileSegmentError'
        '404':
          $ref: '#/components/responses/404_FileSegmentNotFound'
        '429':
          $ref: '#/components/responses/429_FileSegmentRateLimit'
        '500':
          description: Server Errors. Something went wrong on MoEngage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Internal Server Error"
  /v2/custom-segments/file-segment/remove-users:
    put:
      tags:
        - File Segments
      summary: Remove Users from File Segment
      description: This API removes a list of users from a CSV file from an existing file segment.
      operationId: removeUsersFromFileSegment
      parameters:
        - name: MOE-DBNAME
          in: header
          description: The MoEngage database name (`db_name`) from which the data is available.
          required: true
          schema:
            type: string
      x-mint:
        content: |
         <Note>
         This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
         </Note>
      requestBody:
        description: Details of the segment to update and the file URL of users to remove.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSegmentRequestV2'
            example:
              name: "custom_segment_unique_name"
              "cs_id": "<unique cs id>"
              attribute_name: "unique_identifier"
              attribute_type: "string"
              file_url: "https://s3.amazonaws.com/Sample_GAIDs_remove.csv"
              callback_url: "http://example.com/moengage-callback"
              emails: ["user1@example.com"]
      responses:
        '202':
          description: Request accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSegmentAcceptedResponseV2'
              example:
                message: "File-segment user-remove request accepted"
                success: true
                cs_name: "custom_segment_unique_name"
                "cs_id": "<unique cs id>"
        '400':
          description: Bad Request. Invalid payload format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Invalid Request"
                description: "<message>"
        '401':
          $ref: '#/components/responses/401_FileSegmentError'
        '404':
          $ref: '#/components/responses/404_FileSegmentNotFound'
        '429':
          $ref: '#/components/responses/429_FileSegmentRateLimit'
        '500':
          description: Server Errors. Something went wrong on MoEngage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Internal Server Error"
  /v2/custom-segments/file-segment/replace:
    put:
      tags:
        - File Segments
      summary: Replace Users from File Segment
      description: This API replaces all users in an existing file segment with a new list of users from a CSV file.
      operationId: replaceUsersInFileSegment
      parameters:
        - name: MOE-DBNAME
          in: header
          description: The MoEngage database name (`db_name`) from which the data is available.
          required: true
          schema:
            type: string
      x-mint:
        content: |
          <Note>
          **Notes:**

            * This API drops all existing users from the segment and adds the new users provided in the File URL.
            * Only the newly added users are counted towards the daily file segment user limit.
            * This API does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
          </Note>
      requestBody:
        description: Details of the segment to update and the file URL of users to replace with.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSegmentRequestV2'
            example:
              name: "custom_segment_unique_name"
              attribute_name: "unique_identifier"
              "cs_id": "<unique cs id>"
              attribute_type: "string"
              file_url: "https://s3.amazonaws.com/Sample_GAIDs_replace.csv"
              callback_url: "http://example.com/moengage-callback"
              emails: ["user1@example.com"]
      responses:
        '202':
          description: Request accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSegmentAcceptedResponseV2'
              example:
                message: "File-segment user-replace request accepted"
                success: true
                cs_name: "custom_segment_unique_name"
                "cs_id": "<unique cs id>"
        '400':
          description: Bad Request. Invalid payload format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Invalid Request"
                description: "<message>"
        '401':
          $ref: '#/components/responses/401_FileSegmentError'
        '404':
          $ref: '#/components/responses/404_FileSegmentNotFound'
        '429':
          $ref: '#/components/responses/429_FileSegmentRateLimit'
        '500':
          description: Server Errors. Something went wrong on MoEngage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorV2'
              example:
                title: "Internal Server Error"
  /v2/custom-segments/archive:
    patch:
      tags:
        - Manage Segments
      summary: Archive Segment
      description: This API archives an existing segment (File or Filter). Archiving and unarchiving through APIs makes it easy to retrieve and reuse segments whenever required for purposes such as A/B testing, maintaining regulatory compliance, and improving system performance. You can unarchive an archived segment to reuse it in campaigns and analysis without recreating it from scratch.
      operationId: archiveCustomSegment
      parameters:
        - $ref: '#/components/parameters/DbNameHeader'
      x-mint:
        content: |
          <Warning>
            Archived segments will not be shown beyond 180 days.
          </Warning>
          <Note>
            This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
          </Note>
      requestBody:
        description: The name of the segment to be archived.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentNameRequestV2'
            example:
              name: "custom_segment_unique_name"
              "cs_id": "<unique cs id>"
      responses:
        '200':
          description: Segment archived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccessV2'
              example:
                message: "Successfully archived the custom segment"
                success: true
                cs_name: "custom_segment_unique_name"
        '400':
          $ref: '#/components/responses/400_FileSegmentError'
        '401':
          $ref: '#/components/responses/401_FileSegmentError'
        '404':
          $ref: '#/components/responses/404_FileSegmentNotFound'
        '500':
          $ref: '#/components/responses/5XX_FileSegmentError'
  /v2/custom-segments/unarchive:
    patch:
      tags:
        - Manage Segments
      summary: Unarchive Segment
      description: This API unarchives an existing segment, making it active again.
      operationId: unarchiveCustomSegment
      parameters:
        - $ref: '#/components/parameters/DbNameHeader'
      x-mint:
        content: |
         <Note>
         This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
         </Note>
      requestBody:
        description: The name of the segment to be unarchived.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentNameRequestV2'
            example:
              name: "custom_segment_unique_name"
              "cs_id": "<unique cs id>"
      responses:
        '200':
          description: Segment unarchived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccessV2'
              example:
                message: "Successfully unarchived the custom segment"
                success: true
                cs_name: "custom_segment_unique_name"
        '400':
          $ref: '#/components/responses/400_FileSegmentError'
        '401':
          $ref: '#/components/responses/401_FileSegmentError'
        '404':
          $ref: '#/components/responses/404_FileSegmentNotFound'
        '500':
          $ref: '#/components/responses/5XX_FileSegmentError'
  /v3/custom-segments:
    get:
      tags:
        - Filter Segments
      summary: List Segments
      description: This API lists all segments. You can optionally filter segments by an exact name match.
      operationId: listCustomSegments
      x-mint:
        content: |
          <Note>
          This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
          </Note>
          
          #### Rate Limit

          The rate limit is 50 request/minute, 200 requests/hour, and 1000 requests/day.
      parameters:
        - $ref: '#/components/parameters/AppKeyHeader'
        - $ref: '#/components/parameters/SegmentNameQuery'
      responses:
        '200':
          $ref: '#/components/responses/200_SegmentListV3'
        '400':
          $ref: '#/components/responses/400_FilterSegmentListError'
        '401':
          $ref: '#/components/responses/401_FilterSegmentError'
        '429':
          $ref: '#/components/responses/429_FilterSegmentRateLimitOnly'
        '500':
          $ref: '#/components/responses/500_FilterSegmentError'
    post:
      tags:
        - Filter Segments
      summary: Create Filter Segment
      description: This API creates a new segment based on a set of filter conditions.
      operationId: createFilterSegment
      x-mint:
        content: |
          <Note>
          This API endpoint does not currently support Team-level scoping. All segments generated using this call will be assigned to the Default Team automatically.
          </Note>

          #### Generate Request from Dashboard

          To simplify payload generation, MoEngage provides a tool in the dashboard where you can configure filters and export the payload.

          1. Log in to the MoEngage dashboard.
          2. Click **Test & Debug** at the lower left in the side panel.
          3. Click **Segment Payload**.
          4. Specify the segment name and configure the required filters.
          5. Click **Generate Payload**.

          #### Rate Limit

          The rate limit is 50 requests/minute, 200 requests/hour, and 1000 requests/day.

          ---

          ## Payload Reference

          ### Top-Level Structure

          Every segment request is a tree of filters under `included_filters` and an optional `excluded_filters` root.

          ```json
          {
            "name": "my-segment",
            "included_filters": {
              "filter_operator": "and",
              "filters": []
            },
            "excluded_filters": {
              "filter_operator": "and",
              "filters": []
            }
          }
          ```

          `filter_operator` at every level accepts `"and"` or `"or"`. Groups can nest to arbitrary depth using `nested_filters`.

          ---

          ### Filter Types

          | `filter_type` | Purpose |
          |---|---|
          | `user_attributes` | Filter by a user profile attribute |
          | `actions` | Filter by an event the user has or has not performed |
          | `psychographic_event` | Filter by affinity/behavioral patterns over an event |
          | `custom_segments` | Reference a saved segment by ID |
          | `nested_filters` | AND/OR group container for combining other filters |

          ---

          ### User Property Filter (`filter_type: "user_attributes"`)

          #### Required Fields

          | Field | Type | Notes |
          |---|---|---|
          | `filter_type` | string | Always `"user_attributes"` |
          | `name` | string | Attribute name, for example `last_purchase_date` |
          | `data_type` | string | See data type table below |
          | `category` | string | The attribute group the attribute belongs to (for example, `"Tracked Custom Attribute"`). Always include this key. |
          | `operator` | string | Allowed set varies by `data_type`; omit for `geopoint`, `object`, `array_object` |
          | `negate` | boolean | `true` inverts the filter; absent for `geopoint` |
          | `value` | varies | Shape depends on operator; absent for `exists` and `today` |

          #### Supported Data Types

          | `data_type` | Allowed operators | Extra fields |
          |---|---|---|
          | `string` | `in`, `containsInTheFollowing`, `startsWithInTheFollowing`, `endsWithInTheFollowing`, `contains`, `is`, `exists` | `case_sensitive` |
          | `double` | `in`, `lessThan`, `greaterThan`, `between`, `exists` | `value1` when `operator` is `between` |
          | `bool` | `is`, `exists` | — |
          | `datetime` | `on`, `between`, `before`, `after`, `inTheLast`, `inTheNext`, `today`, `is`, `in`, `exists` | `value_type`, `value1` for `between`, `extract_type` for date-part filters |
          | `geopoint` | (implicit `around`) | `value` (latitude), `value1` (longitude), `radius`; no `operator` or `negate` |
          | `array_string` | `in`, `contains`, `startsWith`, `endsWith`, `is`, `exists` | `case_sensitive`, `array_filter_type` (`any_of` or `all_of`); removed when `negate: true` |
          | `array_double` | `in`, `lessThan`, `greaterThan`, `between`, `exists` | `array_filter_type` (`any_of` or `all_of`); `value1` for `between`; removed when `negate: true` |
          | `object` | N/A | `filter_operator`, `filters[]` (recursive); no `operator`, `negate`, or `value` |
          | `array_object` | N/A | `filter_operator`, `filters[]` (recursive); no `operator`, `negate`, or `value` |

          **"Contains spaces" and "is empty":** the dashboard shows these as operators, but there is no `containsSpaces` or `is_empty` operator at the payload level. Send the equivalent operator and value instead:

          | Dashboard option | `operator` | `value` |
          |---|---|---|
          | Contains spaces | `contains` | `" "` (a single space) |
          | Is empty | `is` | `""` (an empty string) |

          Negate either one with `negate: true` to express "does not contain spaces" or "is not empty".

          **`value` shape by operator:**
          - Array: `in` (string, double, array types); `containsInTheFollowing`, `startsWithInTheFollowing`, `endsWithInTheFollowing` (string); `contains`, `startsWith`, `endsWith` (array_string); `in` (datetime with time/day/month extract types)
          - Scalar: `is` (bool, datetime, and the string/array_string cases in the table above), `on`, `before`, `after`, `lessThan`, `greaterThan`, `inTheLast`, `inTheNext`
          - Absent: `exists`, `today`

          **`exists` cleans up:** When `operator` is `exists`, `value`, `value1`, and `value_type` are removed from the payload.

          #### Datetime `value_type` and `extract_type`

          Set `value_type` to:
          - `"absolute"` — `value` is an ISO 8601 date string, for example `"2024-01-15T00:00:00.000Z"`
          - `"relative_past"` — `value` is an integer number of days/hours/months ago
          - `"relative_future"` — `value` is an integer number of days/hours/months in the future (used with the `after` and `inTheNext` operators)

          Set `extract_type` to filter on a specific part of the date:
          - `"time_of_the_day"` — hour (0–23)
          - `"day_of_the_week"` — weekday (0–6)
          - `"day_of_the_month"` — day (1–31)
          - `"month_of_the_year"` — month (1–12)
          - `"date_month_of_the_year"` — month and day as an `MM-DD` string, for example `"06-15"`

          #### Cross-Attribute Comparison (Dynamic Values)

          To compare a user attribute against another user attribute rather than a literal, set `is_dynamic_value: true`, set `dynamic_attribute_type` to the base type of the referenced attribute, and use a template string in `value`:

          | Source | `value` template |
          |---|---|
          | User attribute | `"{{MoeUserAttribute['<attr_name>']}}"` |

          <Note>
          Segment creation supports comparing a user attribute against another **user attribute** only. Comparing against an event attribute or a business event attribute is available in campaign filters, not when creating a segment.
          </Note>

          For array types, `dynamic_attribute_type` uses the base element type: `array_string` → `"string"`, `array_double` → `"double"`. For `datetime`, `value_type` is forced to `"absolute"`.

          Cross-attribute comparison is not available for:
          - `object` and `array_object` attributes.
          - `double` and `array_double` attributes when `operator` is `between`.

          ```json
          {
            "name": "order_value",
            "data_type": "double",
            "filter_type": "user_attributes",
            "operator": "greaterThan",
            "negate": false,
            "value": "{{MoeUserAttribute['lifetime_value']}}",
            "is_dynamic_value": true,
            "dynamic_attribute_type": "double"
          }
          ```

          ---

          ### User Behavior Filter (`filter_type: "actions"`)

          #### Required Fields

          | Field | Type | Notes |
          |---|---|---|
          | `filter_type` | string | Always `"actions"` |
          | `action_name` | string | The internal event name |
          | `project_name` | string | Optional; portfolio (multi-project) workspaces only. See below. |
          | `executed` | boolean | `true` = has performed; `false` = has NOT performed |
          | `execution` | object | Frequency condition |
          | `primary_time_range` | object | Time window for the event |
          | `attributes` | object | Event attribute sub-filters; always include, even when empty |

          The three object fields use these key names:

          ```json
          {
            "filter_type": "actions",
            "action_name": "purchase",
            "executed": true,
            "execution": { "type": "atleast", "count": 1 },
            "primary_time_range": {
              "type": "inTheLast",
              "value": 30,
              "value_type": "relative_past",
              "period_unit": "days"
            },
            "attributes": { "filter_operator": "and", "filters": [] }
          }
          ```

          #### Execution (Frequency)

          | `execution.type` | Meaning | `count` required |
          |---|---|---|
          | `atleast` | At least N times (default for `executed: true`) | Yes |
          | `exactly` | Exactly N times | Yes |
          | `atmost` | At most N times | Yes |
          | `firstTime` | For the first time only | No — omit `count` |
          | `lastTime` | For the last time only | No — omit `count` |

          When `executed: false`, `execution` is `{ "type": "exactly", "count": 0 }`.

          #### Primary Time Range

          `primary_time_range` stores five keys: `type`, `value`, `value1` (only for `between`), `value_type`, and `period_unit`. The payload accepts five `type` values:

          | `type` | `value` shape | Needs `value1` | `value_type` |
          |---|---|---|---|
          | `inTheLast` | Integer count of `period_unit` | No | `relative_past` (locked) |
          | `between` | Start value: ISO date or integer count | Yes (end value) | `absolute` or `relative_past` |
          | `on` | ISO date or integer count | No | `absolute` or `relative_past` |
          | `before` | ISO date or integer count | No | `absolute` or `relative_past` |
          | `after` | ISO 8601 date | No | `absolute` (locked) |

          `period_unit` accepts `hours`, `days`, `weeks`, or `months`, and applies to `inTheLast`.

          The dashboard also offers calendar windows such as **Today** and **This week**. These are not payload `type` values — each maps onto `type: "on"` with a specific `value` and `period_unit`:

          | Dashboard option | Payload |
          |---|---|
          | Today | `{ "type": "on", "value": 0, "value_type": "relative_past", "period_unit": "days" }` |
          | Yesterday | `{ "type": "on", "value": 1, "value_type": "relative_past", "period_unit": "days" }` |
          | This week | `{ "type": "on", "value": 0, "value_type": "relative_past", "period_unit": "weeks" }` |
          | Last week | `{ "type": "on", "value": 1, "value_type": "relative_past", "period_unit": "weeks" }` |
          | This month | `{ "type": "on", "value": 0, "value_type": "relative_past", "period_unit": "months" }` |
          | Last month | `{ "type": "on", "value": 1, "value_type": "relative_past", "period_unit": "months" }` |

          Absolute date formatting: `value` → `YYYY-MM-DDT00:00:00.000Z`; `value1` → `YYYY-MM-DDT23:59:59.999Z`. For `between`, `value1` must be greater than `value`.

          #### Event Attribute Sub-Filters

          Use the `attributes` block to narrow which event occurrences count — for example, a `purchase` event where `product_category` is `"electronics"`.

          Inner filters follow the same shape as User Property filters, with two differences:
          - `filter_type` is `"action_attributes"` instead of `"user_attributes"`.
          - `category` is the event attribute's own category, for example `"Event Property"`.

          Inner filters start directly from `filter_operator` and `filters` — do not add `included_filters` or `excluded_filters` inside the `attributes` block.

          ```json
          "attributes": {
            "filter_operator": "and",
            "filters": [
              {
                "name": "currency",
                "data_type": "string",
                "category": "Event Property",
                "filter_type": "action_attributes",
                "operator": "is",
                "negate": false,
                "case_sensitive": false,
                "value": "USD"
              }
            ]
          }
          ```

          #### Aggregation (sum / avg / min / max / median)

          Add `aggregation_attributes` to compare an aggregate of a numeric event attribute against a threshold. The block holds exactly one filter.

          Aggregation is only available when `executed: true`, `execution.type` is not `firstTime` or `lastTime`, and `primary_time_range.type` is not `before` or `after`.

          | Key | Values |
          |---|---|
          | `attribute_name` | The numeric event attribute to aggregate |
          | `data_type` | `double` |
          | `aggregation_type` | `sum`, `avg`, `min`, `max`, `median` |
          | `operator` | `is`, `between`, `lessThan`, `greaterThan` |
          | `negate` | `true` inverts the comparison ("is not equal to", "is not between") |
          | `value` | The numeric threshold; add `value1` when `operator` is `between` |
          | `comparator` | Omit for a plain aggregate. Set to `change` or `percentageChange` to compare against an earlier window |
          | `base_time_range` | Required when `comparator` is set; omit otherwise |

          ```json
          "aggregation_attributes": {
            "filter_operator": "and",
            "filters": [
              {
                "attribute_name": "revenue",
                "data_type": "double",
                "aggregation_type": "sum",
                "operator": "greaterThan",
                "negate": false,
                "value": 1000,
                "is_dynamic_value": false
              }
            ]
          }
          ```

          **Comparing against an earlier window.** When `comparator` is `change` or `percentageChange`, add `base_time_range` to define the window to compare against:

          | Base window | `base_time_range` |
          |---|---|
          | Previous period | `{ "type": "previousPeriod" }` |
          | Fixed date range | `{ "type": "between", "value": "<start ISO>", "value1": "<end ISO>" }` |

          ```json
          {
            "attribute_name": "revenue",
            "data_type": "double",
            "aggregation_type": "sum",
            "operator": "greaterThan",
            "negate": false,
            "value": 25,
            "is_dynamic_value": false,
            "comparator": "percentageChange",
            "base_time_range": {
              "type": "between",
              "value": "2024-01-01T00:00:00.000Z",
              "value1": "2024-01-31T23:59:59.999Z"
            }
          }
          ```

          #### Portfolio (Multi-Project) Workspaces

          In workspaces with more than one project, add `project_name` to the event filter to scope the event to a specific project. Omit it in single-project workspaces.

          To target all projects, set `project_name` to `"moe_portfolio"`.

          ---

          ### User Affinity Filter (`filter_type: "psychographic_event"`)

          Targets users based on behavioral affinity over an event. `primary_time_range` and `psychographic_attributes` are required.

          Psychographic attribute filters support only the `string` and `double` data types. The `primary_time_range` object also uses a different shape from User Behavior filters: relative windows use `days` (and `days1`) instead of `value`/`value1`, and absolute windows use `from` and `to` ISO 8601 dates, along with `type` and `value_type`.

          | `operator_type` | Extra field | Meaning |
          |---|---|---|
          | `predominant` | — | User most frequently exhibits this affinity |
          | `minimum` | `percent_of_times` (1–100) | Affinity is present at least N% of the time |
          | `top` | `percent_of_users` (1–100) | User is in the top N% by this affinity metric |
          | `bottom` | `percent_of_users` (1–100) | User is in the bottom N% by this affinity metric |

          ---

          ### Custom Segment Filter (`filter_type: "custom_segments"`)

          References a saved segment by ID. The backend resolves the segment by `id`; `name` is a display label only.

          ```json
          { "filter_type": "custom_segments", "id": "5c93982f573bb92004975a36", "name": "High-value customers" }
          ```

          ---

          ### Nested Filters (`filter_type: "nested_filters"`)

          Use `nested_filters` inside `included_filters` or `excluded_filters` to create complex boolean logic (for example, `(A AND B) OR (C AND D)`). Groups can nest to arbitrary depth.

          ```json
          {
            "filter_type": "nested_filters",
            "filter_operator": "or",
            "filters": [
              { "filter_type": "user_attributes", ... },
              { "filter_type": "actions", ... }
            ]
          }
          ```
      parameters:
        - $ref: '#/components/parameters/AppKeyHeader'
      requestBody:
        description: The filter definition for the new segment.
        required: true
        content:
