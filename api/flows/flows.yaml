        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '401':
          $ref: '#/components/responses/AnalyticsUnauthorized'
        '404':
          $ref: '#/components/responses/AnalyticsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.

        - **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: On your MoEngage workspace, navigate to **Settings** → **Account** → **API keys** and click **Create new key**. Grant the key access to the APIs it needs, such as Data, Segmentation, Push, Email, Campaigns, or Templates, and set its permissions for each one. Flows reuse the Campaigns permissions, so select **View** for the read endpoints and **Create & Manage** for Update Flow Status.

        For more information on authentication and getting your credentials, refer to [Getting your credentials](/api/introduction#getting-your-credentials).

        Send the value in the `Authorization` header as `Basic` followed by Base64-encoding of `appkey:apisecret` (workspace ID and API key).

  headers:
    XMoeRequestId:
      description: Echoed request ID. If you do not provide one, the server generates it.
      schema:
        type: string

    XMoeRequestIdEchoed:
      description: Echoes the X-MOE-Request-Id that you supplied.
      schema:
        type: string

  parameters:
    FlowId:
      name: flow_id
      in: path
      required: true
      description: >
        The 24-character ID of the flow. This must be the flow's own ID, not a version ID;
        passing a version ID returns `400`.
      schema:
        type: string
        pattern: '^[a-f0-9]{24}$'
        example: "6a3b09c938da57c8f5838880"

    XMoeRequestIdHeader:
      name: X-MOE-Request-Id
      in: header
      required: false
      description: >
        Client-supplied trace ID. The server echoes it in the `X-MOE-Request-Id` response header
        and in `response_id`. If you omit it, the server generates one.
      schema:
        type: string


    VersionName:
      name: version_name
      in: query
      required: false
      description: Flow version to query. Defaults to the active version.
      schema:
        type: string
        enum:
          - "Version 1"
          - "Version 2"
          - "All Versions"
        example: "Version 2"

    XMoeTenantId:
      name: X-MOE-Tenant-ID
      in: header
      required: true
      description: >
        Identifies the workspace making the request. The analytics endpoints read this header
        directly and do not resolve the workspace from the Basic Auth credentials, so you must send
        it. Omitting it returns a `401` with the code `MISSING_TENANT_ID`, and a value that cannot
        be resolved returns a `401` with the code `INVALID_TENANT_ID`.
      schema:
        type: string

    XMoeScopes:
      name: X-MOE-SCOPES
      in: header
      required: false
      description: The scope of the request. MoEngage recommends that you send it.
      schema:
        type: string

    AttributionType:
      name: attribution_type
      in: query
      required: true
      description: >
        The attribution model MoEngage applies to the conversion metrics. There is no default, so
        omitting it returns a `400` with the code `INVALID_REQUEST`.
      schema:
        type: string
        enum:
          - VIEW_THROUGH
          - CLICK_THROUGH
          - IN_SESSION
          - TOTAL_CONVERSIONS
          - CLICK_CONVERSIONS

    MetricType:
      name: metric_type
      in: query
      required: true
      description: >
        Whether MoEngage returns total counts or counts of unique users. There is no default, so
        omitting it returns a `400` with the code `INVALID_REQUEST`.
      schema:
        type: string
        enum:
          - TOTAL
          - UNIQUE

    Granularity:
      name: granularity
      in: query
      required: false
      description: |
        The time granularity of the response.

        - `overall` returns a single entry covering the whole date range, and each entry omits
          `timestamp`.
        - `daily`, `weekly`, and `monthly` return one entry per period, and each entry carries a
          `timestamp` in Unix epoch seconds (UTC).

        MoEngage also accepts `hourly`, `half_hourly`, and `bts_hourly`, but these are not
        recommended for this API and can return empty data.
      schema:
        type: string
        enum:
          - overall
          - daily
          - weekly
          - monthly
          - hourly
          - half_hourly
          - bts_hourly
        default: overall

    ActivityAfter:
      name: activity_after
      in: query
      required: false
      description: |
        The start of the activity window, as an ISO 8601 datetime in UTC. When you omit it,
        MoEngage anchors a 90-day lookback to the end of the window: it uses whichever is later,
        90 days before `activity_before`, or the flow's creation date at midnight UTC. When you
        send both dates, the window cannot exceed 90 days.
      schema:
        type: string
        format: date-time
        example: "2024-01-01T00:00:00Z"

    ActivityBefore:
      name: activity_before
      in: query
      required: false
      description: |
        The end of the activity window, as an ISO 8601 datetime in UTC. When you send both dates,
        it must be the same as or later than `activity_after`. When you omit it and send
        `activity_after`, MoEngage uses whichever is earlier: `activity_after` plus 90 days, or the
        current time, so the window never reaches into the future. When you omit both dates,
        MoEngage uses the current time.
      schema:
        type: string
        format: date-time
        example: "2024-03-31T23:59:59Z"

    AnalyticsVersionName:
      name: version_name
      in: query
      required: false
      description: >
        The flow version to report on. Send `Active Version`, `All Versions`, or `Version N` where
        N is a positive integer, such as `Version 2`. The `Version N` form is case-insensitive.
      schema:
        type: string
        default: "Active Version"
        example: "Version 2"
  schemas:
    FlowStatusEnum:
      type: string
      description: >
        Public lifecycle status of a flow (or of a specific version), independent of the
        `archived` flag.
      enum:
        - DRAFT
        - ACTIVE
        - SCHEDULED
        - PAUSED
        - STOPPED
        - COMPLETED
        - RETIRED
        - UNDER_REVIEW
        - REJECTED

    DeliveryTypeEnum:
      type: string
      description: Indicates how users enter the flow.
      enum:
        - ONE_TIME
        - PERIODIC
        - ON_FLOW_EXIT
        - EVENT_TRIGGERED
        - BUSINESS_EVENT_TRIGGERED

    FlowSearchRequest:
      type: object
      description: >
        Filters for listing flows. All filters are optional and combine with AND. Enum filters
        (`status`, `delivery_type`) are case-insensitive.
      properties:
        request_id:
          type: string
          description: Optional if supplied via the `X-MOE-Request-Id` header; echoed in `response_id`.
        status:
          type: array
          description: Keeps only flows whose status is in this set.
          items:
            $ref: '#/components/schemas/FlowStatusEnum'
        delivery_type:
          type: array
          description: Keeps only flows that have one of these delivery types.
          items:
            $ref: '#/components/schemas/DeliveryTypeEnum'
        tags:
          type: array
          description: The tag names to match; flows that carry any of them are kept.
          items:
            type: string
        teams:
          type: array
          description: >
            Team names. Required when the Flows-teams feature is enabled for the workspace —
            omitting it or sending an empty list returns `400 VALIDATION_FAILED`
            ("teams is required when the team feature is enabled"). When the feature is off,
            sending `teams` is rejected with `400`.
          items:
            type: string
        name:
          type: string
          description: Matches flows whose name contains this text, case-insensitively.
        created_by:
          type: array
          description: The email addresses of the flow creators to filter by.
          items:
            type: string
            format: email
        creation_start_time:
          type: string
          description: The inclusive lower bound on the creation time, in ISO 8601 UTC format.
          example: "2025-01-01T00:00:00Z"
        creation_end_time:
          type: string
          description: The inclusive upper bound on the creation time, in ISO 8601 UTC format. It must be on or after `creation_start_time`.
          example: "2026-12-31T23:59:59Z"
        include_archived:
          type: boolean
          default: false
          description: '`false` (default) excludes archived flows; `true` returns both archived and non-archived.'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: The number of results returned per page.
        cursor:
          type: string
          description: The cursor from a previous page's `next_cursor`. Omit for the first page.

    FlowSummary:
      type: object
      description: One flow as it appears in a search or list result.
      properties:
        flow_id:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: The ID of the flow.
        name:
          type: string
          description: Display name of the flow.
        status:
          allOf:
            - $ref: '#/components/schemas/FlowStatusEnum'
          description: Lifecycle status of the flow's active version.
        archived:
          type: boolean
          default: false
          description: Whether the flow is archived (spans all versions). Independent of `status`.
        delivery_type:
          $ref: '#/components/schemas/DeliveryTypeEnum'
        active_version_name:
          type: string
          nullable: true
          description: Display name of the active version, such as `Version 3`.
        tags:
          type: array
          description: Tag names attached to the flow.
          items:
            type: string
        created_at:
          type: string
          nullable: true
          description: ISO 8601 UTC creation time.
        updated_at:
          type: string
          nullable: true
          description: ISO 8601 UTC last-update time of the active version.
        published_at:
          type: string
          nullable: true
          description: ISO 8601 UTC publish time of the active version; null if never published.
        created_by:
          type: string
          nullable: true
          description: Email of the flow's creator.

    FlowSearchResponse:
      type: object
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        type:
          type: string
          description: The type of resource the response describes.
          enum: [flow]
        data:
          type: object
          properties:
            flows:
              type: array
              items:
                $ref: '#/components/schemas/FlowSummary'
            has_more:
              type: boolean
              description: Whether another page exists after this one.
            next_cursor:
              type: string
              nullable: true
              description: Cursor to pass as `cursor` for the next page. Null on the last page.

    FlowVersion:
      type: object
      description: One version of a flow, as listed in a detail response's `versions`.
      properties:
        version_id:
          type: string
          pattern: '^[a-f0-9]{24}$'
        version_name:
          type: string
          description: Display name, such as `Version 2`.
        version_no:
          type: integer
          nullable: true
          description: The numeric version, parsed from the trailing integer of `version_name`.
        status:
          allOf:
            - $ref: '#/components/schemas/FlowStatusEnum'
          description: This version's own lifecycle status.

    FlowNode:
      type: object
      description: One stage of the flow, such as a trigger, an action, a wait, a condition, or a split.
      properties:
        stage_id:
          type: string
          description: Unique ID of this node within the flow.
        type:
          type: string
          description: The category of this node.
          enum: [TRIGGER, ACTION, CONTROL, CONDITION, SPLIT, BRANCH]
        sub_type:
          type: string
          description: >
            Public sub-type within `type`:
            `TRIGGER` — `EVENT`, `BUSINESS_EVENT`, `ONE_TIME`, or `PERIODIC`;
            `ACTION` — a channel (`EMAIL`, `SMS`, `PUSH`, `WHATSAPP`, `IN_APP`, `ONSITE`,
            `CONNECTOR`, `CARDS`, `FB_AUDIENCE`, `GOOGLE_ADS`, `CONNECTED_APPS`) or `NBA`;
            `CONTROL` — `EXIT`, `WAIT_FOR_TIMER`, or `GO_TO`;
            `SPLIT` — `AB_SPLIT`, `IPO`, or `CONDITIONAL_SPLIT`;
            `CONDITION` — `HAS_DONE_EVENT`, `ON_EMAIL_CLICK`, `ON_EMAIL_OPEN`, or `CHECK_USER_ATTRIBUTE`;
            `BRANCH` mirrors its parent split or condition.
        parent_stage_id:
          type: string
          nullable: true
          description: ID of the parent node, or null for the entry (`TRIGGER`) node.
        child_stage_ids:
          type: array
          description: IDs of the immediate downstream nodes.
          items:
            type: string
        label:
          type: string
          nullable: true
          description: Human-readable label shown in the flow builder.
        config:
          type: object
          additionalProperties: true
          description: >
            Type-specific configuration. The shape depends on `type` and `sub_type`; null-valued
            fields are omitted. The example below shows a `CONDITION` node's config. For the config
            shape of every node type (`CONDITION`, `BRANCH`, `SPLIT`, `ACTION`/`NBA`, and `CONTROL`),
            see [Flow structure and nodes](/api/flows/flows-overview#flow-structure-and-nodes).
          example:
            condition:
              filter_operator: and
              filters:
                - action_name: MOE_EMAIL_CLICK
                  executed: true
                  filter_type: actions
                  execution:
                    count: 1
                    type: atleast
                  attributes:
                    filter_operator: and
                    filters: []
            wait:
              duration: 5
              unit: mins
            evaluation_timing: SINCE_PREVIOUS_STAGE

    FlowDetailData:
      allOf:
        - $ref: '#/components/schemas/FlowSummary'
        - type: object
          description: >
            Full single-flow detail. Carries every `FlowSummary` field plus the version list,
            publish metadata, settings, attribution, conversion goal, and its stages.
          properties:
            active_version_name:
              type: string
              nullable: true
              description: Display name of the flow's active version.
            versions:
              type: array
              nullable: true
              description: All versions of the flow, sorted by `version_no`. Null for a single-version flow.
              items:
                $ref: '#/components/schemas/FlowVersion'
            published_by:
              type: string
              nullable: true
              description: Email of the user who published this version.
            approvers:
              type: array
              nullable: true
              description: Approver emails (CAF), when set.
              items:
                type: string
            global_control_group_enabled:
              type: boolean
              default: false
              description: Whether the global control group is enabled for this flow.
            settings:
              $ref: '#/components/schemas/FlowSettings'
            attribution:
              $ref: '#/components/schemas/FlowAttribution'
            conversion_goal_details:
              $ref: '#/components/schemas/ConversionGoalDetails'
            structure:
              type: object
              description: The stages of the flow.
              properties:
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/FlowNode'

    FlowSettings:
      type: object
      description: Flow-level settings. Null-valued fields may be omitted.
      properties:
        control_group:
          type: object
          properties:
            enabled:
              type: boolean
              nullable: true
              description: Whether a control group (holdout) is enabled for this flow.
            percentage:
              type: number
              nullable: true
              description: The percentage of users held out as a control group.
            stickiness:
              type: boolean
              nullable: true
              description: Keeps a user in the same control or treatment assignment across re-entry.
        frequency_capping:
          type: object
          properties:
            ignore:
              type: boolean
              nullable: true
              description: Ignores frequency capping for this flow.
            ignore_and_count:
              type: boolean
              nullable: true
              description: Ignores capping but still counts sends toward it.
        inactive_eviction_days:
          type: integer
          nullable: true
          description: The number of days of user inactivity after which a user is evicted from the flow.
        on_failure:
          type: string
          nullable: true
          description: Defines the behavior when a stage fails.
        bypass_dnd:
          type: boolean
          nullable: true
          description: Sends messages even during the workspace Do-Not-Disturb window.

    FlowAttribution:
      type: object
      nullable: true
      description: >
        Click and impression attribution windows for the flow, derived from its channel action
        nodes. Null when no channel action declares them.
      properties:
        click_track_hours:
          type: integer
          nullable: true
        impression_track_hours:
          type: integer
          nullable: true

    ConversionGoalDetails:
      type: object
      nullable: true
      description: Conversion-goal configuration from the entry node. Null when the flow has no conversion goal.
      properties:
        primary_goal:
          type: object
          properties:
            event:
              type: string
              nullable: true
              description: The name of the conversion-goal event.
            goal_name:
              type: string
              nullable: true
        secondary_goals:
          type: array
          items:
            type: object
            properties:
              event:
                type: string
                nullable: true
              goal_name:
                type: string
                nullable: true
        revenue_tracking:
          type: boolean
          description: Whether revenue is attributed for the primary goal.
        revenue_attribute:
          type: string
          nullable: true
          description: Event attribute carrying the revenue amount. Present only when `revenue_tracking` is true.
        revenue_currency:
          type: string
          nullable: true
          description: Currency of the revenue attribute. Present only when `revenue_tracking` is true.
        exit_on_conversion:
          type: boolean
          nullable: true
          description: Whether a user exits the flow once they convert.

    FlowDetailResponse:
      type: object
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        type:
          type: string
          description: The type of resource the response describes.
          enum: [flow]
        data:
          $ref: '#/components/schemas/FlowDetailData'

    FlowStatusRequest:
      type: object
      required: [action, updated_by]
      properties:
        action:
          type: string
          description: The lifecycle operation to apply. `publish` is not available in this phase.
          enum: [pause, resume, stop, retire, archive, unarchive]
        version_no:
          type: integer
          minimum: 1
          description: >
            Optional. For lifecycle actions (`pause`, `resume`, `stop`, `retire`), acts on this
            version (default: the active version). Rejected for `archive` / `unarchive`.
        updated_by:
          type: string
          format: email
          description: Email of the user performing the action. Recorded in the audit log.
        request_id:
          type: string
          description: Optional if supplied via the `X-MOE-Request-Id` header; echoed in `response_id`.

    FlowStatusResponse:
      type: object
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        type:
          type: string
          description: The type of resource the response describes.
          enum: [flow]
        data:
          type: object
          properties:
            flow_id:
              type: string
              description: The flow acted on.
            status:
              $ref: '#/components/schemas/FlowStatusEnum'

    ErrorResponse:
      type: object
      required: [error, response_id]
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        error:
          type: object
          description: The details of the failure.
          required: [code, message]
          properties:
            code:
              type: string
              description: A machine-readable code that identifies the type of failure.
              enum:
                - VALIDATION_FAILED
                - BAD_REQUEST
                - NOT_FOUND
                - UNAUTHORIZED
                - FORBIDDEN
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: A human-readable explanation of the failure.
            target:
              type: string
              description: The component or field the error relates to.
            details:
              type: array
              description: One entry per failing check.
              items:
                type: object
                properties:
                  target:
                    type: string
                    description: The field that failed the check.
                  message:
                    type: string
                    description: An explanation of why the field failed the check.

    ChannelEnum:
      type: string
      description: The channels a flow can send through.
      enum:
        - EMAIL
        - SMS
        - PUSH
        - WHATSAPP
        - IN_APP
        - ON_SITE
        - CONNECTOR
        - CARDS
        - FB_AUDIENCE
        - GOOGLE_ADS_AUDIENCE
        - CONNECTED_APPS
        - RCS
        - MMS

    FlowAnalyticsResponse:
      type: object
      required: [response_id, type, data]
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` you sent. When you omit that header, MoEngage generates the value.
          example: "resp_a1b2c3d4"
        type:
          type: string
          description: The resource type. Always `flow_analytics`.
          enum: [flow_analytics]
        data:
          $ref: '#/components/schemas/FlowAnalyticsData'

    FlowAnalyticsData:
      type: object
      required: [flow_id, version_name]
      description: |
        MoEngage omits a field rather than returning it as null when there is no data for it, or when
        you did not ask for it through `fields`. MoEngage also drops any object that would otherwise
        be empty, at any depth, including when filtering by `attribution_type` or `metric_type`
        empties it. Dropping cascades, so a parent left with nothing is dropped too. Empty arrays are
        unaffected and are returned as `[]`.
      properties:
        flow_id:
          type: string
          description: The flow the analytics belong to.
          example: "69e073188980230ec7f0b0f8"
        version_name:
          type: string
          description: The flow version the analytics cover.
          example: "Version 2"
        summary:
          type: array
          description: Trip lifecycle and conversion goal stats, one entry per period.
          items:
            $ref: '#/components/schemas/SummaryEntry'
        drop_stats:
          type: array
          description: Exit and drop reason breakdowns, one entry per period.
          items:
            $ref: '#/components/schemas/DropStatsEntry'
        split_stage_stats:
          type: array
          description: A/B split and Intelligent Path Optimizer stage stats, one entry per period.
          items:
            $ref: '#/components/schemas/SplitStagePeriodEntry'
        business_trigger_stats:
          type: array
          description: Business trigger performance. Returned as an empty array when the flow has none.
          items:
            $ref: '#/components/schemas/BusinessTriggerStat'

    SummaryEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: The start of the period in Unix epoch seconds (UTC). Omitted when `granularity` is `overall`.
          example: 1706745600
        trip_stats:
          $ref: '#/components/schemas/TripStats'
        conversion_goal_stats:
          type: object
          description: Keyed by goal ID. Omitted when the flow has no conversion goals.
          additionalProperties:
            $ref: '#/components/schemas/ConversionGoalStat'

    TripStats:
      type: object
      description: How many trips reached each lifecycle state.
      properties:
        trips_started:
          type: integer
          example: 12400
        trips_completed:
          type: integer
          example: 8900
        trips_in_progress:
          type: integer
          example: 1200
        trips_dropped:
          type: integer
          example: 2300

    ConversionGoalStat:
      type: object
      properties:
        is_primary_goal:
          type: boolean
          description: Whether this is the flow's primary conversion goal.
          example: true
        view_through:
          $ref: '#/components/schemas/ConversionMetrics'
        click_through:
          $ref: '#/components/schemas/ConversionMetrics'

    ConversionMetrics:
      type: object
      properties:
        total:
          type: integer
          example: 1200
        unique:
          type: integer
          example: 980
        cvr:
          type: number
          format: float
          description: The conversion rate.
          example: 0.079
        revenue:
          type: number
          format: float
          example: 45000.0

    DropStatsEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: The start of the period in Unix epoch seconds (UTC). Omitted when `granularity` is `overall`.
          example: 1706745600
        exits:
          type: object
          description: Why users left the flow.
          properties:
            conversions:
              type: object
              description: Keyed by exit reason ID, for users who exited after converting.
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
            exit_reasons:
              type: object
              description: Keyed by exit reason ID.
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
        drops:
          type: object
          description: Why users dropped out of the flow.
          properties:
            drop_reasons:
              type: object
              description: |
                Keyed by drop reason code. Observed codes are `UD_DR_EX` (exceptions),
                `UD_DR_FC_DND` (frequency capping or do-not-disturb), `UD_DR_IF` (inactive flow),
                and `UD_DR_WTE` (wait expired).
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'

    ReasonCount:
      type: object
      required: [count, description]
      properties:
        count:
          type: integer
          example: 120
        description:
          type: string
          description: The readable label for the reason.
          example: "Exceptions"

    SplitStagePeriodEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: The start of the period in Unix epoch seconds (UTC). Omitted when `granularity` is `overall`.
          example: 1706745600
        ab_split_stages:
          type: array
          description: Stats for the A/B split stages in the flow.
          items:
            $ref: '#/components/schemas/SplitStage'
        ipo_stages:
          type: array
          description: Stats for the Intelligent Path Optimizer stages in the flow.
          items:
            $ref: '#/components/schemas/SplitStage'

    SplitStage:
      type: object
      required: [stage_id, stage_name, branches]
      properties:
        stage_id:
          type: string
          example: "sdmimd"
        stage_name:
          type: string
          description: The name given to the stage in the flow builder.
          example: "My Custom Split Name"
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchStat'

    BranchStat:
      type: object
      required: [branch_id, branch_name]
      properties:
        branch_id:
          type: string
          example: "branch_a_id"
        branch_name:
          type: string
          description: The label given to the branch in the flow builder.
          example: "Control"
        stats:
          type: object
          description: The branch's performance stats. Omitted when the branch had no data for the period.
          additionalProperties: true

    BusinessTriggerStat:
      type: object
      required: [trigger_id, data]
      properties:
        trigger_id:
          type: string
          description: The stats ID of the business trigger, not the trigger key you see in the dashboard.
          example: "trig_001"
        data:
          type: array
          description: The trigger's stats, one entry per period. Follows the same filtering rules as `summary`.
          items:
            type: object
            additionalProperties: true

    FlowChannelAnalyticsResponse:
      type: object
      required: [response_id, type, data]
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` you sent. When you omit that header, MoEngage generates the value.
          example: "resp_b2c3d4e5"
        type:
          type: string
          description: The resource type. Always `flow_channel_analytics`.
          enum: [flow_channel_analytics]
        data:
          $ref: '#/components/schemas/FlowChannelAnalyticsData'

    FlowChannelAnalyticsData:
      type: object
      required: [flow_id, channel, version_name]
      description: |
        MoEngage omits a field rather than returning it as null when there is no data for it, or when
        you did not ask for it through `fields`. MoEngage also drops any object that would otherwise
        be empty, at any depth, including when filtering by `attribution_type` or `metric_type`
        empties it. Dropping cascades, so a parent left with nothing is dropped too. Empty arrays are
        unaffected and are returned as `[]`.
      properties:
        flow_id:
          type: string
          example: "69e073188980230ec7f0b0f8"
        channel:
          type: string
          description: The channel the analytics cover, always in lowercase.
          example: "email"
        version_name:
          type: string
          example: "Version 2"
        aggregated_stats:
          type: array
          description: The channel's stats across all its campaigns, one entry per period.
          items:
            $ref: '#/components/schemas/AggregatedChannelStatsEntry'
        campaign_stats:
          type: array
          description: A breakdown for each action node that uses the requested channel.
          items:
            $ref: '#/components/schemas/CampaignStat'

    AggregatedChannelStatsEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: The start of the period in Unix epoch seconds (UTC). Omitted when `granularity` is `overall`.
          example: 1706745600
        performance:
          $ref: '#/components/schemas/ChannelPerformance'
        delivery:
          $ref: '#/components/schemas/ChannelDelivery'

    ChannelPerformance:
      type: object
      description: The engagement stats for the channel. `campaign_stats[].performance` nests the same data more deeply.
      properties:
        group_level_stats:
          type: object
          description: Keyed by user group, such as `control_group`, `global_control_group`, `engaged_group`, and `total`.
          additionalProperties:
            $ref: '#/components/schemas/GroupPerformanceStats'
        conversion_goal_stats:
          type: object
          description: Keyed by goal ID. Omitted when the flow has no conversion goals.
          additionalProperties:
            $ref: '#/components/schemas/ChannelConversionGoalStat'

    GroupPerformanceStats:
      type: object
      properties:
        event_stats:
          type: object
          description: >
            Keyed by event name. Which events appear depends on the channel, such as `sent`,
            `delivered`, `opened`, and `clicked` for email and push, or `attempted`, `sent`, and
            `failed` for connectors.
          additionalProperties:
            $ref: '#/components/schemas/EventStatBreakdown'

    EventStatBreakdown:
      type: object
      description: The event counts split by personalization. `aggregated` is the sum of the other two.
      properties:
        personalized:
          $ref: '#/components/schemas/EventCount'
        non_personalized:
          $ref: '#/components/schemas/EventCount'
        aggregated:
          $ref: '#/components/schemas/EventCount'

    EventCount:
      type: object
      properties:
        total:
          type: integer
          example: 180
        unique:
          type: integer
          description: The count of unique users. Present under `campaign_stats`, omitted under `aggregated_stats`, which reports totals only.
          example: 180

    ChannelConversionGoalStat:
      type: object
      properties:
        channel_level_stats:
          type: object
          description: Keyed by channel. Only the channel you requested appears.
          additionalProperties:
            $ref: '#/components/schemas/ChannelConversionMetricStats'

    ChannelConversionMetricStats:
      type: object
      properties:
        metric_stats:
          type: object
          description: Keyed by attribution metric, such as `total_conversion`. Only the metric matching your `attribution_type` appears.
          additionalProperties:
            $ref: '#/components/schemas/ConversionMetricEntry'

    ConversionMetricEntry:
      type: object
      properties:
        group_metrics:
          type: object
          description: Keyed by user group.
          additionalProperties:
            $ref: '#/components/schemas/ConversionGroupMetrics'
        overall_metrics:
          type: object
          description: The lift the flow produced over the control groups.
          properties:
            uplift:
              type: number
              format: float
              example: 0.0
            gcg_uplift:
              type: number
              format: float
              description: The lift measured against the global control group.
              example: 0.0
            aggregated_uplift:
              type: number
              format: float
              example: 0.0
            revenue_boost:
              type: number
              format: float
              example: 0.0

    ConversionGroupMetrics:
      type: object
      properties:
        conversion_events:
          type: integer
          description: Returned when `metric_type` is `TOTAL`.
          example: 3
        unique_conversions:
          type: integer
          description: Returned when `metric_type` is `UNIQUE`.
          example: 1
        revenue:
          type: number
          example: 0
        average_order_value:
          type: number
          format: float
          example: 0.0
        average_revenue_per_user:
          type: number
          format: float
          example: 0.0
        avg_conversions_per_trip:
          type: number
          format: float
          example: 0.0
        cvr:
          type: number
          format: float
          example: 0.0

    ChannelDelivery:
      type: object
      description: The delivery stats for the channel. `campaign_stats[].delivery` nests the same data more deeply.
      properties:
        group_level_stats:
          type: object
          description: Keyed by user group.
          additionalProperties:
            $ref: '#/components/schemas/GroupDeliveryStats'

    GroupDeliveryStats:
      type: object
      properties:
        delivery_funnel:
          type: object
          description: >
            Keyed by the readable field name for each funnel step, such as
            `reachable_users_in_segment`, `users_with_valid_identifier`, `successfully_sent`, and
            `users_after_duplicate_removal`. The names can differ by channel.
          additionalProperties:
            $ref: '#/components/schemas/ReasonCount'
        send_failure_breakdown:
          type: object
          description: Keyed by failure category. Some categories nest a further level by sub-reason.
          additionalProperties: true
        delivery_failure_breakdown:
          type: object
          description: Keyed by failure reason.
          additionalProperties:
            $ref: '#/components/schemas/ReasonCount'

    CampaignStat:
      type: object
      required: [action_id, campaign_id, stage_name]
      properties:
        action_id:
          type: string
          description: The ID of the action node within the flow.
          example: "action_id_1"
        campaign_id:
          type: string
          example: "camp_xyz001"
        stage_name:
          type: string
          description: The name given to the action stage in the flow builder.
          example: "Welcome Email"
        performance:
          description: >
            The engagement stats for this action node. When `granularity` is `overall`, this is a
            single object. For a time-based granularity, it is an array with one object per period,
            each carrying a `timestamp`.
          oneOf:
            - $ref: '#/components/schemas/CampaignPerformanceWrapped'
            - type: array
              items:
                $ref: '#/components/schemas/CampaignPerformanceWrapped'
        delivery:
          $ref: '#/components/schemas/CampaignDeliveryWrapped'

    CampaignPerformanceWrapped:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: The start of the period in Unix epoch seconds (UTC). Present only for a time-based `granularity`.
          example: 1706745600
        total_stats:
          type: object
          properties:
            platform_level_stats:
              type: object
              description: Keyed by platform, such as `ALL_PLATFORMS`.
              additionalProperties:
                type: object
                properties:
                  locale_level_stats:
                    type: object
                    description: Keyed by locale, such as `all_locale`.
                    additionalProperties:
                      type: object
                      properties:
                        variation_level_stats:
                          type: object
                          properties:
                            all_variations:
                              $ref: '#/components/schemas/CampaignVariationStats'

    CampaignVariationStats:
      type: object
      properties:
        event_stats:
          type: object
          description: >
            Keyed by event name, using the same personalized, non-personalized, and aggregated split
            as `GroupPerformanceStats`, with both `total` and `unique` present, plus channel-specific
            rates such as `sent_rate` and `failure_rate`.
          additionalProperties: true
        conversion_goal_stats:
          type: object
          description: Keyed by goal ID.
          additionalProperties:
            $ref: '#/components/schemas/CampaignConversionGoalStat'

    CampaignConversionGoalStat:
      type: object
      properties:
        metric_stats:
          type: object
          description: >
            Keyed by attribution metric. A metric is omitted when this action node recorded no
            conversions for it, and the goal is omitted entirely when every metric is empty.
          additionalProperties: true
        goal_name:
          type: string
          example: "Signup"
        event_name:
          type: string
          example: "goal_001"

    CampaignDeliveryWrapped:
      type: object
      description: The delivery stats for this action node, nested the same way as `performance`.
      properties:
        total_stats:
          type: object
          properties:
            platform_level_stats:
              type: object
              additionalProperties:
                type: object
                properties:
                  locale_level_stats:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        variation_level_stats:
                          type: object
                          properties:
                            all_variations:
                              $ref: '#/components/schemas/GroupDeliveryStats'

    FlowAnalyticsError:
      type: object
      required: [error, response_id]
      description: The error format the Flow Analytics endpoints return. It differs from the format the other Flows endpoints use.
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` you sent. When you omit that header, MoEngage generates the value.
          example: "resp_a1b2c3d4"
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A machine-readable code that identifies the failure.
              enum:
                - INVALID_REQUEST
                - INVALID_FLOW_ID
                - INVALID_DATE_RANGE
                - DATE_RANGE_TOO_LARGE
                - INVALID_VERSION_NAME
                - UNKNOWN_PARAMETERS
                - INVALID_CHANNEL
                - CHANNEL_NOT_SUPPORTED
                - MISSING_TENANT_ID
                - INVALID_TENANT_ID
                - FLOW_NOT_FOUND
                - VERSION_NOT_FOUND
                - UPSTREAM_ERROR
              example: "FLOW_NOT_FOUND"
            message:
              type: string
              description: A readable explanation of the failure.
              example: "No flow found for the given flow_id in this workspace."
            target:
              type: string
              nullable: true
              description: The request field the error relates to, such as `flow_id` or `channel`.
              example: "flow_id"
            details:
              type: array
              description: Any additional detail about the failure.
              items:
                type: object
                additionalProperties: true
            doc_url:
              type: string
              description: A link to the documentation for this error.
  responses:
    BadRequest:
      description: >
        The request failed validation — for example, a bad filter value, a malformed cursor, a
        non-integer `version_no`, an invalid date range, or a `flow_id` that is actually a version
        ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: VALIDATION_FAILED
              target: request
              message: One or more request parameters failed validation.
              details:
                - target: request
                  message: Check the request parameters and try again.
    Unauthorized:
      description: Authentication failed (missing or invalid credentials).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: UNAUTHORIZED
              message: Invalid or missing credentials.
              details: []
    Forbidden:
      description: You do not have the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-450
            error:
              code: FORBIDDEN
              target: permission
              message: You do not have the required permission for this operation.
              details:
                - target: permission
                  message: "Required permission: campaigns:view"
    ForbiddenStatusWrite:
      description: You do not have the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-450
            error:
              code: FORBIDDEN
              target: permission
              message: You do not have the required permission for this operation.
              details:
                - target: permission
                  message: "Required permission: campaigns:create_manage"
    NotFound:
      description: The flow (or the requested version) does not exist in this workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-100
            error:
              code: NOT_FOUND
              target: flow
              message: Flow not found.
              details:
                - target: flow_id
                  message: Flow not found.
    RateLimited:
      description: Per-app rate limit exceeded. Retry after the interval indicated in the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate-limit window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded for app key.
              details: []
    InternalServerError:
      description: Unhandled server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: INTERNAL_ERROR
              message: Internal server error.
              details: []


    AnalyticsBadRequest:
      description: |
        The request is not valid.

        | Code | Cause |
        | --- | --- |
        | `INVALID_FLOW_ID` | `flow_id` is not a 24-character hexadecimal ID. |
        | `UNKNOWN_PARAMETERS` | The request carries a query parameter outside the documented set. The message names the offending keys. |
        | `INVALID_DATE_RANGE` | `activity_after` is later than `activity_before`. MoEngage checks this only when you send both. |
        | `DATE_RANGE_TOO_LARGE` | You sent both dates and the window exceeds 90 days. |
        | `INVALID_VERSION_NAME` | `version_name` is not `Active Version`, `All Versions`, or `Version N`. |
        | `INVALID_CHANNEL` | The channel path segment is empty. Applies to Get Flow Channel Analytics only. |
        | `CHANNEL_NOT_SUPPORTED` | The channel is well formed but not supported. Applies to Get Flow Channel Analytics only. |
        | `INVALID_REQUEST` | Anything else that fails validation, such as an invalid `attribution_type`, `metric_type`, or `granularity` value, a malformed date, or a missing `attribution_type` or `metric_type`. |
      headers:
        X-MOE-Request-Id:
          $ref: '#/components/headers/XMoeRequestIdEchoed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowAnalyticsError'
          example:
            response_id: "resp_a1b2c3d4"
            error:
              code: "DATE_RANGE_TOO_LARGE"
              message: "The activity window cannot exceed 90 days."
              target: "activity_after"

    AnalyticsUnauthorized:
      description: >
        Authentication failed, or MoEngage could not resolve the workspace because the
        `X-MOE-Tenant-ID` header was missing or could not be resolved.
      headers:
        X-MOE-Request-Id:
          $ref: '#/components/headers/XMoeRequestIdEchoed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowAnalyticsError'
          example:
            response_id: "resp_a1b2c3d4"
            error:
              code: "MISSING_TENANT_ID"
              message: "The X-MOE-Tenant-ID header is required."
              target: "X-MOE-Tenant-ID"

    AnalyticsNotFound:
      description: >
        `FLOW_NOT_FOUND` means `flow_id` is well formed but does not resolve to a flow in this
        workspace. `VERSION_NOT_FOUND` means the `Version N` you asked for is outside the flow's
        version history.
      headers:
        X-MOE-Request-Id:
          $ref: '#/components/headers/XMoeRequestIdEchoed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowAnalyticsError'
          example:
            response_id: "resp_a1b2c3d4"
            error:
              code: "FLOW_NOT_FOUND"
              message: "No flow found for the given flow_id in this workspace."
              target: "flow_id"
