openapi: 3.0.0
info:
  title: Flows
  version: "5.0"
  description: |
    Use the Flows endpoints to list your flows, view the details of a single flow (including its
    versions and stages), and change a flow's status. These
    endpoints read and control existing flows; they do not create them.

    <Note>
      The Flows endpoints are in early access. MoEngage enhances these endpoints based on feedback during this period, but does not make breaking changes.
    </Note>

    The API exposes the following endpoints:

    - `POST /v5/flows/search` — paginated listing with filters (status, delivery type, tags,
      teams, name, creator, creation-date range).
    - `GET /v5/flows/{flow_id}` — single flow detail. Use the optional `version_no` query
      parameter to view a specific version; the default is the last published version, or
      the draft if none is published.
    - `GET /v5/flows/{flow_id}/versions/{version_id}` — the details of a flow as it was in a
      specific version, identified by its ID.
    - `PATCH /v5/flows/{flow_id}/status` — lifecycle transition (`pause`, `resume`, `stop`,
      `retire`) or the flow-level `archive` / `unarchive` toggle.

    **Conventions**

    - IDs are 24-character identifiers. `flow_id` identifies the flow; `version_id` identifies one
      of its versions.
    - Every successful response uses the format `{response_id, type, data}`. The `response_id`
      echoes the `request_id` you send; if you omit it, the server uses the first 12 characters
      of a system-generated UUID.
    - Dates and times are in ISO 8601 UTC format (`YYYY-MM-DDThh:mm:ssZ`).
    - The search endpoint returns results one page at a time. To fetch the next page, send the
      `next_cursor` from the previous response back as the `cursor` value.

    **Permissions**

    Flows reuse the `campaigns` permission for scope checks. Read endpoints require the
    `campaigns:view` permission; the status endpoint requires `campaigns:create_manage`.

    **Status Model**

    Public flow statuses: `DRAFT`, `ACTIVE`, `SCHEDULED`, `PAUSED`, `STOPPED`, `COMPLETED`,
    `RETIRED`, `UNDER_REVIEW`, `REJECTED`. `archived` is a separate boolean flag
    (it spans every version of the flow), not a status.

    **Rate Limits**: The rate limits are at the workspace level. A maximum of 10 requests per second,
    100 requests per minute, and 6,000 requests per hour are allowed per workspace for the search,
    get, and status endpoints.

     <Note>
       Breaching any limit rejects the request with a `429` response.
     </Note>

servers:
  - url: https://api-{dc}.moengage.com
    variables:
      dc:
        default: "01"
        description: >
          MoEngage data center identifier. Replace it with the number assigned to your account,
          such as 01 (US), 02 (EU), 03 (India), 04 (US), 05 (Singapore), or 06 (Indonesia).
          For example, https://api-01.moengage.com. Data center 101 is not supported.
        enum: ["01", "02", "03", "04", "05", "06"]

security:
  - basicAuth: []

paths:
  /v5/flows/search:
    post:
      operationId: searchFlows
      summary: Search Flows
      description: |
        This API returns a paginated list of the flows in your workspace, filtered by the criteria
        you send in the request body. Requires the `campaigns:view` permission.
      x-mint:
        content: |
          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 10 requests per second, 100 requests per minute, and 6,000 requests per hour are allowed per workspace.
      tags:
        - Flows
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/XMoeRequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowSearchRequest'
            examples:
              defaultPage:
                summary: First page, default filters
                value:
                  limit: 20
              byStatus:
                summary: Filter by status
                value:
                  status: [ACTIVE, PAUSED]
                  limit: 20
              byDeliveryType:
                summary: Filter by delivery type
                value:
                  delivery_type: [EVENT_TRIGGERED, PERIODIC]
                  limit: 20
              byName:
                summary: Name substring match
                value:
                  name: test
                  limit: 20
              byCreationDateRange:
                summary: Creation-date range
                value:
                  creation_start_time: "2025-01-01T00:00:00Z"
                  creation_end_time: "2026-12-31T23:59:59Z"
                  limit: 20
              nextPage:
                summary: Fetch the next page with a cursor
                value:
                  limit: 20
                  cursor: eyJpZCI6ICI2OWYxZGU4NGY5ZTQwMWEyZDdkOWE5MzEifQ==
      responses:
        '200':
          description: Flows matching the filters, most recently updated first. Sorting is not supported in this version.
          headers:
            X-MOE-Request-Id:
              $ref: '#/components/headers/XMoeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowSearchResponse'
              example:
                response_id: abc-701
                type: flow
                data:
                  flows:
                    - flow_id: 69f1de84f9e401a2d7d9a931
                      name: Welcome journey
                      status: ACTIVE
                      archived: false
                      delivery_type: EVENT_TRIGGERED
                      active_version_name: Version 2
                      tags: [onboarding]
                      created_at: "2026-01-05T10:00:00Z"
                      updated_at: "2026-02-01T09:30:00Z"
                      published_at: "2026-01-06T08:00:00Z"
                      created_by: agent@example.com
                  has_more: true
                  next_cursor: eyJpZCI6ICI2OWYxZGU4NGY5ZTQwMWEyZDdkOWE5MzEifQ==
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v5/flows/{flow_id}:
    get:
      operationId: getFlow
      summary: Get a Single Flow
      description: |
        This API returns the full details of one flow, including its settings, targeting, conversion
        goal, and stage-by-stage structure. Requires the `campaigns:view` permission.
      x-mint:
        content: |
          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 10 requests per second, 100 requests per minute, and 6,000 requests per hour are allowed per workspace.
      tags:
        - Flows
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - name: version_no
          in: query
          required: false
          description: >
            View a specific version of the flow by its version number (the trailing integer of
            the version name, for example `Version 3` becomes `3`). When omitted, the last
            published version is returned, or the draft if none is published. A non-integer value
            returns `400`; a number that does not exist for this flow returns `404`.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/XMoeRequestIdHeader'
      responses:
        '200':
          description: Flow found.
          headers:
            X-MOE-Request-Id:
              $ref: '#/components/headers/XMoeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetailResponse'
              example:
                response_id: abc-100
                type: flow
                data:
                  flow_id: 69f1de84f9e401a2d7d9a931
                  name: Welcome journey
                  status: ACTIVE
                  archived: false
                  delivery_type: EVENT_TRIGGERED
                  tags: [onboarding]
                  created_at: "2026-01-05T10:00:00Z"
                  updated_at: "2026-02-01T09:30:00Z"
                  published_at: "2026-01-06T08:00:00Z"
                  created_by: agent@example.com
                  published_by: agent@example.com
                  global_control_group_enabled: false
                  active_version_name: Version 2
                  versions:
                    - version_id: 69f1de84f9e401a2d7d9a931
                      version_name: Version 1
                      version_no: 1
                      status: RETIRED
                    - version_id: 7a02ef95f9e401a2d7d9aa42
                      version_name: Version 2
                      version_no: 2
                      status: ACTIVE
                  settings:
                    control_group:
                      enabled: false
                    frequency_capping:
                      ignore: false
                      ignore_and_count: false
                    bypass_dnd: false
                  attribution:
                    click_track_hours: 24
                    impression_track_hours: 24
                  conversion_goal_details:
                    primary_goal:
                      event: Purchase
                      goal_name: Made a purchase
                    secondary_goals: []
                    revenue_tracking: true
                    revenue_attribute: amount
                    revenue_currency: USD
                    exit_on_conversion: false
                  structure:
                    nodes:
                      - stage_id: n1
                        type: TRIGGER
                        sub_type: EVENT
                        parent_stage_id: null
                        child_stage_ids: [n2]
                        label: App Opened
                        config:
                          schedule:
                            delivery: one_time
                            start_time: "2026-01-06T08:00:00Z"
                            timezone: Asia/Kolkata
                          segmentation:
                            audience_type: all_users
                      - stage_id: n2
                        type: ACTION
                        sub_type: EMAIL
                        parent_stage_id: n1
                        child_stage_ids: []
                        label: Welcome email
                        config:
                          campaign_id: 69f1de84f9e401a2d7d9a999
                          channel: EMAIL
                          campaign_name: Welcome email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v5/flows/{flow_id}/versions/{version_id}:
    get:
      operationId: getFlowVersion
      summary: Get a Specific Version of a Flow
      description: |
        This API returns a flow exactly as it was in a past version, addressed by its version ID.
        Use it to audit what was live before a change. Requires the `campaigns:view` permission.
      x-mint:
        content: |
          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 10 requests per second, 100 requests per minute, and 6,000 requests per hour are allowed per workspace.
      tags:
        - Flows
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - name: version_id
          in: path
          required: true
          description: >
            The 24-character ID of a specific version of the flow. Must belong to `flow_id`.
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
        - $ref: '#/components/parameters/XMoeRequestIdHeader'
      responses:
        '200':
          description: Flow version found.
          headers:
            X-MOE-Request-Id:
              $ref: '#/components/headers/XMoeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetailResponse'
              example:
                response_id: abc-102
                type: flow
                data:
                  flow_id: 69f1de84f9e401a2d7d9a931
                  name: Welcome journey
                  status: RETIRED
                  archived: false
                  delivery_type: EVENT_TRIGGERED
                  tags: [onboarding]
                  created_at: "2026-01-05T10:00:00Z"
                  updated_at: "2026-01-20T09:30:00Z"
                  published_at: "2026-01-06T08:00:00Z"
                  created_by: agent@example.com
                  published_by: agent@example.com
                  global_control_group_enabled: false
                  active_version_name: Version 1
                  versions:
                    - version_id: 7a02ef95f9e401a2d7d9aa42
                      version_name: Version 1
                      version_no: 1
                      status: RETIRED
                  settings:
                    control_group:
                      enabled: false
                    frequency_capping:
                      ignore: false
                      ignore_and_count: false
                    bypass_dnd: false
                  attribution:
                    click_track_hours: 24
                    impression_track_hours: 24
                  conversion_goal_details:
                    primary_goal:
                      event: Purchase
                      goal_name: Made a purchase
                    secondary_goals: []
                    revenue_tracking: true
                    revenue_attribute: amount
                    revenue_currency: USD
                    exit_on_conversion: false
                  structure:
                    nodes:
                      - stage_id: n1
                        type: TRIGGER
                        sub_type: EVENT
                        parent_stage_id: null
                        child_stage_ids: [n2]
                        label: App Opened
                        config:
                          schedule:
                            delivery: one_time
                            start_time: "2026-01-06T08:00:00Z"
                            timezone: Asia/Kolkata
                          segmentation:
                            audience_type: all_users
                      - stage_id: n2
                        type: ACTION
                        sub_type: EMAIL
                        parent_stage_id: n1
                        child_stage_ids: []
                        label: Welcome email
                        config:
                          campaign_id: 69f1de84f9e401a2d7d9a999
                          channel: EMAIL
                          campaign_name: Welcome email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v5/flows/{flow_id}/status:
    patch:
      operationId: updateFlowStatus
      summary: Update Flow Status
      description: |
        This API changes a flow's lifecycle state. Requires the `campaigns:create_manage` permission.
      x-mint:
        content: |
          Lifecycle actions (`pause`, `resume`, `stop`, `retire`) accept an optional `version_no` and act on that
          version (default: the active version). `archive` / `unarchive` apply to the whole flow and reject a `version_no`.

          | Action | Allowed from | Result |
          | --- | --- | --- |
          | `pause` | `ACTIVE`, `SCHEDULED` | `PAUSED` |
          | `resume` | `PAUSED` | `ACTIVE` |
          | `stop` | `ACTIVE`, `SCHEDULED`, `PAUSED`, `RETIRED` | `STOPPED` |
          | `retire` | `ACTIVE`, `PAUSED` | `RETIRED` |
          | `archive` | `PAUSED`, `STOPPED`, `COMPLETED` (and not already archived) | sets `archived=true` |
          | `unarchive` | any archived flow | sets `archived=false` |

          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 10 requests per second, 100 requests per minute, and 6,000 requests per hour are allowed per workspace.
      tags:
        - Flows
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID v4. Reusing the same key replays the original response instead of re-applying the transition.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XMoeRequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowStatusRequest'
            examples:
              pause:
                summary: Pause an active flow
                value:
                  action: pause
                  updated_by: agent@example.com
              archive:
                summary: Archive a flow
                value:
                  action: archive
                  updated_by: agent@example.com
      responses:
        '200':
          description: Flow status updated.
          headers:
            X-MOE-Request-Id:
              $ref: '#/components/headers/XMoeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowStatusResponse'
              example:
                response_id: abc-200
                type: flow
                data:
                  flow_id: 69f1de84f9e401a2d7d9a931
                  status: PAUSED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenStatusWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The requested action is not a valid transition from the flow's current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                response_id: abc-409
                error:
                  code: BAD_REQUEST
                  target: action
                  message: "Cannot resume a flow that is not paused."
                  details: []
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v5/flows/{flow_id}/analytics:
    get:
      operationId: getFlowAnalytics
      summary: Get Flow Analytics
      description: |
        This API returns how a flow is performing: the user journeys started, completed, in progress,
        and dropped, along with exit and drop reasons, split stage results, and conversion goal
        performance. Requires the `campaigns:view` permission.
      x-mint:
        content: |
          The date filter is based on activity, not entry. A user journey is included when any activity
          happened within the window, such as moving through a stage, receiving a campaign, converting,
          or exiting.

          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 10,000 requests per minute is allowed, shared across all Flow Analytics endpoints rather than applied to each endpoint.
      tags:
        - Flow Analytics
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/XMoeTenantId'
        - $ref: '#/components/parameters/XMoeScopes'
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/ActivityAfter'
        - $ref: '#/components/parameters/ActivityBefore'
        - $ref: '#/components/parameters/VersionName'
        - $ref: '#/components/parameters/AttributionType'
        - $ref: '#/components/parameters/MetricType'
        - name: fields
          in: query
          required: false
          description: >
            Comma-separated list of top-level `data` fields to include. When omitted, all
            fields are returned.
          schema:
            type: string
            example: "summary,drop_stats"
            enum:
              - summary
              - drop_stats
              - split_stage_stats
              - business_trigger_stats
        - $ref: '#/components/parameters/XMoeRequestIdHeader'
      responses:
        '200':
          description: Flow analytics returned successfully.
          headers:
            X-MOE-Request-Id:
              $ref: '#/components/headers/XMoeRequestIdEchoed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAnalyticsResponse'
              example:
                response_id: "resp_a1b2c3d4"
                type: "flow_analytics"
                data:
                  flow_id: "69f1de84f9e401a2d7d9a931"
                  version_name: "Version 2"
                  summary:
                    - timestamp: 1706745600
                      trip_stats:
                        trips_started: 12400
                        trips_completed: 8900
                        trips_in_progress: 1200
                        trips_dropped: 2300
                      conversion_goal_stats:
                        goal_001:
                          is_primary_goal: true
                          view_through:
                            total: 1200
                            unique: 980
                            cvr: 0.079
                            revenue: 45000.0
                          click_through:
                            total: 890
                            unique: 720
                            cvr: 0.058
                            revenue: 32000.0
                  drop_stats:
                    - timestamp: 1706745600
                      exits:
                        conversions:
                          UD_ER_1:
                            count: 800
                            description: "Exit Condition 1"
                        exit_reasons:
                          UD_ER_2:
                            count: 410
                            description: "Exit Condition 2"
                      drops:
                        drop_reasons:
                          UD_DR_EX:
                            count: 120
                            description: "Exceptions"
                          UD_DR_FC_DND:
                            count: 380
                            description: "FC/DND"
                          UD_DR_IF:
                            count: 45
                            description: "Inactive flow"
                          UD_DR_WTE:
                            count: 90
                            description: "Wait till expired"
                  split_stage_stats:
                    ab_split_stages:
                      - stage_id: "sdmimd"
                        stage_name: "My Custom Split Name"
                        branches:
                          - branch_id: "br7f3a9c"
                            branch_name: "Control"
                            entered: 6200
                            converted: 980
                          - branch_id: "br2e8d1f"
                            branch_name: "Test"
                            entered: 6200
                            converted: 750
                    ipo_stages:
                      - stage_id: "ipoabc"
                        stage_name: "Intelligent Path Optimizer 1"
                        branches:
                          - branch_id: "ipo9c4a2"
                            branch_name: "Branch A"
                            entered: 4100
                            converted: 610
                  business_trigger_stats: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v5/flows/{flow_id}/analytics/channels/{channel}:
    get:
      operationId: getFlowChannelAnalytics
      summary: Get Flow Channel Analytics
      description: |
        This API returns the analytics for one channel in a flow: delivery and performance stats
        aggregated across that channel's campaigns, and a breakdown for each action node that uses
        the channel. Requires the `campaigns:view` permission.
      x-mint:
        content: |
          When `granularity` is `overall`, `aggregated_stats` holds a single entry with no `timestamp`,
          and each `campaign_stats[].performance` is a single object. For a time-based granularity such
          as `daily`, `aggregated_stats` holds one entry per period, each with a `timestamp`, and each
          `campaign_stats[].performance` is an array of per-period objects.

          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 10,000 requests per minute is allowed, shared across all Flow Analytics endpoints rather than applied to each endpoint.
      tags:
        - Flow Analytics
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/XMoeTenantId'
        - $ref: '#/components/parameters/XMoeScopes'
        - $ref: '#/components/parameters/Granularity'
        - name: channel
          in: path
          required: true
          description: |
            The channel to scope the analytics to. The value is case-insensitive, so `email`,
            `Email`, and `EMAIL` all work, and the response always echoes the channel back in
            lowercase. Use `ON_SITE` with the underscore for the on-site channel; `ONSITE`
            returns the error code `CHANNEL_NOT_SUPPORTED`.
          schema:
            $ref: '#/components/schemas/ChannelEnum'
        - $ref: '#/components/parameters/ActivityAfter'
        - $ref: '#/components/parameters/ActivityBefore'
        - $ref: '#/components/parameters/VersionName'
        - $ref: '#/components/parameters/AttributionType'
        - $ref: '#/components/parameters/MetricType'
        - name: fields
          in: query
          required: false
          description: >
            Comma-separated list of top-level `data` fields to include. When omitted, all
            fields are returned.
          schema:
            type: string
            example: "aggregated_stats,campaign_stats"
            enum:
              - aggregated_stats
              - campaign_stats
        - $ref: '#/components/parameters/XMoeRequestIdHeader'
      responses:
        '200':
          description: Channel analytics returned successfully.
          headers:
            X-MOE-Request-Id:
              $ref: '#/components/headers/XMoeRequestIdEchoed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowChannelAnalyticsResponse'
              example:
                response_id: "resp_b2c3d4e5"
                type: "flow_channel_analytics"
                data:
                  flow_id: "69f1de84f9e401a2d7d9a931"
                  channel: "EMAIL"
                  version_name: "Version 2"
                  aggregated_stats:
                    performance:
                      group_level_stats:
                        sent: 48200
                        delivered: 45900
                        opened: 12300
                        clicked: 3800
                        conversions: 980
                        cvr: 0.021
                      conversion_goal_stats: {}
                    delivery:
                      group_level_stats:
                        delivery_funnel:
                          unique_users_in_segment:
                            count: 48200
                            description: "Reachable users in segment"
                          valid_tokens:
                            count: 48200
                            description: "Users with Email"
                          success:
                            count: 45900
                            description: "Successfully Sent"
                        delivery_failure_breakdown: {}
                  campaign_stats:
                    - action_id: "a3f9c2e1"
                      campaign_id: 69f1de84f9e401a2d7d9a999
                      stage_name: "Welcome Email"
                      performance:
                        group_level_stats:
                          sent: 26000
                          delivered: 24800
                          opened: 7200
                          clicked: 2300
                          conversions: 620
                          cvr: 0.024
                        conversion_goal_stats: {}
                      delivery:
                        group_level_stats:
                          delivery_funnel:
                            unique_users_in_segment:
                              count: 26000
                              description: "Reachable users in segment"
                            valid_tokens:
                              count: 26000
                              description: "Users with Email"
                            success:
                              count: 24800
                              description: "Successfully Sent"
                          delivery_failure_breakdown: {}
                    - action_id: "b7d4e9f2"
                      campaign_id: 7a02ef95f9e401a2d7d9aa42
                      stage_name: "Day 3 Nudge"
                      performance:
                        group_level_stats:
                          sent: 22200
                          delivered: 21100
                          opened: 5100
                          clicked: 1500
                          conversions: 360
                          cvr: 0.017
                        conversion_goal_stats: {}
                      delivery:
                        group_level_stats:
                          delivery_funnel:
                            unique_users_in_segment:
                              count: 22200
                              description: "Reachable users in segment"
                            valid_tokens:
                              count: 22200
                              description: "Users with Email"
                            success:
                              count: 21100
                              description: "Successfully Sent"
                          delivery_failure_breakdown: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.

        - **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: On your MoEngage workspace, navigate to **Settings** → **Account** → **API keys** and click **Create new key**. Grant the key access to the APIs it needs, such as Data, Segmentation, Push, Email, Campaigns, or Templates, and set its permissions for each one. Flows reuse the Campaigns permissions, so select **View** for the read endpoints and **Create & Manage** for Update Flow Status.

        For more information on authentication and getting your credentials, refer to [Getting your credentials](/api/introduction#getting-your-credentials).

        Send the value in the `Authorization` header as `Basic` followed by Base64-encoding of `appkey:apisecret` (workspace ID and API key).

  headers:
    XMoeRequestId:
      description: Echoed request ID. If you do not provide one, the server generates it.
      schema:
        type: string

    XMoeRequestIdEchoed:
      description: Echoes the X-MOE-Request-Id that you supplied.
      schema:
        type: string

  parameters:
    FlowId:
      name: flow_id
      in: path
      required: true
      description: >
        The 24-character ID of the flow. This must be the flow's own ID, not a version ID;
        passing a version ID returns `400`.
      schema:
        type: string
        pattern: '^[a-f0-9]{24}$'
        example: "6a3b09c938da57c8f5838880"

    XMoeRequestIdHeader:
      name: X-MOE-Request-Id
      in: header
      required: false
      description: >
        Client-supplied trace ID. The server echoes it in the `X-MOE-Request-Id` response header
        and in `response_id`. If you omit it, the server generates one.
      schema:
        type: string


    VersionName:
      name: version_name
      in: query
      required: false
      description: Flow version to query. Defaults to the active version.
      schema:
        type: string
        enum:
          - "Version 1"
          - "Version 2"
          - "All Versions"
        example: "Version 2"

    XMoeTenantId:
      name: X-MOE-Tenant-ID
      in: header
      required: true
      description: >
        Identifies the workspace making the request. The analytics endpoints read this header
        directly and do not resolve the workspace from the Basic Auth credentials, so you must
        send it. Omitting it returns a `401` with the code `MISSING_TENANT_ID`, and a value that
        cannot be resolved returns a `401` with the code `INVALID_TENANT_ID`.
      schema:
        type: string

    XMoeScopes:
      name: X-MOE-SCOPES
      in: header
      required: true
      description: Comma-separated list of the scopes authorized for this request.
      schema:
        type: string
    Granularity:
      name: granularity
      in: query
      required: false
      description: |
        The time granularity of the response.

        - `overall` (default) returns a single entry covering the whole date range, and each
          entry omits `timestamp`.
        - `daily`, `weekly`, and `monthly` return one entry per period, and each entry includes
          a `timestamp` in Unix epoch seconds (UTC).

        The server also accepts `hourly`, `half_hourly`, and `bts_hourly`, but these are not
        recommended for this API and can return empty data.
      schema:
        type: string
        enum:
          - overall
          - daily
          - weekly
          - monthly
          - hourly
          - half_hourly
          - bts_hourly
        default: overall

    ActivityAfter:
      name: activity_after
      in: query
      required: false
      description: |
        The start of the activity window, as an ISO 8601 datetime in UTC. When you omit it,
        MoEngage uses the flow's creation date normalized to midnight UTC, or 90 days before
        `activity_before`, whichever is more recent. The window between `activity_after` and
        `activity_before` cannot exceed 90 days.
      schema:
        type: string
        format: date-time
        example: "2024-01-01T00:00:00Z"
    ActivityBefore:
      name: activity_before
      in: query
      required: false
      description: |
        The end of the activity window, as an ISO 8601 datetime in UTC. It must be the same as or
        later than `activity_after`. When you omit it, MoEngage uses the current time. When you
        send `activity_after`, MoEngage instead uses whichever is earlier: `activity_after` plus
        90 days, or the current time, so the window never exceeds 90 days.
      schema:
        type: string
        format: date-time
        example: "2024-03-31T23:59:59Z"
    AttributionType:
      name: attribution_type
      in: query
      required: true
      description: Attribution model to use for conversion metrics.
      schema:
        type: string
        enum:
          - VIEW_THROUGH
          - CLICK_THROUGH
          - IN_SESSION
          - TOTAL_CONVERSIONS
          - CLICK_CONVERSIONS
    MetricType:
      name: metric_type
      in: query
      required: true
      description: Whether to return total or unique counts.
      schema:
        type: string
        enum:
          - TOTAL
          - UNIQUE
  schemas:
    FlowStatusEnum:
      type: string
      description: >
        Public lifecycle status of a flow (or of a specific version), independent of the
        `archived` flag.
      enum:
        - DRAFT
        - ACTIVE
        - SCHEDULED
        - PAUSED
        - STOPPED
        - COMPLETED
        - RETIRED
        - UNDER_REVIEW
        - REJECTED

    DeliveryTypeEnum:
      type: string
      description: Indicates how users enter the flow.
      enum:
        - ONE_TIME
        - PERIODIC
        - ON_FLOW_EXIT
        - EVENT_TRIGGERED
        - BUSINESS_EVENT_TRIGGERED

    FlowSearchRequest:
      type: object
      description: >
        Filters for listing flows. All filters are optional and combine with AND. Enum filters
        (`status`, `delivery_type`) are case-insensitive.
      properties:
        request_id:
          type: string
          description: Optional if supplied via the `X-MOE-Request-Id` header; echoed in `response_id`.
        status:
          type: array
          description: Keeps only flows whose status is in this set.
          items:
            $ref: '#/components/schemas/FlowStatusEnum'
        delivery_type:
          type: array
          description: Keeps only flows that have one of these delivery types.
          items:
            $ref: '#/components/schemas/DeliveryTypeEnum'
        tags:
          type: array
          description: The tag names to match; flows that carry any of them are kept.
          items:
            type: string
        teams:
          type: array
          description: >
            Team names. Required when the Flows-teams feature is enabled for the workspace —
            omitting it or sending an empty list returns `400 VALIDATION_FAILED`
            ("teams is required when the team feature is enabled"). When the feature is off,
            sending `teams` is rejected with `400`.
          items:
            type: string
        name:
          type: string
          description: Matches flows whose name contains this text, case-insensitively.
        created_by:
          type: array
          description: The email addresses of the flow creators to filter by.
          items:
            type: string
            format: email
        creation_start_time:
          type: string
          description: The inclusive lower bound on the creation time, in ISO 8601 UTC format.
          example: "2025-01-01T00:00:00Z"
        creation_end_time:
          type: string
          description: The inclusive upper bound on the creation time, in ISO 8601 UTC format. It must be on or after `creation_start_time`.
          example: "2026-12-31T23:59:59Z"
        include_archived:
          type: boolean
          default: false
          description: '`false` (default) excludes archived flows; `true` returns both archived and non-archived.'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: The number of results returned per page.
        cursor:
          type: string
          description: The cursor from a previous page's `next_cursor`. Omit for the first page.

    FlowSummary:
      type: object
      description: One flow as it appears in a search or list result.
      properties:
        flow_id:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: The ID of the flow.
        name:
          type: string
          description: Display name of the flow.
        status:
          allOf:
            - $ref: '#/components/schemas/FlowStatusEnum'
          description: Lifecycle status of the flow's active version.
        archived:
          type: boolean
          default: false
          description: Whether the flow is archived (spans all versions). Independent of `status`.
        delivery_type:
          $ref: '#/components/schemas/DeliveryTypeEnum'
        active_version_name:
          type: string
          nullable: true
          description: Display name of the active version, such as `Version 3`.
        tags:
          type: array
          description: Tag names attached to the flow.
          items:
            type: string
        created_at:
          type: string
          nullable: true
          description: ISO 8601 UTC creation time.
        updated_at:
          type: string
          nullable: true
          description: ISO 8601 UTC last-update time of the active version.
        published_at:
          type: string
          nullable: true
          description: ISO 8601 UTC publish time of the active version; null if never published.
        created_by:
          type: string
          nullable: true
          description: Email of the flow's creator.

    FlowSearchResponse:
      type: object
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        type:
          type: string
          description: The type of resource the response describes.
          enum: [flow]
        data:
          type: object
          properties:
            flows:
              type: array
              items:
                $ref: '#/components/schemas/FlowSummary'
            has_more:
              type: boolean
              description: Whether another page exists after this one.
            next_cursor:
              type: string
              nullable: true
              description: Cursor to pass as `cursor` for the next page. Null on the last page.

    FlowVersion:
      type: object
      description: One version of a flow, as listed in a detail response's `versions`.
      properties:
        version_id:
          type: string
          pattern: '^[a-f0-9]{24}$'
        version_name:
          type: string
          description: Display name, such as `Version 2`.
        version_no:
          type: integer
          nullable: true
          description: The numeric version, parsed from the trailing integer of `version_name`.
        status:
          allOf:
            - $ref: '#/components/schemas/FlowStatusEnum'
          description: This version's own lifecycle status.

    FlowNode:
      type: object
      description: One stage of the flow, such as a trigger, an action, a wait, a condition, or a split.
      properties:
        stage_id:
          type: string
          description: Unique ID of this node within the flow.
        type:
          type: string
          description: The category of this node.
          enum: [TRIGGER, ACTION, CONTROL, CONDITION, SPLIT, BRANCH]
        sub_type:
          type: string
          description: >
            Public sub-type within `type`:
            `TRIGGER` — `EVENT`, `BUSINESS_EVENT`, `ONE_TIME`, or `PERIODIC`;
            `ACTION` — a channel (`EMAIL`, `SMS`, `PUSH`, `WHATSAPP`, `IN_APP`, `ONSITE`,
            `CONNECTOR`, `CARDS`, `FB_AUDIENCE`, `GOOGLE_ADS`, `CONNECTED_APPS`) or `NBA`;
            `CONTROL` — `EXIT`, `WAIT_FOR_TIMER`, or `GO_TO`;
            `SPLIT` — `AB_SPLIT`, `IPO`, or `CONDITIONAL_SPLIT`;
            `CONDITION` — `HAS_DONE_EVENT`, `ON_EMAIL_CLICK`, `ON_EMAIL_OPEN`, or `CHECK_USER_ATTRIBUTE`;
            `BRANCH` mirrors its parent split or condition.
        parent_stage_id:
          type: string
          nullable: true
          description: ID of the parent node, or null for the entry (`TRIGGER`) node.
        child_stage_ids:
          type: array
          description: IDs of the immediate downstream nodes.
          items:
            type: string
        label:
          type: string
          nullable: true
          description: Human-readable label shown in the flow builder.
        config:
          type: object
          additionalProperties: true
          description: >
            Type-specific configuration. The shape depends on `type` and `sub_type`; null-valued
            fields are omitted. The example below shows a `CONDITION` node's config. For the config
            shape of every node type (`CONDITION`, `BRANCH`, `SPLIT`, `ACTION`/`NBA`, and `CONTROL`),
            see [Flow structure and nodes](/api/flows/flows-overview#flow-structure-and-nodes).
          example:
            condition:
              filter_operator: and
              filters:
                - action_name: MOE_EMAIL_CLICK
                  executed: true
                  filter_type: actions
                  execution:
                    count: 1
                    type: atleast
                  attributes:
                    filter_operator: and
                    filters: []
            wait:
              duration: 5
              unit: mins
            evaluation_timing: SINCE_PREVIOUS_STAGE

    FlowDetailData:
      allOf:
        - $ref: '#/components/schemas/FlowSummary'
        - type: object
          description: >
            Full single-flow detail. Carries every `FlowSummary` field plus the version list,
            publish metadata, settings, attribution, conversion goal, and its stages.
          properties:
            active_version_name:
              type: string
              nullable: true
              description: Display name of the flow's active version.
            versions:
              type: array
              nullable: true
              description: All versions of the flow, sorted by `version_no`. Null for a single-version flow.
              items:
                $ref: '#/components/schemas/FlowVersion'
            published_by:
              type: string
              nullable: true
              description: Email of the user who published this version.
            approvers:
              type: array
              nullable: true
              description: Approver emails (CAF), when set.
              items:
                type: string
            global_control_group_enabled:
              type: boolean
              default: false
              description: Whether the global control group is enabled for this flow.
            settings:
              $ref: '#/components/schemas/FlowSettings'
            attribution:
              $ref: '#/components/schemas/FlowAttribution'
            conversion_goal_details:
              $ref: '#/components/schemas/ConversionGoalDetails'
            structure:
              type: object
              description: The stages of the flow.
              properties:
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/FlowNode'

    FlowSettings:
      type: object
      description: Flow-level settings. Null-valued fields may be omitted.
      properties:
        control_group:
          type: object
          properties:
            enabled:
              type: boolean
              nullable: true
              description: Whether a control group (holdout) is enabled for this flow.
            percentage:
              type: number
              nullable: true
              description: The percentage of users held out as a control group.
            stickiness:
              type: boolean
              nullable: true
              description: Keeps a user in the same control or treatment assignment across re-entry.
        frequency_capping:
          type: object
          properties:
            ignore:
              type: boolean
              nullable: true
              description: Ignores frequency capping for this flow.
            ignore_and_count:
              type: boolean
              nullable: true
              description: Ignores capping but still counts sends toward it.
        inactive_eviction_days:
          type: integer
          nullable: true
          description: The number of days of user inactivity after which a user is evicted from the flow.
        on_failure:
          type: string
          nullable: true
          description: Defines the behavior when a stage fails.
        bypass_dnd:
          type: boolean
          nullable: true
          description: Sends messages even during the workspace Do-Not-Disturb window.

    FlowAttribution:
      type: object
      nullable: true
      description: >
        Click and impression attribution windows for the flow, derived from its channel action
        nodes. Null when no channel action declares them.
      properties:
        click_track_hours:
          type: integer
          nullable: true
        impression_track_hours:
          type: integer
          nullable: true

    ConversionGoalDetails:
      type: object
      nullable: true
      description: Conversion-goal configuration from the entry node. Null when the flow has no conversion goal.
      properties:
        primary_goal:
          type: object
          properties:
            event:
              type: string
              nullable: true
              description: The name of the conversion-goal event.
            goal_name:
              type: string
              nullable: true
        secondary_goals:
          type: array
          items:
            type: object
            properties:
              event:
                type: string
                nullable: true
              goal_name:
                type: string
                nullable: true
        revenue_tracking:
          type: boolean
          description: Whether revenue is attributed for the primary goal.
        revenue_attribute:
          type: string
          nullable: true
          description: Event attribute carrying the revenue amount. Present only when `revenue_tracking` is true.
        revenue_currency:
          type: string
          nullable: true
          description: Currency of the revenue attribute. Present only when `revenue_tracking` is true.
        exit_on_conversion:
          type: boolean
          nullable: true
          description: Whether a user exits the flow once they convert.

    FlowDetailResponse:
      type: object
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        type:
          type: string
          description: The type of resource the response describes.
          enum: [flow]
        data:
          $ref: '#/components/schemas/FlowDetailData'

    FlowStatusRequest:
      type: object
      required: [action, updated_by]
      properties:
        action:
          type: string
          description: The lifecycle operation to apply. `publish` is not available in this phase.
          enum: [pause, resume, stop, retire, archive, unarchive]
        version_no:
          type: integer
          minimum: 1
          description: >
            Optional. For lifecycle actions (`pause`, `resume`, `stop`, `retire`), acts on this
            version (default: the active version). Rejected for `archive` / `unarchive`.
        updated_by:
          type: string
          format: email
          description: Email of the user performing the action. Recorded in the audit log.
        request_id:
          type: string
          description: Optional if supplied via the `X-MOE-Request-Id` header; echoed in `response_id`.

    FlowStatusResponse:
      type: object
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        type:
          type: string
          description: The type of resource the response describes.
          enum: [flow]
        data:
          type: object
          properties:
            flow_id:
              type: string
              description: The flow acted on.
            status:
              $ref: '#/components/schemas/FlowStatusEnum'

    ErrorResponse:
      type: object
      required: [error, response_id]
      properties:
        response_id:
          type: string
          description: Echo of the `X-MOE-Request-Id` that you supplied. When you omit it, MoEngage returns the first 12 characters of a system-generated UUID.
        error:
          type: object
          description: The details of the failure.
          required: [code, message]
          properties:
            code:
              type: string
              description: A machine-readable code that identifies the type of failure.
              enum:
                - VALIDATION_FAILED
                - BAD_REQUEST
                - NOT_FOUND
                - UNAUTHORIZED
                - FORBIDDEN
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: A human-readable explanation of the failure.
            target:
              type: string
              description: The component or field the error relates to.
            details:
              type: array
              description: One entry per failing check.
              items:
                type: object
                properties:
                  target:
                    type: string
                    description: The field that failed the check.
                  message:
                    type: string
                    description: An explanation of why the field failed the check.

    ChannelEnum:
      type: string
      description: Channel type.
      enum:
        - EMAIL
        - SMS
        - PUSH
        - WHATSAPP
        - IN_APP
        - ONSITE
        - CONNECTOR
        - CARDS
        - FB_AUDIENCE
        - GOOGLE_ADS
        - CONNECTED_APPS
    FlowAnalyticsResponse:
      type: object
      required: [response_id, type, data]
      properties:
        response_id:
          type: string
          description: Unique ID for this response.
          example: "resp_a1b2c3d4"
        type:
          type: string
          enum: [flow_analytics]
          description: Resource type discriminator. Always `flow_analytics`.
        data:
          $ref: '#/components/schemas/FlowAnalyticsData'
    FlowAnalyticsData:
      type: object
      description: |
        MoEngage omits a field entirely rather than returning it as null when there is no data for
        it, or when you did not ask for it through the `fields` parameter. MoEngage also drops any
        object that would otherwise be empty, at any depth, including when filtering by
        `attribution_type` or `metric_type` removes everything inside it. Dropping cascades, so a
        parent left with nothing is dropped too. Empty arrays are not affected and are returned
        as `[]`.
      required: [flow_id, version_name]
      properties:
        flow_id:
          type: string
          example: "69f1de84f9e401a2d7d9a931"
        version_name:
          type: string
          example: "Version 2"
        summary:
          type: array
          items:
            $ref: '#/components/schemas/SummaryEntry'
        drop_stats:
          type: array
          items:
            $ref: '#/components/schemas/DropStatsEntry'
        split_stage_stats:
          $ref: '#/components/schemas/SplitStageStats'
        business_trigger_stats:
          type: array
          description: Business trigger performance stats. Empty array when none exist.
          items:
            type: object
    SummaryEntry:
      type: object
      required: [timestamp, trip_stats]
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp (seconds).
          example: 1706745600
        trip_stats:
          $ref: '#/components/schemas/TripStats'
        conversion_goal_stats:
          type: object
          description: Keyed by goal ID.
          additionalProperties:
            $ref: '#/components/schemas/ConversionGoalStat'
    TripStats:
      type: object
      properties:
        trips_started:
          type: integer
          description: Number of user journeys that started within the requested activity window.
          example: 12400
        trips_completed:
          type: integer
          description: Number of user journeys that reached the end of the flow within the window.
          example: 8900
        trips_in_progress:
          type: integer
          description: Number of user journeys still active in the flow at the end of the window.
          example: 1200
        trips_dropped:
          type: integer
          description: Number of user journeys that exited or dropped before completing, within the window.
          example: 2300
    ConversionGoalStat:
      type: object
      properties:
        is_primary_goal:
          type: boolean
          example: true
        view_through:
          $ref: '#/components/schemas/ConversionMetrics'
        click_through:
          $ref: '#/components/schemas/ConversionMetrics'
    ConversionMetrics:
      type: object
      properties:
        total:
          type: integer
          description: Total number of conversions attributed under this model.
          example: 1200
        unique:
          type: integer
          description: Number of unique users who converted under this model.
          example: 980
        cvr:
          type: number
          format: float
          description: Conversion rate for this attribution model, as a decimal (0.079 = 7.9%).
          example: 0.079
        revenue:
          type: number
          format: float
          description: Attributed revenue in the flow's configured currency.
          example: 45000.0
    DropStatsEntry:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1706745600
        exits:
          type: object
          properties:
            conversions:
              type: object
              description: Keyed by exit reason ID.
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
            exit_reasons:
              type: object
              description: Keyed by exit reason ID.
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
        drops:
          type: object
          properties:
            drop_reasons:
              type: object
              description: >
                Keyed by drop reason code. Known codes: `UD_DR_EX` (Exceptions),
                `UD_DR_FC_DND` (FC/DND), `UD_DR_IF` (Inactive flow),
                `UD_DR_WTE` (Wait till expired).
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
    ReasonCount:
      type: object
      required: [count, description]
      properties:
        count:
          type: integer
          example: 120
        description:
          type: string
          example: "Exceptions"
    SplitStageStats:
      type: object
      properties:
        ab_split_stages:
          type: array
          description: Stats for A/B split stages.
          items:
            $ref: '#/components/schemas/SplitStage'
        ipo_stages:
          type: array
          description: Stats for Intelligent Path Optimizer stages.
          items:
            $ref: '#/components/schemas/SplitStage'
    SplitStage:
      type: object
      required: [stage_id, stage_name, branches]
      properties:
        stage_id:
          type: string
          description: ID of the split stage within the flow.
          example: "sdmimd"
        stage_name:
          type: string
          description: User-defined name for the stage.
          example: "My Custom Split Name"
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchStat'
    BranchStat:
      type: object
      required: [branch_id, branch_name]
      properties:
        branch_id:
          type: string
          description: ID of the branch within the split stage.
          example: "br7f3a9c"
        branch_name:
          type: string
          description: User-defined name; defaults to "Branch A", "Branch B", and so on.
          example: "Control"
        entered:
          type: integer
          description: Number of users who entered this branch within the requested window.
          example: 6200
        converted:
          type: integer
          description: Number of users in this branch who converted within the window.
          example: 980
    FlowChannelAnalyticsResponse:
      type: object
      required: [response_id, type, data]
      properties:
        response_id:
          type: string
          example: "resp_b2c3d4e5"
        type:
          type: string
          enum: [flow_channel_analytics]
          description: Resource type discriminator. Always `flow_channel_analytics`.
        data:
          $ref: '#/components/schemas/FlowChannelAnalyticsData'
    FlowChannelAnalyticsData:
      type: object
      description: |
        MoEngage omits a field entirely rather than returning it as null when there is no data for
        it, or when you did not ask for it through the `fields` parameter. MoEngage also drops any
        object that would otherwise be empty, at any depth, including when filtering by
        `attribution_type` or `metric_type` removes everything inside it. Dropping cascades, so a
        parent left with nothing is dropped too. Empty arrays are not affected and are returned
        as `[]`.
      required: [flow_id, channel, version_name]
      properties:
        flow_id:
          type: string
          example: "69f1de84f9e401a2d7d9a931"
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        version_name:
          type: string
          example: "Version 2"
        aggregated_stats:
          $ref: '#/components/schemas/AggregatedChannelStats'
        campaign_stats:
          type: array
          description: Per-action-node stats. Actions belonging to other channels are filtered out.
          items:
            $ref: '#/components/schemas/CampaignStat'
    AggregatedChannelStats:
      type: object
      description: >
        Aggregated stats spanning the entire requested date range. `timestamp` is omitted — this
        is not a time-series object.
      properties:
        performance:
          $ref: '#/components/schemas/ChannelPerformance'
        delivery:
          $ref: '#/components/schemas/ChannelDelivery'
    ChannelPerformance:
      type: object
      properties:
        group_level_stats:
          type: object
          properties:
            sent:
              type: integer
              example: 48200
            delivered:
              type: integer
              example: 45900
            opened:
              type: integer
              example: 12300
            clicked:
              type: integer
              example: 3800
            conversions:
              type: integer
              example: 980
            cvr:
              type: number
              format: float
              example: 0.021
        conversion_goal_stats:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConversionGoalStat'
    ChannelDelivery:
      type: object
      properties:
        group_level_stats:
          type: object
          properties:
            delivery_funnel:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
            delivery_failure_breakdown:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ReasonCount'
    CampaignStat:
      type: object
      required: [action_id, campaign_id, stage_name]
      properties:
        action_id:
          type: string
          description: Unique ID of the action node within the flow.
          example: "a3f9c2e1"
        campaign_id:
          type: string
          description: ID of the campaign for this action node.
          example: "camp_xyz001"
        stage_name:
          type: string
          description: User-defined name for this action stage.
          example: "Welcome Email"
        performance:
          $ref: '#/components/schemas/ChannelPerformance'
        delivery:
          $ref: '#/components/schemas/ChannelDelivery'
  responses:
    BadRequest:
      description: >
        The request failed validation — for example, a bad filter value, a malformed cursor, a
        non-integer `version_no`, an invalid date range, or a `flow_id` that is actually a version
        ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: VALIDATION_FAILED
              target: request
              message: One or more request parameters failed validation.
              details:
                - target: request
                  message: Check the request parameters and try again.
    Unauthorized:
      description: Authentication failed (missing or invalid credentials).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: UNAUTHORIZED
              message: Invalid or missing credentials.
              details: []
    Forbidden:
      description: You do not have the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-450
            error:
              code: FORBIDDEN
              target: permission
              message: You do not have the required permission for this operation.
              details:
                - target: permission
                  message: "Required permission: campaigns:view"
    ForbiddenStatusWrite:
      description: You do not have the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-450
            error:
              code: FORBIDDEN
              target: permission
              message: You do not have the required permission for this operation.
              details:
                - target: permission
                  message: "Required permission: campaigns:create_manage"
    NotFound:
      description: The flow (or the requested version) does not exist in this workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-100
            error:
              code: NOT_FOUND
              target: flow
              message: Flow not found.
              details:
                - target: flow_id
                  message: Flow not found.
    RateLimited:
      description: Per-app rate limit exceeded. Retry after the interval indicated in the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate-limit window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded for app key.
              details: []
    InternalServerError:
      description: Unhandled server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            response_id: abc-101
            error:
              code: INTERNAL_ERROR
              message: Internal server error.
              details: []
