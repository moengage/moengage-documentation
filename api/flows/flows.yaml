openapi: 3.0.0
info:
  title: Flows API
  version: 1.0.0
  description: |
    Use the Flows API to create, update, and manage flows in a MoEngage workspace.

    This specification is a scaffold. Endpoint paths and schemas will be added from the
    source OpenAPI specification.
servers:
  - url: https://api-{dc}.moengage.com
    variables:
      dc:
        default: "01"
        description: >
          MoEngage data center identifier. Replace it with the number assigned to your account,
          such as 01 (US), 02 (EU), 03 (India), 05 (Singapore), or 06 (Indonesia). For example,
          https://api-01.moengage.com.
        enum: ["01", "02", "03", "05", "06"]

paths: {}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your
        credentials in the format 'username:password'.

        - **Username**: Use your MoEngage Workspace ID (also known as the App ID).
        - **Password**: Use your API Key.
