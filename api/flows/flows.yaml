                            delivery_funnel:
                              reachable_users_in_segment: { count: 48200, description: "Reachable users in segment" }
                              successfully_sent: { count: 45900, description: "Successfully Sent" }
                  campaign_stats:
                    - action_id: "action_id_1"
                      campaign_id: "camp_xyz001"
                      stage_name: "Welcome Email"
                      performance:
                        total_stats:
                          platform_level_stats:
                            ALL_PLATFORMS:
                              locale_level_stats:
                                all_locale:
                                  variation_level_stats:
                                    all_variations:
                                      event_stats:
                                        sent:
                                          non_personalized: { total: 24100, unique: 24100 }
                                          aggregated: { total: 24100, unique: 24100 }
                                        opened:
                                          non_personalized: { total: 6150, unique: 6150 }
                                          aggregated: { total: 6150, unique: 6150 }
                                      conversion_goal_stats:
                                        goal_001:
                                          metric_stats:
                                            total_conversion:
                                              aggregated: { total: 490, unique: 480 }
                                          goal_name: "Signup"
                                          event_name: "goal_001"
                      delivery:
                        total_stats:
                          platform_level_stats:
                            ALL_PLATFORMS:
                              locale_level_stats:
                                all_locale:
                                  variation_level_stats:
                                    all_variations:
