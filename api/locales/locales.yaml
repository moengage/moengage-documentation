openapi: 3.0.3
info:
  title: MoEngage Locales API
  version: '5.0'
  description: >
    A locale is a named audience definition — built from user-property filters — that you use to localize campaign messages for a language, culture, or region. For example, a locale named `es-MX` might target users whose last known country is Mexico.


    Use this endpoint to list the locales configured in your workspace and look up a single locale by name or ID. To create or edit a locale, use the MoEngage dashboard. For more information, see [Locales](/user-guide/settings/advanced-settings/locales).
tags:
  - name: Locales
    description: List and look up workspace locales for multilingual campaigns.
servers:
  - url: 'https://api-{dc}.moengage.com'
    description: MoEngage Locales API Server
    variables:
      dc:
        default: '01'
        description: 'The ''dc'' in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ''dc'' in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101.'
security:
  - basicAuth: []

paths:
  /v5/locales:
    get:
      tags:
        - Locales
      summary: List Locales
      description: |
        Returns all locales in the workspace, or a single locale when you supply `name` or `id`. Use either `name` or `id`, not both. Omit both parameters to list every locale in the workspace (paginated).
      x-mint:
        content: |
          #### Rate Limits

          The rate limits are at the workspace level. A maximum of 60 requests per minute and 1,000 requests per hour are allowed per workspace.
      operationId: listLocales
      security:
        - basicAuth: []
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Exact locale name. Use either `name` or `id`, not both.
          example: es-MX
        - name: id
          in: query
          schema:
            type: string
          description: Locale ID. Use either `name` or `id`, not both.
          example: <mongo-object-id>
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Locale list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleListResponse'
              example:
                response_id: <trace-id>
                type: locales
                data:
                  - id: <mongo-object-id>
                    name: es-MX
                    custom_segment_id: seg_<object-id>
                    campaign_count: 12
                    created_at: '2026-05-01T09:12:00Z'
                    updated_at: '2026-07-10T11:45:30Z'
                pagination:
                  has_more: true
                  next_cursor: <opaque-cursor>
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.

        - **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: On your MoEngage workspace, navigate to **Settings** > **Account** > **API keys** and click **Create new key**.

        For more information on authentication and getting your credentials, refer to [Getting your credentials](/api/introduction#getting-your-credentials).

        Send the value in the `Authorization` header as `Basic` followed by Base64-encoding of `appkey:apisecret` (workspace ID and API key).

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 20
      description: Page size. Max 20 per page.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.

  schemas:
    Locale:
      type: object
      description: A locale configured in the workspace.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Locale ID.
          example: <mongo-object-id>
        name:
          type: string
          description: Locale name (unique per workspace).
          example: es-MX
        custom_segment_id:
          type: string
          description: Custom segment backing this locale, if any.
          example: seg_<object-id>
        campaign_count:
          type: integer
          description: Number of campaigns using this locale.
          example: 12
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of when the locale was created.
          example: '2026-05-01T09:12:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of when the locale was last updated.
          example: '2026-07-10T11:45:30Z'

    LocaleListResponse:
      type: object
      required:
        - response_id
        - type
        - data
        - pagination
      properties:
        response_id:
          type: string
          description: Unique identifier for this response. Echoes the `request_id` you sent, if any. Quote it when contacting MoEngage Support.
          example: <trace-id>
        type:
          type: string
          description: The resource type contained in `data`. Always `locales` for this endpoint.
          enum:
            - locales
        data:
          type: array
          description: The locales matching your filters, up to `limit` per page.
          items:
            $ref: '#/components/schemas/Locale'
        pagination:
          description: Cursor pagination state for this page of results.
          allOf:
            - $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required:
        - has_more
      properties:
        has_more:
          type: boolean
          description: Whether more pages exist. When `true`, pass `next_cursor` back as `cursor` on the next request.
          example: true
        next_cursor:
          type: string
          description: Present only when `has_more` is `true`.
          example: <opaque-cursor>

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable UPPER_SNAKE_CASE code.
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  target:
                    type: string
                  message:
                    type: string
        response_id:
          type: string

  responses:
    BadRequest:
      description: Bad request / validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: <trace-id>
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: <trace-id>
    Forbidden:
      description: Missing required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: <trace-id>
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: <ERROR_CODE>
              message: <error-message>
              target: <field>
              details:
                - code: <ERROR_CODE>
                  target: <field>
                  message: <error-message>
            response_id: <trace-id>
