openapi: 3.0.0

info:
  title: Offer Decisioning Public API - v5
  version: 5.0.0
  description: |
    `/v5/*` routes serve Public (S2S) and MCP agent consumers only.

    ## Consumer Types


    | Consumer | Gateway | Auth |
    |---|---|---|
    | **Public (S2S)** | APISIX | Basic Auth (`Authorization: Basic base64(appId:apiKey)`) |
    | **MCP agents** | SGK | OIDC JWT via MCP Server |

    The gateway (APISIX or SGK) validates credentials and injects trusted headers before
    the request reaches this service. The service reads `X-MOE-Consumer-Type`,
    `X-MOE-Tenant-ID`, and `X-MOE-Scopes` — it never re-validates credentials.

    ## Scope Enforcement

    Endpoint-level scope enforcement is performed by the gateway (§4.4 API Guidelines).
    A request that reaches this service has already passed the scope check for the
    route + method. `X-MOE-Scopes` is available for data-level authorization only
    (field filtering, row scoping).

    ## Idempotency

    POST and PATCH operations require an `Idempotency-Key` header (UUID v4 format).
    The key is validated for presence and format before the handler runs. Submitting
    the same key within 24 hours returns the original response without re-executing
    the operation. See §7.2 API Guidelines.

    ## Tracing

    Every response includes a `response_id` field. This value is `resp_` prefixed to
    the `X-MOE-Request-Id` trace ID supplied by the gateway (or auto-generated if not
    supplied). Use `response_id` / `X-MOE-Request-Id` to correlate requests across
    logs, client-side retries, and support tickets.

    ## Rate Limits

    | Endpoint | Method | Public (APISIX) | MCP (SGK) |
    |---|---|---|---|
    | `/v5/offers` | GET | 150/min, 500/hour, 1000/day | 150/min, 500/hour, 1000/day |
    | `/v5/offers/templates` | GET | 150/min, 500/hour, 1000/day | 150/min, 500/hour, 1000/day |
    | `/v5/offers` | POST | 100/min, 300/hour, 600/day | 100/min, 300/hour, 600/day |
    | `/v5/offers/{offer_id}` | PATCH | 100/min, 300/hour, 600/day | 100/min, 300/hour, 600/day |

    Limits are keyed by `tenant_id + client_id` for Public and `tenant_id + agent_id` for MCP.
    Rate limit headers (`X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`)
    are injected by the gateway (APISIX or SGK) — not by this service — on every response.

    ## MCP Agent Notes

    **Authentication**: MCP agents must use `bearerAuth` (JWT via SGK), not `basicAuth`.
    `basicAuth` is for S2S public consumers only. The MCP server handles token injection
    automatically — do not manually set the `Authorization` header.

    **Tenant context**: `X-MOE-Tenant-ID` is injected by SGK from the authenticated session.
    Do NOT include this header explicitly — the gateway always provides it.

    **Tag discovery**: Tags must pre-exist before you attach them to an offering. Create and
    manage tags in the MoEngage dashboard — unknown tag IDs return 400 INVALID_TAG_ID.

    **Template discovery**: Before creating `template`-type content, list templates from
    `GET /v1/offers/templates` (v1 internal endpoint) to get valid `templateId` values.

    ## Security Headers

    Every response from `/v5/*` endpoints includes the following headers set by the
    service's `SecurityHeadersFilter`:

    | Header | Value |
    |---|---|
    | `Cache-Control` | `no-store` |
    | `Content-Security-Policy` | `frame-ancestors 'none'` |
    | `Strict-Transport-Security` | `max-age=31536000; includeSubDomains` |
    | `X-Content-Type-Options` | `nosniff` |
    | `X-Frame-Options` | `DENY` |
    | `Referrer-Policy` | `no-referrer` |
    | `X-MOE-Request-Id` | Echoed trace ID from the gateway header |


servers:
  - url: https://api-{dc}.moengage.com
    variables:
      dc:
        default: "01"
        description: >
          MoEngage data center identifier. Replace with your assigned DC number.
          Example values: 01 (US), 02 (EU), 03 (India), 04 (US), 05 (Singapore), 06 (Indonesia).
          Full example: https://api-01.moengage.com

paths:
  /v5/offers:
    get:
      operationId: listPublicOfferings
      summary: List Offerings
      description: |
        Fetch all offer campaigns in the workspace. Use this to discover existing offerings and
        their IDs before calling update_offering. Returns a summary of each offering — ID, name,
        status, tags, and creation metadata.

        To find a specific offering by name, use the name_contains filter. To get only live
        offerings currently being served to users, use status_in=active. The returned id field
        (e.g. offer_example) can be passed directly as the {offer_id} path parameter in
        PATCH /v5/offers/{offer_id} to update that offering.

        Typical agent flow: call list_offerings first to discover offer IDs, then call
        update_offering with a specific ID to modify it.
      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          List all offer campaigns in the workspace. Use this as the first step to discover
          existing offerings and their IDs before calling update_offering or inspecting details.

          Returns a paginated summary — ID, name, status, tags, created_at, created_by.
          Use the fields parameter to request only the fields you need (reduces token usage).

          Typical agent flow:
            1. Call list_offerings (optionally filter by status_in=active or name_contains)
            2. Pick the offering ID (e.g. offer_example) from the results
            3. Call update_offering with that ID to modify the offering

          Pagination: pass next_cursor from the pagination object on the next call.
          Keep paginating until has_more is false.
        param_overrides:
          status_in:
            description: |
              Filter by lifecycle status. Use 'active' to find offerings currently being
              served to users. Use 'scheduled' for upcoming ones. Omit to return all statuses
              including drafts. Valid values: active, scheduled, expired, archived, draft.
              Example: status_in=active,scheduled
          cursor:
            description: |
              Opaque pagination token from the previous response's next_cursor field.
              Omit on the first call. Pass verbatim — do not decode or modify.
          fields:
            description: |
              Comma-separated list of fields to return. Omit for all six fields.
              Use to minimise token usage. Valid values: id, name, status, tags, created_at, created_by.
              Example: fields=id,name,status
          limit:
            description: |
              Number of offerings per page. Default 20, maximum 100.
      tags:
        - Public Offerings
      security:
        - basicAuth: []      # Public consumers via APISIX
        - bearerAuth: []     # Dashboard and MCP consumers via SGK
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: >
            Look up a single offering by its exact prefixed ID (e.g. offer_example).
            Use this when you already know the offering ID and want to confirm it exists
            before updating it.
        - name: name_contains
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: >
            Find offerings whose name contains this text (case-insensitive). Use this when
            you know part of the offering name but not the exact ID. For example, pass
            "summer" to find all summer-related offerings. Max 100 characters.
        - name: status_in
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter by lifecycle status. Use active to find offerings currently being served
            to users. Use scheduled to find offerings that haven't started yet. Omit to
            return offerings in all statuses. Multiple values are OR semantics — any
            matching status is included.
            Valid values: active, scheduled, expired, archived, draft.
            Example: status_in=active,scheduled
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >
            Filter to offerings that have ALL of the specified tag IDs (AND semantics).
            Use this to find offerings belonging to a specific campaign category or audience
            segment. Repeat the parameter for multiple tags: tags=summer-sale&tags=vip-users.
        - name: created_date_gte
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Include only offerings created on or after this date. Format: YYYY-MM-DD.
            Use with created_date_lte to narrow to a specific date range.
        - name: created_date_lte
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Include only offerings created on or before this date. Format: YYYY-MM-DD.
            Use with created_date_gte to narrow to a specific date range.
        - name: created_by
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >
            Filter to offerings created by specific team members. Pass one or more email
            addresses. Useful when you need to find offerings owned by a particular person
            or team.
        - name: fields
          in: query
          required: false
          schema:
            type: string
          description: >
            Request only the fields you need to reduce response size. Especially useful
            for agents to minimise token usage. Omit to receive all six fields.
            Valid values: id, name, status, tags, created_at, created_by.
            Example: fields=id,name,status returns only those three fields per item.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination cursor returned as next_cursor in the previous response.
            Omit on the first request. Pass the value verbatim — do not decode or modify it.
            When next_cursor is null in the response, you have reached the last page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page. Default 20, max 100.
        - name: X-MOE-Request-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the X-MOE-Request-Id response
            header and in server logs. Use this to correlate client-side requests with
            server-side log entries. If omitted, the server generates a trace ID automatically.
      responses:
        '200':
          description: Paginated list of offerings.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Trace ID echoed from the gateway.
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 150
              description: "Maximum requests allowed in the current window. Limits per consumer (Public and MCP): 150/min, 500/hour, 1000/day."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                type: object
                required: [response_id, type, data, pagination]
                properties:
                  response_id:
                    type: string
                    description: >
                      Stable trace identifier for this response. Format: "resp_" + X-MOE-Request-Id.
                      Identical on retries that carry the same X-MOE-Request-Id header, enabling
                      client-side deduplication and cross-log correlation.
                  type:
                    type: string
                    enum: [offer]
                  data:
                    type: array
                    description: List of offering summaries matching the applied filters.
                    items:
                      $ref: '#/components/schemas/OfferingListItem'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
              example:
                response_id: resp_<trace-id>
                type: offer
                data:
                  - id: offer_example
                    name: Summer_Sale_Promo_2026
                    status: active
                    tags: [tag_<object-id>]
                    created_at: "2026-06-25T10:29:51Z"
                    created_by: marketing-team@example.com
                  - id: offer_example
                    name: Homepage_Banner_AB_Test
                    status: scheduled
                    created_at: "2026-06-24T09:00:00Z"
                    created_by: growth-team@example.com
                pagination:
                  next_cursor: <base64-encoded-cursor>
                  limit: 20
                  has_more: true
                  total_count: 42
        '400':
          description: |
            Invalid query parameter. Possible error codes in `error.details[].code`:
            - `OUT_OF_RANGE` — `limit` > 100, or `name_contains` > 100 chars.
            - `INVALID_CURSOR` — `cursor` is present but malformed (not valid base64, or corrupted segment/id).
            - `INVALID_ENUM_VALUE` — unrecognised value in `status_in`.
            - `INVALID_FIELDS_PARAM` — unrecognised field name in `fields`.
            - `INVALID_TYPE` — `created_date_gte` or `created_date_lte` not in YYYY-MM-DD format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: One or more query parameters are invalid.
                  doc_url: "https://docs.moengage.com/errors/VALIDATION_FAILED"
                  details:
                    - code: INVALID_ENUM_VALUE
                      target: status_in
                      message: "'invalid_status' is not a valid status. Allowed values: active, scheduled, expired, archived, draft."
                      doc_url: "https://docs.moengage.com/errors/INVALID_ENUM_VALUE"
                response_id: resp_<trace-id>
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          $ref: '#/components/responses/GatewayAuthError'
        '429':
          description: |
            Rate limit exceeded. Limits per consumer (Public and MCP): 150 requests/min,
            500 requests/hour, 1000 requests/day. Wait for the number of seconds in
            Retry-After before retrying.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      operationId: createPublicOffering
      summary: Create Offering
      description: |
        Create a new offer campaign in the workspace. Returns the server-assigned offering ID
        (e.g. offer_example) which you can later pass to update_offering.

        The offering starts in "scheduled" status if start_datetime is in the future.
        variation_meta can be updated via PATCH after creation with status-based rules:
        SCHEDULED = fully editable; ACTIVE + SMV = only split percentages editable;
        ACTIVE + DMV = only control_group.percentage editable.

        To create a simple single-variant offering, set variation_meta.type to SMV with
        a single variant at 100% and put the content in offer_content.locales["0"].variations.
      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          Create a new offer campaign in the workspace. Returns the server-assigned offering ID
          (e.g. offer_example) which can be passed to update_offering.

          Key constraints:
            - start_datetime MUST be in the future and use UTC "Z" suffix (e.g. "2026-07-01T00:00:00Z").
              A past value returns 400 INVALID_SCHEDULING. Offset strings like "+05:30" are not accepted.
            - tags must be pre-existing tag IDs — unknown IDs return 400 INVALID_TAG_ID.
            - variation_meta CAN be updated via PATCH with status-based rules. See update_offering.
            - DEFAULT CAPPING: if capping_rules is omitted, the server defaults to 1 delivery/day/user.
            - name must be alphanumeric + underscores only (no spaces or hyphens). 5–100 chars.

          Always supply a unique Idempotency-Key (UUID v4) header to prevent duplicate offerings
          on retries. The same key within 24 hours returns the original 201 response.

          For a simple single-variant offering with no A/B test:
            - Set variation_meta.type = SMV, variantsPerLocale = [Variant_A], split = {Variant_A: 100}
            - Put content in offer_content.locales["0"].variations.Variant_A
            - Locale key must be "0" for single-locale offerings (not "default" or "en")
        param_overrides:
          variation_meta:
            description: |
              A/B test configuration. For a simple offering (no A/B test), use:
                type: SMV, variantsPerLocale: [Variant_A], split: {Variant_A: 100}
              For A/B test (SMV): split values must sum to exactly 100 (INVALID_SPLIT if not).
              For AI optimization (DMV): provide equal initial splits; the server learns over time.
              Status-based PATCH rules: SCHEDULED=free; ACTIVE+SMV=split% only; ACTIVE+DMV=control_group.percentage only.
          offer_content:
            description: |
              Content payload. Use the locales["0"] nested format for single-locale offerings:
                {"locales": {"0": {"variations": {"Variant_A": {"content_1": {"type": "json", "value": "..."}}}}}}
              The locale key "0" is required for single-locale — do not use "default" or "en".
              Variation keys in offer_content must exactly match variantsPerLocale and split keys (SPLIT_KEY_MISMATCH if not).
          scheduling:
            description: |
              Schedule window. Both start_datetime and expiry_datetime are required and MUST use
              UTC "Z" suffix (e.g. "2026-07-01T00:00:00Z"). Offset strings like "+05:30" return INVALID_TYPE.
              start_datetime must be in the future — past values return INVALID_SCHEDULING.
          segment_info:
            description: |
              Audience targeting. To target all users with no restrictions, send: {"filters": {}}
              For attribute-based targeting, use filter_type: "user_attributes" with data_type required.
      tags:
        - Public Offerings
      security:
        - basicAuth: []      # Public consumers via APISIX
        - bearerAuth: []     # MCP agents via SGK
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: >
            UUID v4 idempotency token. Submitting the same key within 24 hours returns the
            original 201 response without re-executing the create. A different body hash on
            the same key returns 409 IDEMPOTENCY_CONFLICT. A concurrent in-progress request
            with the same key returns 409 DUPLICATE_IDEMPOTENCY_KEY.
        - name: X-MOE-Request-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the X-MOE-Request-Id response
            header. Use this to correlate client requests with server-side logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientOfferCreateRequest'
            examples:
              jsonContentFlat:
                summary: Simple offering with JSON content (single variant, locale "0")
                value:
                  name: Summer_Sale_Promo_2026
                  description: 20% off for returning users who have not purchased in 30 days
                  priority: 10
                  delivery: scheduled
                  created_by: marketing-team@example.com
                  tags: [summer-sale, returning-users]
                  scheduling:
                    start_datetime: "2026-07-01T00:00:00Z"
                    expiry_datetime: "2026-09-30T23:59:59Z"
                    timezone: Asia/Kolkata
                  segment_info:
                    filters: {}
                  variation_meta:
                    type: SMV
                    variantsPerLocale: [Variant_A]
                    smv_distribution:
                      split:
                        Variant_A: 100
                    control_group:
                      is_enabled: false
                      percentage: 0
                  offer_content:
                    locales:
                      "0":
                        variations:
                          Variant_A:
                            content_1:
                              type: json
                              value: '{"headline":"Save 20% today","cta_text":"Claim offer","cta_url":"https://example.com/offer/summer"}'
              abTestSmv:
                summary: Offering with SMV A/B test (2 variants)
                value:
                  name: Homepage_Banner_AB_Test
                  priority: 5
                  delivery: scheduled
                  created_by: growth-team@example.com
                  scheduling:
                    start_datetime: "2026-07-01T00:00:00Z"
                    expiry_datetime: "2026-07-31T23:59:59Z"
                  segment_info:
                    filters: {}
                  variation_meta:
                    type: SMV
                    variantsPerLocale: [Variant_A, Variant_B]
                    smv_distribution:
                      split:
                        Variant_A: 70
                        Variant_B: 30
                    control_group:
                      is_enabled: false
                      percentage: 0
                  offer_content:
                    locales:
                      "0":
                        variations:
                          Variant_A:
                            content_1:
                              type: json
                              value: '{"headline":"Big Summer Sale","cta_text":"Shop Now"}'
                          Variant_B:
                            content_1:
                              type: json
                              value: '{"headline":"Limited Time Offer","cta_text":"Grab Deal"}'
      responses:
        '201':
          description: Offering created successfully.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Echoed trace ID (from request header or server-generated).
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 100
              description: "Maximum requests allowed in the current window. Thresholds: 100/min, 300/hour, 600/day."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOfferCreateResponse'
        '400':
          description: |
            Validation errors. All errors are collected before returning, so a single 400
            response may contain multiple `details` entries. Possible error codes:
            - `REQUIRED_FIELD_MISSING` — a required field is absent (e.g. missing `variation_meta`, `name`, `scheduling.start_datetime`). The `target` field identifies the missing field.
            - `INVALID_TYPE` — a field has the wrong type or format (e.g. `content_1.value` is not a JSON object when `type` is `template`; or `scheduling.start_datetime` is not a valid ISO 8601 datetime with UTC "Z" suffix).
            - `OUT_OF_RANGE` — numeric field outside its allowed range (e.g. `priority` outside 1–100, `control_group.percentage` outside 1–100).
            - `INVALID_ENUM_VALUE` — enum field has an unrecognised value. Note: `delivery` is case-insensitive (`trigger`, `TRIGGER`, etc. are all accepted).
            - `INVALID_OFFER_NAME` — `name` contains characters other than alphanumeric characters and underscores. Spaces and hyphens are not allowed.
            - `INVALID_SCHEDULING` — `expiry_datetime` is not after `start_datetime`; `start_datetime` is in the past; or `expiry_datetime` is less than 10 minutes in the future.
            - `INVALID_TIMEZONE` — `scheduling.timezone` is present but not a valid IANA timezone name (e.g. `Asia/Kolkata`, `America/New_York`, `UTC`).
            - `SPLIT_KEY_MISMATCH` — keys in `smv_distribution.split` do not match `variantsPerLocale`.
            - `INVALID_SPLIT` — values in `smv_distribution.split` do not sum to exactly 100. Adjust the percentages so the total equals 100.
            - `VARIANT_COUNT_MISMATCH` — count of variants in `offer_content` does not match `variantsPerLocale`.
            - `INVALID_TEMPLATE_ID` — `meta.templateId` refers to a template ID not registered in the workspace.
            - `MISSING_TEMPLATE_FIELD` — a required field (per the template's config) is missing or blank in the `value` map.
              The `target` field will be `offer_content.locales.<locale>.variations.<variant>.content_1.value.<fieldKey>`.
            - `DUPLICATE_OFFER_NAME` — `name` matches an existing non-archived offering in this workspace. Offering names must be unique. Choose a different name.
            - `INVALID_TAG_ID` — one or more tag IDs in `tags` do not exist in this workspace. Create the tags first via the dashboard before referencing them here.
            - `REVENUE_FIELDS_INCOMPLETE` — `conversion.primary.revenue_amount` or `conversion.primary.revenue_currency` is missing when `is_revenue_tracking` is true.
            - `INVALID_CURRENCY_CODE` — `conversion.primary.revenue_currency` is not a valid ISO 4217 code (e.g. use "USD", "EUR", "INR").
            - `MISSING_IDEMPOTENCY_KEY` — `Idempotency-Key` header is absent. Add the header with a UUID v4 value.
            - `INVALID_IDEMPOTENCY_KEY` — `Idempotency-Key` is present but not a valid UUID v4. Use a standard UUID v4 format (e.g. <uuid-v4>).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  doc_url: "https://docs.moengage.com/errors/VALIDATION_FAILED"
                  details:
                    - code: REQUIRED_FIELD_MISSING
                      target: variation_meta
                      message: variation_meta is required.
                      doc_url: "https://docs.moengage.com/errors/REQUIRED_FIELD_MISSING"
                    - code: INVALID_SCHEDULING
                      target: scheduling
                      message: expiry_datetime must be after start_datetime.
                      doc_url: "https://docs.moengage.com/errors/INVALID_SCHEDULING"
                    - code: INVALID_TEMPLATE_ID
                      target: offer_content.locales.0.variations.Variant_A.content_1.meta.templateId
                      message: "Template 'app_large' is not registered in this workspace."
                      doc_url: "https://docs.moengage.com/errors/INVALID_TEMPLATE_ID"
                    - code: MISSING_TEMPLATE_FIELD
                      target: offer_content.locales.0.variations.Variant_A.content_1.value.cta_url
                      message: "Field 'cta_url' is required by the template but is missing or blank."
                      doc_url: "https://docs.moengage.com/errors/MISSING_TEMPLATE_FIELD"
                response_id: resp_<trace-id>
        '401':
          description: |
            Authentication failure. Two sources produce 401 on this endpoint:
            - **Gateway (APISIX)** — credentials missing or invalid. Returns `Content-Type: text/plain`
              with body `{"code":"ER001","target":"Authentication Invalid","message":"..."}`.
            - **Service** — credentials passed the gateway but the injected `X-MOE-Tenant-ID` header
              is missing (request bypassed gateway). Returns `Content-Type: application/json`.
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) authentication failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/GatewayAuthError'
        '409':
          description: |
            Idempotency conflict. Two distinct error codes are possible:

            **DUPLICATE_IDEMPOTENCY_KEY** — a request with the same Idempotency-Key is already
            in-flight (concurrent duplicate). Wait for the first request to complete before retrying.

            **IDEMPOTENCY_CONFLICT** — the Idempotency-Key was already used within the 24-hour
            window but the request body hash differs from the original request. Use a new
            Idempotency-Key to submit a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Rate limit exceeded. Limits per consumer (public and MCP): 100 requests/min,
            300 requests/hour, 600 requests/day. Wait for the number of seconds in
            Retry-After before retrying.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v5/offers/{offer_id}:
    patch:
      operationId: updatePublicOffering
      summary: Update Offering
      description: |
        Modify an existing offering. Only the fields you include in the request body are
        changed — all other fields keep their current values. Use list_offerings first to
        find the offering ID if you don't already have it.

        Common update patterns:
        - Extend a live campaign: include only scheduling.expiry_datetime with a later date.
        - Rename an offering: include only name with the new value.
        - Replace content: include only offer_content with the updated payload.
        - Replace tags entirely: include tags as a full replacement list (not additive).

        variation_meta can be updated via PATCH with status-based rules:
        SCHEDULED = fully editable; ACTIVE + SMV = split percentages only;
        ACTIVE + DMV = control_group.percentage only. scheduling.start_datetime and
        conversion can only be changed while the offering is in scheduled status.
        PATCH on an expired or archived offering returns 403.

      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          Partially update an existing offering. Only the fields included in the request body
          are changed — all other fields retain their current values.

          Use list_offerings first to discover the offering ID if you don't already have it.

          Common update patterns:
            - Extend expiry: include only scheduling.expiry_datetime with a later date (Z suffix required)
            - Rename: include only name (alphanumeric + underscores only; returns DUPLICATE_OFFER_NAME if taken)
            - Update content: include only offer_content
            - Replace tags: include tags as a full list of tag IDs (full replacement, not additive).
              Tag IDs from list_offerings are returned with "tag_" prefix (e.g. "tag_<object-id>")
              and can be passed directly — both "tag_<id>" and raw "<id>" formats are accepted.

          Status-gated fields — return 400 IMMUTABLE_FIELD if violated:
            - scheduling.start_datetime: locked once status becomes 'active'
            - conversion: locked once status becomes 'active'
            - variation_meta.type: locked once status is 'active'
            - Adding/removing variants in variantsPerLocale: locked once 'active'
            - ACTIVE + SMV: only split percentages editable
            - ACTIVE + DMV: only control_group.percentage editable
            - SCHEDULED: all variation_meta fields freely editable

          Returns 403 EXPIRED_OFFERING or 403 ARCHIVED_OFFERING if offering is in terminal state.
          Returns 404 if the {offer_id} does not exist — verify with list_offerings first.

          Always supply a unique Idempotency-Key (UUID v4) header. Same key within 24 hours
          returns the original 200 response without re-applying the update.
        param_overrides:
          offer_id:
            description: |
              Prefixed offering ID to update (e.g. offer_example).
              Obtain this from list_offerings — it is the 'id' field in the data array.
      tags:
        - Public Offerings
      security:
        - basicAuth: []      # Public consumers via APISIX
        - bearerAuth: []     # Dashboard and MCP consumers via SGK
      parameters:
        - name: offer_id
          in: path
          required: true
          schema:
            type: string
          description: Prefixed offering ID (e.g. offer_example).
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: >
            UUID v4 idempotency token. Same semantics as POST: same key within 24 h returns
            the original 200 response; different body on same key returns 409 IDEMPOTENCY_CONFLICT;
            concurrent in-progress request returns 409 DUPLICATE_IDEMPOTENCY_KEY.
        - name: X-MOE-Request-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the X-MOE-Request-Id response
            header. Use this to correlate client requests with server-side logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientOfferPatchRequest'
            examples:
              extendExpiry:
                summary: Extend expiry date only
                value:
                  updated_by: marketing-team@example.com
                  scheduling:
                    expiry_datetime: "2026-12-31T23:59:59Z"
              updateNameAndTags:
                summary: Rename offering and replace tags
                value:
                  updated_by: marketing-team@example.com
                  name: Summer_Sale_Promo_2026_V2
                  tags: [summer-sale, vip-users]
              updateContent:
                summary: Update offer content (single variant, locale "0")
                value:
                  updated_by: marketing-team@example.com
                  offer_content:
                    locales:
                      "0":
                        variations:
                          Variant_A:
                            content_1:
                              type: json
                              value: '{"headline":"Flash Sale - 30% Off!","cta_text":"Claim Now","cta_url":"https://example.com/flash"}'
      responses:
        '200':
          description: Offering updated successfully.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Echoed trace ID.
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 100
              description: "Maximum requests allowed in the current window. Thresholds: 100/min, 300/hour, 600/day."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOfferPatchResponse'
        '400':
          description: |
            Validation errors. All errors collected before returning. Possible error codes:
            - `REQUIRED_FIELD_MISSING` — a required field is absent (`updated_by`). The `target` field identifies the missing field.
            - `INVALID_TYPE` — wrong type or format (e.g. `scheduling.start_datetime` is not a valid ISO 8601 datetime with UTC "Z" suffix).
            - `OUT_OF_RANGE` — numeric field outside its allowed range (e.g. `priority` outside 1–100, `control_group.percentage` outside 1–100).
            - `INVALID_ENUM_VALUE` — enum field has an unrecognised value (e.g. unrecognised `variation_meta.type`).
            - `INVALID_OFFER_NAME` — `name` contains characters other than alphanumeric characters and underscores.
            - `INVALID_SCHEDULING` — `expiry_datetime` is not after `start_datetime`; `start_datetime` is in the past; or `expiry_datetime` is less than 10 minutes in the future.
            - `INVALID_TIMEZONE` — `scheduling.timezone` is present but not a valid IANA timezone name.
            - `IMMUTABLE_FIELD` — attempt to change a status-locked field:
              • `scheduling.start_datetime` when offering is ACTIVE or EXPIRED.
              • `conversion` when offering is not in `scheduled` status.
              • `variation_meta.type` when offering is ACTIVE.
              • Adding or removing keys in `variation_meta.variantsPerLocale` when offering is ACTIVE — only split percentages (SMV) or `control_group.percentage` (DMV) can change on an ACTIVE offering.
            - `SPLIT_KEY_MISMATCH` — keys in `smv_distribution.split` do not match `variantsPerLocale`.
            - `INVALID_SPLIT` — values in `smv_distribution.split` do not sum to exactly 100.
            - `INVALID_TEMPLATE_ID` — `meta.templateId` refers to a template ID not registered in the workspace.
            - `MISSING_TEMPLATE_FIELD` — a required field (per the template's config) is missing or blank in the `value` map.
              The `target` field will be `offer_content.locales.<locale>.variations.<variant>.content_1.value.<fieldKey>`.
            - `DUPLICATE_OFFER_NAME` — `name` matches an existing non-archived offering in this workspace.
            - `INVALID_TAG_ID` — one or more tag IDs in `tags` do not exist in this workspace.
            - `REVENUE_FIELDS_INCOMPLETE` — `conversion.primary.revenue_amount` or `conversion.primary.revenue_currency` is missing when `is_revenue_tracking` is true.
            - `INVALID_CURRENCY_CODE` — `conversion.primary.revenue_currency` is not a valid ISO 4217 code.
            - `MISSING_IDEMPOTENCY_KEY` — `Idempotency-Key` header is absent.
            - `INVALID_IDEMPOTENCY_KEY` — `Idempotency-Key` is present but not a valid UUID v4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  doc_url: "https://docs.moengage.com/errors/VALIDATION_FAILED"
                  details:
                    - code: IMMUTABLE_FIELD
                      target: variation_meta.type
                      message: variation_meta.type cannot be changed on an active offering.
                      doc_url: "https://docs.moengage.com/errors/IMMUTABLE_FIELD"
                    - code: INVALID_TEMPLATE_ID
                      target: offer_content.locales.0.variations.Variant_A.content_1.meta.templateId
                      message: "Template 'app_large' is not registered in this workspace."
                      doc_url: "https://docs.moengage.com/errors/INVALID_TEMPLATE_ID"
                    - code: MISSING_TEMPLATE_FIELD
                      target: offer_content.locales.0.variations.Variant_A.content_1.value.cta_url
                      message: "Field 'cta_url' is required by the template but is missing or blank."
                      doc_url: "https://docs.moengage.com/errors/MISSING_TEMPLATE_FIELD"
                response_id: resp_<trace-id>
        '401':
          description: |
            Authentication failure. Two sources produce 401 on this endpoint:
            - **Gateway (APISIX)** — credentials missing or invalid. Returns `Content-Type: text/plain`
              with body `{"code":"ER001","target":"Authentication Invalid","message":"..."}`.
            - **Service** — credentials passed the gateway but the injected `X-MOE-Tenant-ID` header
              is missing (request bypassed gateway). Returns `Content-Type: application/json`.
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) authentication failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — offering is in a terminal lifecycle state. Returns `Content-Type: application/json`.
              Error codes: `EXPIRED_OFFERING` (past expiry_datetime) or `ARCHIVED_OFFERING` (manually archived).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Offering not found (OFFER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Idempotency conflict. Two distinct error codes are possible:

            **DUPLICATE_IDEMPOTENCY_KEY** — a request with the same Idempotency-Key is already
            in-flight (concurrent duplicate). Wait for the first request to complete before retrying.

            **IDEMPOTENCY_CONFLICT** — the Idempotency-Key was already used within the 24-hour
            window but the request body hash differs from the original request. Use a new
            Idempotency-Key to submit a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateInFlight:
                  summary: Concurrent duplicate (in-flight)
                  value:
                    error:
                      code: DUPLICATE_IDEMPOTENCY_KEY
                      message: A request with this Idempotency-Key is already being processed.
                      doc_url: "https://docs.moengage.com/errors/DUPLICATE_IDEMPOTENCY_KEY"
                      target: Idempotency-Key
                    response_id: resp_<trace-id>
                bodyMismatch:
                  summary: Same key, different body
                  value:
                    error:
                      code: IDEMPOTENCY_CONFLICT
                      message: The Idempotency-Key was already used with a different request body. Use a new key.
                      doc_url: "https://docs.moengage.com/errors/IDEMPOTENCY_CONFLICT"
                      target: Idempotency-Key
                    response_id: resp_<trace-id>
        '429':
          description: |
            Rate limit exceeded. Limits per consumer (public and MCP): 100 requests/min,
            300 requests/hour, 600 requests/day. Wait for the number of seconds in
            Retry-After before retrying.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v5/offers/templates:
    get:
      operationId: listPublicOfferTemplates
      summary: List Offer Templates
      description: |
        Fetch the personalization templates available in the workspace. Use this to discover
        valid template_id values before constructing a template-type content block in
        offer_content for POST /v5/offers or PATCH /v5/offers/{offer_id}.

        Typical agent flow: call list_offer_templates first to find a template's id, then
        pass that id as meta.templateId inside offer_content.locales["0"].variations.*.content_1
        when type is "template".
      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          List all personalization templates available in the workspace. Use this before
          creating a template-type content block in an offering, to discover valid template
          IDs and their labels.

          Returns a paginated summary — id, value (same as id), label, template_type.

          Typical agent flow:
            1. Call list_offer_templates to find the template you need (match on label).
            2. Use its id as meta.templateId in the offer_content content block.
            3. Call create_offering or update_offering with that content block.

          Pagination: pass next_cursor from the pagination object on the next call.
          Keep paginating until has_more is false.
        param_overrides:
          cursor:
            description: |
              Opaque pagination token from the previous response's next_cursor field.
              Omit on the first call. Pass verbatim — do not decode or modify.
          limit:
            description: |
              Number of templates per page. Default 20, maximum 100.
      tags:
        - Public Offerings
      security:
        - basicAuth: []      # Public consumers via APISIX
        - bearerAuth: []     # MCP agents via SGK
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination cursor returned as next_cursor in the previous response.
            Omit on the first request. Pass the value verbatim — do not decode or modify it.
            When next_cursor is null in the response, you have reached the last page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page. Default 20, max 100. Values <= 0 fall back to the default.
        - name: X-MOE-Request-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the X-MOE-Request-Id response
            header and in server logs. If omitted, the server generates a trace ID automatically.
      responses:
        '200':
          description: Paginated list of offer templates.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Trace ID echoed from the gateway.
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 150
              description: "Maximum requests allowed in the current window. Limits per consumer (Public and MCP): 150/min, 500/hour, 1000/day."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                type: object
                required: [response_id, type, data, pagination]
                properties:
                  response_id:
                    type: string
                    description: >
                      Stable trace identifier for this response. Format: "resp_" + X-MOE-Request-Id.
                      Identical on retries that carry the same X-MOE-Request-Id header, enabling
                      client-side deduplication and cross-log correlation.
                  type:
                    type: string
                    enum: [template]
                  data:
                    type: array
                    description: List of templates matching the applied pagination.
                    items:
                      $ref: '#/components/schemas/OfferTemplateListItem'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
              example:
                response_id: resp_<trace-id>
                type: template
                data:
                  - id: app_small
                    value: app_small
                    label: App small
                    template_type: []
                pagination:
                  next_cursor: null
                  limit: 20
                  has_more: false
                  total_count: 1
        '400':
          description: |
            Invalid query parameter. Possible error codes in `error.details[].code`:
            - `OUT_OF_RANGE` — `limit` > 100.
            - `INVALID_CURSOR` — `cursor` is present but malformed (not valid base64, or corrupted segment/id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: One or more fields failed validation.
                  doc_url: "https://docs.moengage.com/errors/VALIDATION_FAILED"
                  details:
                    - code: OUT_OF_RANGE
                      target: limit
                      message: "limit must be between 1 and 100."
                response_id: resp_<trace-id>
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          $ref: '#/components/responses/GatewayAuthError'
        '429':
          description: |
            Rate limit exceeded. Limits per consumer (Public and MCP): 150 requests/min,
            500 requests/hour, 1000 requests/day. Wait for the number of seconds in
            Retry-After before retrying.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  schemas:
    OfferTemplateListItem:
      description: >
        Summary representation of a personalization template returned in
        GET /v5/offers/templates list responses.
      type: object
      properties:
        id:
          type: string
          description: >
            Caller-assigned natural key for the template (not a prefixed ObjectId — §9.3
            deviation, intentional). Copy this value verbatim into
            offer_content.locales["0"].variations.*.content_1.meta.templateId when
            creating template-type content.
          example: app_small
        value:
          type: string
          description: Identical to id. Present for form-select UI compatibility.
          example: app_small
        label:
          type: string
          description: Human-readable display name of the template.
          example: App small
        template_type:
          type: array
          description: Tags describing where this template can be used. Empty if unset.
          items:
            type: string
          example: []
      example:
        id: app_small
        value: app_small
        label: App small
        template_type: []

    CursorPagination:
      description: Pagination metadata included in list responses.
      type: object
      required: [limit, has_more, total_count]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque cursor pointing to the start of the next page. Pass this value as the
            cursor query parameter on the next request. null when there are no more pages.
          example: "<base64-encoded-cursor>"
        limit:
          type: integer
          description: Number of items returned per page, matching the limit query parameter.
          example: 20
        has_more:
          type: boolean
          description: >
            Whether additional pages exist. When true, pass next_cursor on the next request.
            When false, the current page is the last page.
          example: false
        total_count:
          type: integer
          format: int64
          description: >
            Total number of items matching the applied filters — offerings and drafts for
            the offers list, templates for the templates list.
          example: 42

    ErrorResponse:
      type: object
      required: [response_id]
      properties:
        error:
          type: object
          required: [code, message, doc_url]
          properties:
            code:
              type: string
              description: Machine-readable ALL_CAPS_SNAKE_CASE error code.
              example: VALIDATION_FAILED
            message:
              type: string
              description: Human-readable explanation. Specific enough for AI agents to act on.
            target:
              type: string
              description: The field or resource that caused the error (e.g. "scheduling.expiry_datetime").
            details:
              type: array
              description: >
                Per-field error entries for VALIDATION_FAILED responses. All field violations
                are collected and returned in a single response — never truncated.
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: Field-level error code.
                  target:
                    type: string
                    description: Dot-notation path to the failing field.
                  message:
                    type: string
                    description: Human-readable description of the field-level violation.
            doc_url:
              type: string
              description: Link to documentation for this error code.
              example: "https://docs.moengage.com/errors/VALIDATION_FAILED"
        response_id:
          type: string
          description: >
            Trace identifier — same format as success responses ("resp_" + X-MOE-Request-Id).
            Always present even on error responses for log correlation.

    OfferingListItem:
      description: >
        Summary representation of an offering returned in GET /v5/offers list responses.
        Only these six fields are returned. Use the `fields` query parameter to request a
        sparse subset of them (e.g. `fields=id,name,status`).
      type: object
      properties:
        id:
          type: string
          description: >
            Stable prefixed offering identifier assigned by the server at creation.
            Format: the literal prefix "offer_" followed by the hex MongoDB ObjectId.
            Use this value as the {offer_id} path parameter in PATCH /v5/offers/{offer_id}.
          example: offer_example
        name:
          type: string
          description: Unique display name of the offering within the workspace.
          example: Summer_Sale_Promo_2026
        status:
          type: string
          description: >
            Current lifecycle status of the offering (always lowercase).
            "active" — offering is live and eligible to be returned by Decision Policies.
            "scheduled" — start_datetime is in the future; not yet live.
            "expired" — expiry_datetime has passed; no longer served.
            "archived" — manually archived; excluded from decisioning.
            "draft" — incomplete; not yet published.
          enum: [active, scheduled, expired, archived, draft]
          example: active
        tags:
          type: array
          description: >
            Prefixed tag IDs attached to this offering (format: "tag_" + raw tag ObjectId).
            Example: "tag_<object-id>". When passing tag IDs in POST/PATCH
            requests, both the prefixed format ("tag_<id>") and the raw format ("<id>")
            are accepted. Tags are used for offer grouping and Decision Policy selection.
          items:
            type: string
          example: [tag_<object-id>]
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the offering was first created.
          example: "2026-01-15T09:00:00Z"
        created_by:
          type: string
          description: Email address of the user who created this offering.
          example: marketing-team@example.com
      example:
        id: offer_example
        name: Summer_Sale_Promo_2026
        status: active
        tags: [summer-sale, returning-users]
        created_at: "2026-01-15T09:00:00Z"
        created_by: marketing-team@example.com

    ClientOfferCreateRequest:
      description: |
        Request body for creating a new offering via the public API (POST /v5/offers).

        Required fields: name, priority, delivery, created_by, scheduling,
        segment_info, offer_content, variation_meta.

        variation_meta can be edited later via PATCH, subject to status-based rules:
        while the offering is "scheduled" the whole object is editable; once "active",
        only the distribution split and control-group percentages can change (the A/B
        type and variant key names lock) to preserve accumulated Thompson Sampling data.
        See PATCH /v5/offers/{offer_id} for the full rules.

        Supply the Idempotency-Key request header (UUID v4) to safely retry on network
        failures without duplicate creation. The same key returns the original 201
        response for 24 hours without re-executing the create operation.
      type: object
      required: [name, priority, delivery, created_by, scheduling, segment_info, offer_content, variation_meta]
      properties:
        name:
          type: string
          description: >
            Unique display name for this offering within the workspace. Names are
            case-sensitive and must be globally unique. Allowed characters: alphanumeric
            characters and underscores (_) ONLY. Spaces, hyphens, and all other special
            characters are NOT permitted — returns INVALID_OFFER_NAME if violated.
            Good: "Summer_Sale_2026". Bad: "Summer Sale" or "Summer-Sale".
          minLength: 5
          maxLength: 100
          pattern: '^[A-Za-z0-9_]+$'
          example: Summer_Sale_Promo_2026
        description:
          type: string
          description: >
            Optional free-text description of the offering's purpose, targeting rationale,
            or expected user experience. Visible in the MoEngage UI offering list.
          maxLength: 500
          example: 20% discount for returning users who have not purchased in 30 days
        priority:
          type: integer
          description: >
            Static priority score for offer ranking. Lower number means higher priority
            (1 is highest priority, 100 is lowest). This score is used when the Decision
            Policy ranking_strategy is OFFER_PRIORITY. When using AI_AUTO_OPTIMIZE
            (Thompson Sampling), this value acts as the initial seed weight and is
            gradually overridden by observed click and conversion performance data.
          minimum: 1
          maximum: 100
          example: 10
        delivery:
          type: string
          description: >
            Controls when the offering is eligible for delivery.
            "scheduled" means the offering is time-bounded: it becomes eligible at
            scheduling.start_datetime and expires at scheduling.expiry_datetime.
            The offering status is "scheduled" before the start time and transitions
            to "active" automatically at the start time.
            "trigger" means delivery is event-driven; the scheduling window still applies
            as a validity gate but delivery is initiated by a specific user action.
          enum: [trigger, scheduled]
          example: scheduled
        created_by:
          type: string
          format: email
          description: >
            Email address of the team member creating this offering. This value is
            recorded in the audit log and displayed in the offering edit history panel
            in the UI. Must be a valid email address.
          example: marketing-team@example.com
        tags:
          type: array
          description: >
            Tag IDs to attach to this offering. Each tag ID must already exist in the
            workspace — the service returns 400 INVALID_TAG_ID for any unknown tag ID.
            Tags are NOT auto-created; create and manage them in the MoEngage dashboard.
            At most 10 tags per offering.
          items:
            type: string
            maxLength: 50
          maxItems: 10
          example: [tag_<object-id>]
        scheduling:
          $ref: '#/components/schemas/OfferSchedulingCreate'
        segment_info:
          $ref: '#/components/schemas/OfferSegmentInfo'
        offer_content:
          $ref: '#/components/schemas/OfferContent'
        variation_meta:
          $ref: '#/components/schemas/OfferVariationMeta'
        capping_rules:
          $ref: '#/components/schemas/OfferCappingRules'
        is_global_control_enabled:
          type: boolean
          description: >
            When true, users who are members of the workspace-level Global Control Group
            (GCG) are excluded from receiving this offering. The GCG is a holdout group
            managed separately via the GCG API and represents users who should never be
            influenced by personalisation. Default false means all eligible users can
            receive this offering regardless of GCG membership.
          default: false
        imp_track_hours:
          type: integer
          description: >
            Impression de-duplication window in hours. After this offering is shown to a
            user, the same offering will not be shown again to that user within this window.
            This prevents over-exposure without requiring explicit user-level capping.
            Minimum 1 hour, maximum 240 hours (10 days).
          minimum: 1
          maximum: 240
          example: 24
        offering_attribute_configuration:
          type: array
          description: >
            Custom attribute assignments for this offering. These attributes are used in
            Decision Policy custom scoring formulas to rank offers by user-specific attribute
            match scores. At most 5 attributes can be attached per offering. Each entry must
            reference a pre-configured Offering Attribute from
            GET /v1/settings/decisioning/attributes.
          items:
            $ref: '#/components/schemas/OfferAttributeConfigurationRequest'
          maxItems: 5
        conversion:
          $ref: '#/components/schemas/ConversionDto'
          description: >
            Conversion goal configuration for measuring offering effectiveness.
            This can be set at creation time or later via PATCH while the offering is
            still in "scheduled" status. Once the offering goes "active", the conversion
            configuration is locked to preserve Thompson Sampling statistical integrity.
        attribution_multiplier:
          type: integer
          description: >
            Optional multiplier applied to conversion attribution scoring, used in
            custom formula-based Decision Policy ranking to amplify this offering's
            conversion signal. Any positive integer is accepted (no enforced range);
            use 1 for standard attribution. When omitted, the value is null and no
            multiplier is applied.
          example: 1

    ClientOfferPatchRequest:
      description: |
        Request body for partially updating an existing offering via the public API
        (PATCH /v5/offers/{offer_id}). PATCH semantics apply: only fields present in
        the request body are modified. Omitted fields retain their current values.

        VARIATION_META (editable, status-gated): variation_meta can be updated, but which
        sub-fields you may change depends on the offering status and variation type:
          - "scheduled": the entire object is editable (type, variantsPerLocale,
            smv_distribution, control_group).
          - "active" + SMV: only smv_distribution.split percentages and
            control_group.percentage are editable; type and variant key names are locked.
          - "active" + DMV: only control_group.percentage is editable; type,
            variantsPerLocale, and smv_distribution are locked.
        Changing a locked sub-field returns 400 IMMUTABLE_FIELD.

        STATUS-GATED FIELDS: conversion can only be updated when the offering status
        is "scheduled". Attempting to update it on an "active" or "expired" offering
        returns 400 IMMUTABLE_FIELD.

        SCHEDULING CONSTRAINT: scheduling.start_datetime can only be changed when the
        offering status is "scheduled". Once the offering transitions to "active", the
        start time is locked. The expiry_datetime can always be updated regardless of
        status to extend or shorten an active campaign.
      type: object
      required: [updated_by]
      properties:
        updated_by:
          type: string
          format: email
          description: >
            Email address of the team member making this update. Always recorded in the
            audit log regardless of which other fields are changed in the request.
          example: marketing-team@example.com
        name:
          type: string
          description: >
            Updated display name for the offering. Must remain unique within the workspace.
            Allowed characters: alphanumeric characters and underscores (_) only.
            Spaces, hyphens, and special characters are NOT permitted — returns INVALID_OFFER_NAME.
          minLength: 5
          maxLength: 100
          pattern: '^[A-Za-z0-9_]+$'
        description:
          type: string
          description: Updated free-text description of the offering's purpose.
          maxLength: 500
        priority:
          type: integer
          description: Updated static priority score (1 = highest priority, 100 = lowest).
          minimum: 1
          maximum: 100
        tags:
          type: array
          description: >
            Replacement tag list. This is a FULL REPLACEMENT, not an additive operation.
            The entire existing tag list is overwritten with this value. To add a single
            tag, send the complete current tag list plus the new tag. To remove all tags,
            send an empty array. Each tag ID must already exist in the workspace — returns
            400 INVALID_TAG_ID if not.
          items:
            type: string
            maxLength: 50
          maxItems: 10
        scheduling:
          $ref: '#/components/schemas/OfferSchedulingPatch'
        segment_info:
          $ref: '#/components/schemas/OfferSegmentInfo'
        offer_content:
          $ref: '#/components/schemas/OfferContent'
        variation_meta:
          $ref: '#/components/schemas/OfferVariationMeta'
        capping_rules:
          $ref: '#/components/schemas/OfferCappingRules'
        is_global_control_enabled:
          type: boolean
          description: >
            Toggle GCG holdout exclusion. When true, GCG members are excluded from
            receiving this offering. When false, all eligible users can receive it.
        imp_track_hours:
          type: integer
          description: Updated impression de-duplication window in hours (1 to 240).
          minimum: 1
          maximum: 240
        offering_attribute_configuration:
          type: array
          description: >
            Replacement custom attribute configuration. This is a FULL REPLACEMENT —
            the entire existing attribute list is overwritten. At most 5 attributes.
          items:
            $ref: '#/components/schemas/OfferAttributeConfigurationRequest'
          maxItems: 5
        conversion:
          $ref: '#/components/schemas/ConversionDto'

    OfferSchedulingCreate:
      description: |
        Scheduling window that bounds when an offering is eligible for delivery.
        Both start_datetime and expiry_datetime are required when creating an offering.
        The server converts these to UTC using the supplied timezone for accurate
        daylight-saving-time handling. The offering status transitions automatically:
        "scheduled" before start_datetime, "active" between start and expiry,
        "expired" after expiry_datetime.
      type: object
      required: [start_datetime, expiry_datetime]
      properties:
        start_datetime:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC datetime when the offering becomes eligible for delivery.
            MUST use the UTC "Z" suffix format (e.g. "2026-06-15T09:00:00Z").
            Offset strings like "+05:30" or "+00:00" are NOT accepted and return
            INVALID_TYPE. Must be a future datetime — past values return INVALID_SCHEDULING.
            The offering transitions from "scheduled" to "active" at this moment.
          example: "2026-06-15T09:00:00Z"
        expiry_datetime:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC datetime when the offering expires and stops being served.
            MUST use the UTC "Z" suffix format (e.g. "2026-09-30T23:59:59Z").
            Offset strings like "+05:30" or "+00:00" are NOT accepted and return INVALID_TYPE.
            Must be strictly after start_datetime. After this moment, the offering
            transitions to "expired" and is excluded from all Decision Policy responses.
          example: "2026-09-30T23:59:59Z"
        timezone:
          type: string
          description: >
            IANA timezone name (e.g. "Asia/Kolkata", "America/New_York", "Europe/London", "UTC").
            Used to anchor the schedule to a geographic timezone so that daylight-saving
            transitions are handled correctly. When omitted, UTC is assumed.
          example: Asia/Kolkata

    OfferSchedulingPatch:
      description: |
        Partial scheduling update for PATCH operations. All fields are optional.
        start_datetime can only be changed when offering status is "scheduled" — it
        is locked once the offering goes "active".
        expiry_datetime can always be updated (even for active offerings) to extend
        or shorten a running campaign.
      type: object
      properties:
        start_datetime:
          type: string
          format: date-time
          description: >
            Updated start datetime. MUST use UTC "Z" suffix (e.g. "2026-06-20T09:00:00Z").
            Offset strings like "+05:30" return INVALID_TYPE. Editable ONLY when offering
            status is "scheduled" — returns 400 IMMUTABLE_FIELD if offering is active.
          example: "2026-06-20T09:00:00Z"
        expiry_datetime:
          type: string
          format: date-time
          description: >
            Updated expiry datetime. MUST use UTC "Z" suffix (e.g. "2026-10-31T23:59:59Z").
            Offset strings like "+05:30" return INVALID_TYPE. Must be in the future and
            after start_datetime. Can be updated regardless of offering status.
          example: "2026-10-31T23:59:59Z"
        timezone:
          type: string
          description: >
            Updated IANA timezone name. Relevant when also updating start_datetime
            or expiry_datetime to ensure correct daylight-saving handling.
          example: Asia/Kolkata

    OfferSegmentInfo:
      description: |
        Segment targeting configuration that controls which users are eligible to
        receive this offering. The filter structure is a pass-through to the
        MoEngage Segmentation Service (UIS). The decisioning service does not
        validate filter field internals — validation is performed by the
        segmentation service when the offering is saved.

        included_filters: criteria a user MUST match to be eligible.
        excluded_filters: criteria that DISQUALIFY a user even if they match the
        included filters (applied after inclusion check).

        To target all users with no segmentation, send an empty filters object:
        { "filters": {} }
      type: object
      properties:
        filters:
          type: object
          description: >
            Container for inclusion and exclusion filter blocks. Pass an empty object
            to target all users with no segmentation restriction.
          properties:
            included_filters:
              type: object
              description: >
                Inclusion criteria. Users matching these filters are eligible for this
                offering. The structure follows the UIS filter format: a "filters" array
                of individual filter objects and a "filter_operator" (AND or OR) that
                controls how the filters in the array are combined.
              properties:
                filters:
                  type: array
                  description: >
                    Array of individual filter criteria. Each item is a filter object
                    whose structure varies by filter_type. Common filter_type values:
                    "ACTIONS" — event-based filter with action_name, execution count,
                    and time range fields.
                    "USER_ATTRIBUTES" — user profile attribute filter with name,
                    operator, data_type, and value fields.
                  items:
                    type: object
                    description: A single UIS filter criterion. Structure varies by filter_type.
                filter_operator:
                  type: string
                  description: >
                    Logical operator applied across the filters array.
                    "AND" means the user must match ALL filters in the array.
                    "OR" means the user must match AT LEAST ONE filter.
                  enum: [AND, OR]
                  example: AND
            excluded_filters:
              type: object
              description: >
                Exclusion criteria. Users matching any of these filters are disqualified
                from receiving the offering, even if they satisfy the included_filters.
              properties:
                filters:
                  type: array
                  items:
                    type: object
                filter_operator:
                  type: string
                  enum: [AND, OR]
      example:
        filters:
          included_filters:
            filter_operator: AND
            filters:
              - filter_type: USER_ATTRIBUTES
                name: last_purchase_days_ago
                operator: GREATER_THAN
                data_type: NUMBER
                value: [30]
          excluded_filters:
            filter_operator: AND
            filters: []

    OfferContent:
      description: |
        Offering content payload delivered to the user. Two mutually exclusive formats
        are supported — choose based on whether you need per-variation or per-locale content.

        FLAT FORMAT (no A/B variants, single locale):
        Send a "content_1" object at the root level. The same content is served to
        all eligible users. Use this for simple offerings with no A/B testing.

        NESTED FORMAT (A/B variants or multiple locales):
        Send a "locales" map. Each key is a locale identifier (e.g. "default", "en",
        "fr-CA"). Within each locale, a "variations" map keys variation IDs (which must
        match the IDs defined in variation_meta.smv_distribution.split) to their
        respective content blocks. Use this format when variation_meta.type is SMV or DMV.

        Do not send both "content_1" and "locales" in the same request.
      type: object
      properties:
        content_1:
          $ref: '#/components/schemas/ContentBlock'
          description: >
            Primary content block for flat (single-variant, single-locale) offerings.
            Mutually exclusive with the "locales" field. Use when variation_meta is
            absent or when there is only one content variant.
        locales:
          type: object
          description: >
            Per-locale content map for multi-locale or multi-variant offerings.
            For single-locale offerings (most common), use "0" as the locale key — this
            is the canonical single-locale identifier and is what all examples demonstrate.
            For multi-locale offerings, use IANA locale codes (e.g. "en", "fr-CA", "de").
            Each value contains a "variations" map.
          additionalProperties:
            type: object
            description: Content container for a single locale.
            required: [variations]
            properties:
              variations:
                type: object
                description: >
                  Per-variation content map. Each key is a variation ID that MUST
                  match a key in variation_meta.smv_distribution.split. Each value
                  contains a content_1 block for that specific variation.
                additionalProperties:
                  type: object
                  properties:
                    content_1:
                      $ref: '#/components/schemas/ContentBlock'
      example:
        content_1:
          type: json
          value: '{"headline":"Save 20% today","cta_text":"Claim offer","image_url":"https://cdn.example.com/banner.png","cta_url":"https://example.com/offer/summer"}'

    ContentBlock:
      description: |
        A single content payload unit. The "type" field controls how "value" is
        interpreted and rendered by the client application.

        "json" — value is a serialised JSON string containing the offer personalisation
        payload (headlines, body text, CTA labels, image URLs, deep links, etc.).
        Parse the value string on the client side to access the structured object.
        This is the most common type for programmatic integrations.

        "content_block" — value is the ID of a pre-built content block stored in the
        MoEngage Content Block library. The rendering platform resolves the block at
        delivery time.

        "template" — value is a JSON object of the template's field values, and
        meta.templateId carries the template id (from GET /v1/offers/templates). The
        server requires only meta.templateId and value for template content; block_id
        is optional.
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          description: Format and interpretation of the content payload.
          enum: [json, content_block, template]
          example: json
        value:
          description: >
            Content payload. Interpretation depends on `type`:

            **json** — A serialised JSON string containing the personalisation data
            (headline, body, CTA text, CTA URL, image URL, etc.). Parse this string
            on the client side to access the structured object. Send as a JSON string.
            Example: `'{"headline":"Save 20% today","cta_text":"Claim offer"}'`

            **content_block** — The content block reference ID string from the MoEngage
            Content Block library. Send as a plain string.

            **template** — A JSON object (not a string) whose keys are the field names
            defined by the template schema (retrieve from GET /v1/offers/templates).
            The mandatory fields come from the template's required configuration.
            The `meta.templateId` field must carry the template's `id` (e.g. "app_small"),
            which you obtain from the GET /v1/offers/templates response.
            Example: `{"cta_url": "https://example.com", "dark_mode": false}`
          oneOf:
            - type: string
              description: For json and content_block types.
            - type: object
              description: For template type — a map of template field names to their values.
              additionalProperties: true
          example: '{"headline":"Save 20% today","cta_text":"Claim offer"}'
        block_id:
          type: string
          description: >
            Optional template block identifier, relevant only when type is "template".
            Identifies a specific block within the referenced template. Always optional —
            it is not required for any content type.
          nullable: true
          example: block_hero_banner_v2
        meta:
          type: object
          description: >
            Key-value metadata attached to this content block.

            **Required for template type**: when `type` is "template", you MUST include
            `templateId` in this object, set to the template's `id` value returned by
            GET /v1/offers/templates (e.g. `"templateId": "app_small"`). The server uses
            this ID to look up the template schema and validate the required fields in `value`.

            For other types, use this for client-side rendering hints such as component
            version, render strategy, or feature flags. Values can be strings, numbers,
            or booleans.
          additionalProperties: true
          example:
            templateId: app_small

    OfferVariationMeta:
      description: |
        A/B testing (variation) configuration for the offering.
        EDITABLE WITH STATUS RULES — while the offering is "scheduled" the whole object
        can be changed via PATCH. Once "active", only percentage fields
        (smv_distribution.split and control_group.percentage) may change; the type and
        variant key names lock to preserve accumulated Thompson Sampling data. Changing a
        locked sub-field returns 400 IMMUTABLE_FIELD.

        SMV (Static Multi-Variant): Fixed percentage splits across up to 5 named
        variation IDs. Each user is deterministically bucketed and always receives
        the same variant. Use smv_distribution.split to define variant IDs and
        their integer percentage allocations (must sum to exactly 100).

        DMV (Dynamic Multi-Variant): Thompson Sampling. The system automatically
        learns which variant performs best over time and shifts traffic toward the
        winner. Define variation IDs and initial equal splits in smv_distribution.split
        — the server overrides these weights dynamically based on click and conversion
        signals. Requires conversion tracking to be configured.

        OCG (Offer Control Group): When control_group.is_enabled is true, a
        configurable percentage of eligible users are held out as a pure control —
        they see no offer. Holdout assignment uses a deterministic hash of
        userId + offerId for consistent per-user bucketing. Control group members
        receive the CID suffix "9" in delivery tracking events.
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >
            Variation strategy type.
            "SMV" (Static Multi-Variant) — fixed percentage splits, no learning.
            "DMV" (Dynamic Multi-Variant) — Thompson Sampling with adaptive traffic allocation.
          enum: [SMV, DMV]
          example: SMV
        variantsPerLocale:
          type: array
          description: >
            Ordered list of variation IDs that apply to each locale in the offer_content.
            This list MUST contain exactly the same keys defined in smv_distribution.split
            and must match the variation keys used in offer_content.locales[locale].variations.
            The server validates that all three sources of variation keys are consistent.
            Example: if smv_distribution.split has keys "Variant_A" and "Variant_B",
            variantsPerLocale must be ["Variant_A", "Variant_B"] (order can differ).
          items:
            type: string
          example: [Variant_A, Variant_B]
        smv_distribution:
          type: object
          description: >
            Variation percentage allocation. Required when type is SMV.
            For DMV, provide as the initial equal splits — the server will override
            these over time as performance data accumulates.
          properties:
            split:
              type: object
              description: >
                Map of variation ID to integer percentage allocation. Variation IDs are
                arbitrary alphanumeric strings (e.g. "var_1", "control", "banner_v2").
                All values must be positive integers and must sum to exactly 100.
                The same variation IDs are used as keys in the offer_content.locales
                nested format to associate content with each variant.
              additionalProperties:
                type: integer
                minimum: 1
                maximum: 100
              example:
                var_1: 70
                var_2: 30
        control_group:
          type: object
          description: >
            Offer-level Control Group (OCG) configuration. When enabled, a percentage
            of eligible users are held out as a pure control and receive no offer.
            This operates independently of the workspace-level GCG.
          properties:
            is_enabled:
              type: boolean
              description: Whether the offer-level control group holdout is active.
              example: false
            percentage:
              type: integer
              description: >
                Percentage of eligible users to hold out (1 to 100, required when is_enabled
                is true). When is_enabled is false, percentage is ignored — send 0 or omit it.
                When is_enabled is true, valid range is 1–100; sending 0 returns OUT_OF_RANGE.
                Holdout assignment is deterministic per user per offering (hash of userId + offerId),
                ensuring a user is consistently in or out of the holdout across sessions.
              minimum: 0
              maximum: 100
              example: 10
      example:
        type: SMV
        variantsPerLocale: [Variant_A, Variant_B]
        smv_distribution:
          split:
            Variant_A: 70
            Variant_B: 30
        control_group:
          is_enabled: true
          percentage: 10

    OfferCappingRules:
      description: |
        Frequency capping configuration that limits how often this offering is delivered.
        Two independent capping rules can be configured and enabled simultaneously.

        overall: Limits the TOTAL number of times the offering is delivered across
        ALL users combined within the capping schedule period. Use this to cap
        total campaign volume (e.g. first 10,000 redemptions per day).

        user_level: Limits the number of times any SINGLE user can receive the
        offering within the schedule period. Use this to prevent over-exposure
        of individual users (e.g. at most 3 times per week per user).
      type: object
      properties:
        overall:
          $ref: '#/components/schemas/OfferCappingRule'
          description: Total delivery cap across all users combined.
        user_level:
          $ref: '#/components/schemas/OfferCappingRule'
          description: Per-user delivery cap limiting repeat exposure for individual users.
      example:
        overall:
          enabled: true
          limit_value: 10000
          limit_schedule: DAILY
        user_level:
          enabled: true
          limit_value: 3
          limit_schedule: WEEKLY

    OfferCappingRule:
      description: A single frequency capping rule (either overall or per-user).
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether this capping rule is enforced. When false, all other fields are ignored.
          example: true
        limit_value:
          type: integer
          description: >
            Maximum number of deliveries allowed within one limit_schedule period.
            Required when enabled is true. Must be at least 1.
            For overall capping, this is the total across all users.
            For user_level capping, this is per individual user.
          minimum: 1
          example: 3
        limit_schedule:
          type: string
          description: >
            Time window for the capping counter. The counter resets automatically
            at the start of each new period.
            "DAILY" — resets every calendar day at midnight UTC.
            "WEEKLY" — resets every Monday at midnight UTC.
            "MONTHLY" — resets on the 1st of each month at midnight UTC.
          enum: [DAILY, WEEKLY, MONTHLY]
          example: WEEKLY

    ConversionDto:
      description: |
        Conversion goal configuration for measuring offering effectiveness and powering
        Thompson Sampling optimisation. Conversion events are the primary signal used
        by the AI_AUTO_OPTIMIZE ranking strategy to learn which offers drive the most value.

        STATUS CONSTRAINT: This field can only be set or changed when the offering status
        is "scheduled". Once the offering goes "active", the conversion configuration is
        locked to preserve the statistical integrity of accumulated Thompson Sampling data.
        Attempting to update conversion on an active offering returns 400 IMMUTABLE_FIELD.
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/ConversionGoal'
          description: >
            Primary conversion goal. This is the main optimisation signal for
            Thompson Sampling — the variant that drives the most primary conversions
            will receive increased traffic allocation over time.
        secondary:
          type: array
          description: >
            Additional conversion goals tracked alongside the primary goal. Secondary
            goals are reported on but do not directly influence Thompson Sampling
            traffic allocation. Useful for multi-metric measurement (e.g. track both
            purchases and add-to-cart events).
          items:
            $ref: '#/components/schemas/ConversionGoal'

    ConversionGoal:
      description: A single conversion goal that tracks a specific user action.
      type: object
      required: [goal_name, action]
      properties:
        goal_name:
          type: string
          description: >
            Human-readable display name for this conversion goal as shown in reporting
            dashboards (e.g. "Purchase", "Sign Up", "Add to Cart").
          example: Purchase
        action:
          type: string
          description: >
            MoEngage event name to track as a conversion trigger. Must match the exact
            event name tracked via the MoEngage SDK (case-sensitive, e.g. "purchase",
            "add_to_cart", "signup_complete").
          example: purchase
        filter_type:
          type: string
          description: >
            How the conversion event is matched. "ACTIONS" matches by event name and
            optional attribute-level filters.
          example: ACTIONS
        attributes:
          $ref: '#/components/schemas/ConversionAttributesDto'
          description: >
            Optional attribute-level filters to narrow which occurrences of the action
            count as a conversion (e.g. only purchase events where category = "Electronics").
        is_revenue_tracking:
          type: boolean
          description: >
            When true, the conversion also records the monetary value from the event.
            Requires the revenue_amount and revenue_currency fields to be set.
            Revenue data is used in value-based optimisation reporting.
          default: false
        revenue_amount:
          type: string
          description: >
            Name of the event attribute containing the transaction revenue value.
            Only used when is_revenue_tracking is true. The attribute must be a
            numeric field on the tracked event (e.g. "order_value", "cart_total").
          example: order_value
        revenue_currency:
          type: string
          description: >
            ISO 4217 three-letter currency code for revenue tracking
            (e.g. "USD", "EUR", "GBP", "INR"). Only used when is_revenue_tracking is true.
          example: USD

    ConversionAttributesDto:
      type: object
      description: >
        Attribute-level filters applied to the conversion event. Allows narrowing the
        conversion signal to a specific subset of occurrences of the tracked action
        (e.g. only purchases where category equals "Electronics").
      properties:
        filters:
          type: object
          description: >
            Attribute filter definitions. Mirrors segment_info.filters — an object with
            included_filters and excluded_filters blocks, each containing a "filters"
            array of UIS filter objects and a "filter_operator" (AND or OR).
          properties:
            included_filters:
              type: object
              description: >
                Inclusion criteria for the conversion attribute filter. Contains a
                "filters" array of UIS filter objects and a "filter_operator" (AND or OR).
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    description: A single UIS filter criterion. Structure varies by filter_type.
                filter_operator:
                  type: string
                  enum: [AND, OR]
                  example: AND
            excluded_filters:
              type: object
              description: Exclusion criteria, same structure as included_filters.
              properties:
                filters:
                  type: array
                  items:
                    type: object
                filter_operator:
                  type: string
                  enum: [AND, OR]

    OfferAttributeConfigurationRequest:
      description: |
        Assignment of a custom offering attribute and its value(s) to this offering.
        Offering attributes are pre-configured via POST /v1/settings/decisioning/attribute
        and can be either FIXED (predefined dropdown options) or DYNAMIC (user-attribute
        matched at runtime). These assignments are used in Decision Policy custom scoring
        formulas to rank offers by attribute relevance for each user.
      type: object
      required: [offering_attribute_id, selected_values]
      properties:
        offering_attribute_id:
          type: string
          description: >
            ID of the Offering Attribute definition to reference. Retrieve valid IDs from
            GET /v1/settings/decisioning/attributes. Must reference an existing, non-archived
            attribute. This is the stable server-assigned ObjectId hex string.
        offering_attribute_name:
          type: string
          description: >
            Display name of the referenced Offering Attribute. The server resolves and
            populates this field on create and update responses. Optional in request bodies;
            if provided, it is ignored in favour of the ID lookup.
          example: Product Category
        type:
          type: string
          description: >
            Attribute type matching the referenced Offering Attribute definition.
            "FIXED" means the attribute has predefined dropdown options.
            "DYNAMIC" means the attribute is matched against a user profile attribute
            at query time. The server resolves this from the attribute definition if omitted.
          enum: [FIXED, DYNAMIC]
          example: FIXED
        selected_values:
          type: array
          description: >
            Selected option value(s) for this attribute assignment. At least one value is
            required. For DYNAMIC attributes, at most one value is allowed per assignment.
            For FIXED attributes, multiple values are allowed up to the attribute definition's
            max_inputs_allowed limit.
          items:
            type: object
            required: [value]
            properties:
              id:
                type: string
                description: >
                  Stable option ID from the Offering Attribute definition. Providing this
                  ensures correct matching when option display names have changed. Retrieve
                  option IDs from GET /v1/settings/decisioning/attributes/{id}.
                nullable: true
              value:
                type: string
                description: >
                  Option value string. For FIXED attributes, must match an existing option
                  name or ID in the attribute definition. For DYNAMIC attributes, this is
                  the name of the user profile attribute to match at query time (e.g.
                  "preferred_category", "last_viewed_brand").
                example: Electronics
              score:
                type: integer
                description: >
                  Priority score for this option used in custom formula weighting (0 to 100).
                  Higher score increases the offer's ranking weight when this attribute matches.
                  Set to null for dynamic attributes where scoring is computed at runtime.
                minimum: 0
                maximum: 100
                nullable: true
                example: 85
          minItems: 1


    PublicOfferCreateResponse:
      description: Response envelope returned by POST /v5/offers on successful creation.
      type: object
      required: [response_id, type, data]
      properties:
        response_id:
          type: string
          description: >
            Stable trace identifier. Format: "resp_" + X-MOE-Request-Id header value
            (or auto-generated UUID if the header was omitted). Use this to correlate
            the response with the originating request in logs and support tickets.
          example: resp_<trace-id>
        type:
          type: string
          enum: [offer]
          description: Resource type discriminator. Always "offer" for offering responses.
        data:
          type: object
          required: [id, status, created_at]
          description: Created offering summary.
          properties:
            id:
              type: string
              description: >
                Prefixed offering ID assigned by the server. Format: "offer_" + hex ObjectId.
                Use this as the {offer_id} path parameter in subsequent PATCH requests.
              example: offer_example
            status:
              type: string
              enum: [active, scheduled, expired]
              description: >
                Lifecycle status of the newly created offering.
                "scheduled" — start_datetime is in the future.
                "active" — offering is immediately live (start_datetime is in the past).
              example: scheduled
            created_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp when the offering was persisted.
              example: "2026-06-16T10:30:00Z"
      example:
        response_id: resp_<trace-id>
        type: offer
        data:
          id: offer_example
          status: scheduled
          created_at: "2026-06-16T10:30:00Z"

    PublicOfferPatchResponse:
      description: Response envelope returned by PATCH /v5/offers/{offer_id} on successful update.
      type: object
      required: [response_id, type, data]
      properties:
        response_id:
          type: string
          description: >
            Stable trace identifier. Format: "resp_" + X-MOE-Request-Id header value
            (or auto-generated UUID if the header was omitted).
          example: resp_<trace-id>
        type:
          type: string
          enum: [offer]
        data:
          type: object
          required: [id, status, updated_at]
          description: Updated offering summary.
          properties:
            id:
              type: string
              description: Prefixed offering ID.
              example: offer_example
            status:
              type: string
              enum: [active, scheduled, expired]
              description: Current lifecycle status after the update.
              example: active
            updated_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp of the update.
              example: "2026-06-16T11:00:00Z"
      example:
        response_id: resp_<trace-id>
        type: offer
        data:
          id: offer_example
          status: active
          updated_at: "2026-06-16T11:00:00Z"


  responses:
    GatewayAuthError:
      description: |
        Authentication or authorisation failure from the APISIX gateway layer.
        This response is generated by the gateway before the request reaches the service.
        The body is JSON-formatted but APISIX sends it with `Content-Type: text/plain`.
        Two gateway error codes are possible:
        - `ER001` — credentials missing or invalid (401).
        - `ER007` — credentials valid but insufficient scope for this route (403).
      content:
        text/plain:
          schema:
            type: string
            example: '{"code":"ER001","target":"Authentication Invalid","message":"Auth validation failed."}'
    ServiceUnavailable:
      description: |
        Gateway temporarily unable to route the request. Returned by APISIX/OpenResty when the
        upstream service is unreachable or the HTTP request cannot be proxied (e.g. malformed
        headers with control characters). The body is HTML from OpenResty, not JSON.
        The service itself never generates 503 — this always originates from the gateway layer.
        Treat as a transient error and retry with exponential back-off.
      content:
        text/html:
          schema:
            type: string
            example: "<html><body><h1>503 Service Temporarily Unavailable</h1></body></html>"

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Public (S2S) consumer authentication. Send a base64-encoded credential string in the
        format `appId:apiKey` as `Authorization: Basic base64(appId:apiKey)`.

        - **Username (appId)**: Use your MoEngage Workspace ID (also known as the App ID). Find it in the dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password (apiKey)**: Use your API Key, available within the **Personalize** tile.

        For more information on authentication and getting your credentials, refer [here](https://www.moengage.com/docs/api/introduction#getting-your-credentials).

        The APISIX gateway validates the credentials before the request reaches the service and
        injects the `X-MOE-Consumer-Type: public`, `X-MOE-Tenant-ID`, and `X-MOE-Scopes` headers.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Dashboard and MCP consumer auth. JWT validated by SGK (Signer + GateKeeper).
        SGK injects X-MOE-Consumer-Type: dashboard|mcp, X-MOE-Tenant-ID, and X-MOE-Scopes.
        MCP agents authenticate via OIDC token exchange through the MCP Server, which
        then calls backend routes via SGK using the user's JWT session.
        Dashboard consumers use /v1/* routes via internal DNS and are NOT routed through /v5/*.